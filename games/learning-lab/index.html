<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brick Learning Lab</title>
<meta name="description" content="Letters, numbers and typing for little builders. Every right answer adds a brick to your castle!">
<meta name="theme-color" content="#8fd3ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  /* ================= base ================= */
  :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --ink: #1b2a4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(#5bbcff, #a8e2ff 55%, #e6f8ff); font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif; user-select: none; -webkit-user-select: none; color: #fff; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
  .ol { -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }

  /* ================= home button (same in every arcade game) ================= */
  #home { position: fixed; left: calc(var(--sl) + 12px); top: calc(var(--st) + 12px); width: 56px; height: 56px; border-radius: 50%; z-index: 9999;
    background: rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(0,0,0,.3); display: grid; place-items: center; font-size: 30px; text-decoration: none; }

  /* ================= HUD ================= */
  .rbtn { width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.88); box-shadow: 0 4px 12px rgba(0,0,0,.25);
    font-size: 28px; cursor: pointer; display: grid; place-items: center; position: relative; font-family: inherit; color: var(--ink); }
  .rbtn:active { transform: scale(.9); }
  #hubBtn { position: fixed; left: calc(var(--sl) + 80px); top: calc(var(--st) + 12px); display: none; z-index: 40; background: #ffd23f; }
  #stInfo { position: fixed; left: calc(var(--sl) + 148px); top: calc(var(--st) + 14px); display: none; align-items: center; gap: 6px; z-index: 40; }
  body.in-station #hubBtn { display: grid; }
  body.in-station #stInfo { display: flex; }
  #stInfo .ic { font-size: 38px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  #stInfo .lv { width: 34px; height: 26px; border-radius: 6px; background: rgba(20,30,60,.35); display: grid; place-items: center; font-size: 15px; cursor: pointer; border: 2px solid rgba(255,255,255,.6); font-style: normal; }
  #stInfo .lv.on { background: #ffd23f; border-color: #fff; }
  #stInfo .lv.cur { transform: scale(1.2); box-shadow: 0 0 0 3px #fff, 0 0 14px #ffe066; }
  #topR { position: fixed; right: calc(var(--sr) + 12px); top: calc(var(--st) + 12px); display: flex; gap: 10px; align-items: center; z-index: 40; }
  #starBox { background: rgba(20,30,60,.45); border-radius: 30px; padding: 2px 16px 2px 8px; display: flex; align-items: center; gap: 4px; font-size: 34px; height: 56px; }
  #starBox .ico { font-size: 36px; }
  #bookBtn { width: auto; padding: 0 14px 0 10px; border-radius: 28px; display: flex; gap: 4px; font-size: 30px; }
  #bookNum { font-size: 22px; }
  #mute { width: 46px; height: 46px; font-size: 22px; }
  .bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(1.25); } }

  /* controller button badges (Xbox colours) */
  .gb { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; font: 900 14px/22px 'Arial Black', Arial, sans-serif; font-style: normal;
    text-align: center; color: #fff; border: 2px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.35); pointer-events: none; }
  .gb.A { background: #2ecc40; } .gb.B { background: #e53935; } .gb.X { background: #1e88e5; } .gb.Y { background: #f5c400; color: #3a2a00; }
  .abadge { position: absolute; right: -14px; top: -14px; bottom: auto; width: 36px; height: 36px; font-size: 18px; line-height: 32px; z-index: 5; animation: bob 1s ease-in-out infinite; }

  /* ================= bricks (used for all big choices) ================= */
  .brick { --c: #e53935; --d: #a31f1c; position: relative; background: var(--c); border-radius: 14px; cursor: pointer; display: grid; place-items: center; color: #fff;
    box-shadow: inset 0 -9px 0 rgba(0,0,0,.16), inset 0 6px 0 rgba(255,255,255,.28), 0 8px 0 var(--d), 0 14px 20px rgba(0,0,0,.22); margin-top: 14px; transition: transform .14s; }
  .studs { position: absolute; left: 0; right: 0; top: -12px; height: 14px; display: flex; justify-content: space-evenly; pointer-events: none; }
  .studs i { width: 24%; height: 100%; background: var(--c); border-radius: 7px 7px 2px 2px; box-shadow: inset 0 4px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.12); }
  .brick .lab { -webkit-text-stroke: 4px rgba(0,0,0,.28); paint-order: stroke fill; text-shadow: 0 5px 0 rgba(0,0,0,.22); line-height: 1; }
  .brick .sub { position: absolute; right: 9%; bottom: 7%; font-size: .32em; opacity: .9; -webkit-text-stroke: 2px rgba(0,0,0,.25); paint-order: stroke fill; }
  .hl { transform: translateY(-6px) scale(1.08); outline: 6px solid #fff; outline-offset: 5px; z-index: 3; }
  .hl.brick { box-shadow: inset 0 -9px 0 rgba(0,0,0,.16), inset 0 6px 0 rgba(255,255,255,.28), 0 8px 0 var(--d), 0 0 0 14px rgba(255,214,0,.45), 0 18px 26px rgba(0,0,0,.25); }
  .glow { animation: glow .8s ease-in-out infinite !important; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 6px #fff, 0 0 26px 10px #ffe066, 0 8px 0 var(--d); transform: scale(1.05); } 50% { box-shadow: 0 0 0 10px #fff, 0 0 50px 22px #ffd23f, 0 8px 0 var(--d); transform: scale(1.14) rotate(-2deg); } }
  .wob { animation: wob .5s !important; }
  @keyframes wob { 20% { transform: rotate(-9deg) scale(.95); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-5deg); } 80% { transform: rotate(3deg); } }
  .right { animation: right .6s !important; filter: brightness(1.15); }
  @keyframes right { 30% { transform: scale(1.25, .8) translateY(8px); } 60% { transform: scale(.9, 1.2) translateY(-24px); } 100% { transform: scale(1); } }
  .press { animation: press .18s; }
  @keyframes press { 50% { transform: scale(1.12, .86); } }
  .pop-in { animation: popin .45s cubic-bezier(.3,1.6,.5,1) backwards; }
  @keyframes popin { 0% { transform: scale(0) rotate(-12deg); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-8px) scale(1.05); } }
  @keyframes floaty { 50% { transform: translateY(-10px) rotate(2deg); } }

  /* ================= hub ================= */
  #hub { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: flex-end; align-items: center; padding: 0 16px calc(var(--sb) + 4vh); pointer-events: none; }
  #hub.show { display: flex; }
  #hubTitle { position: absolute; top: calc(var(--st) + 80px); left: 50%; transform: translateX(-50%) rotate(-2deg); font-size: clamp(28px, min(5vw, 8vh), 60px); color: #ffd23f; white-space: nowrap;
    -webkit-text-stroke: 4px #c8102e; paint-order: stroke fill; text-shadow: 0 6px 0 #7a0a1c, 0 10px 18px rgba(0,0,0,.3); }
  #cards { display: flex; gap: clamp(14px, 2.6vw, 34px); pointer-events: auto; align-items: flex-end; justify-content: center; }
  .card { width: clamp(140px, 21vw, 260px); height: clamp(150px, min(23vw, 38vh), 280px); flex-direction: column; gap: 6px; border-radius: 26px; }
  .card .pic { font-size: clamp(48px, min(7vw, 11vh), 100px); filter: drop-shadow(0 6px 0 rgba(0,0,0,.2)); line-height: 1; }
  .card .pic small { font-size: .6em; }
  .card .nm { font-size: clamp(16px, min(2.2vw, 3.4vh), 28px); }
  .card .lvls { display: flex; gap: 5px; }
  .card .lvls b { width: 18px; height: 12px; border-radius: 3px; background: rgba(0,0,0,.2); }
  .card .lvls b.on { background: #fff; box-shadow: 0 0 6px #fff; }
  .card.book { width: clamp(110px, 14vw, 180px); }
  .card.hl .pic { animation: bob .9s ease-in-out infinite; }
  @media (orientation: portrait) {
    #cards { flex-wrap: wrap; max-width: 600px; }
    .card { width: 42vw; height: min(26vh, 42vw); }
    .card.book { width: 42vw; }
    #hubTitle { top: calc(var(--st) + 84px); font-size: 8vw; }
  }

  /* ================= station stage ================= */
  #stage { position: fixed; left: 0; top: 0; bottom: 0; width: 68vw; display: none; flex-direction: column; align-items: center; justify-content: space-evenly;
    padding: calc(var(--st) + 76px) 16px calc(var(--sb) + 12px) calc(var(--sl) + 16px); }
  #stage.show { display: flex; }
  @media (max-width: 760px) { #stInfo { top: calc(var(--st) + 76px); left: calc(var(--sl) + 14px); } #stInfo .ic { font-size: 28px; } }
  @media (orientation: portrait) { #stage { width: 100vw; top: 20vh; padding-top: 6px; padding-left: 12px; padding-right: 12px; } }
  #promptBar { display: flex; align-items: center; gap: 18px; }
  #sayBtn { width: 76px; height: 76px; border-radius: 50%; background: #ffd23f; border: 5px solid #fff; font-size: 36px; box-shadow: 0 6px 0 #c79a00, 0 10px 16px rgba(0,0,0,.25);
    cursor: pointer; position: relative; padding: 0; display: grid; place-items: center; }
  #sayBtn.talk { animation: bob .5s ease-in-out 3; }
  #sayBtn .tabk { position: absolute; left: -10px; bottom: -6px; background: #f2f2f2; color: #333; border-radius: 6px; font: 12px/18px Arial, sans-serif; padding: 0 5px; box-shadow: 0 2px 0 #999; }
  #pips { display: flex; gap: 4px; background: rgba(20,30,60,.3); padding: 6px 12px; border-radius: 24px; }
  #pips i { font-size: 26px; font-style: normal; filter: grayscale(1) brightness(1.4); opacity: .45; transition: all .3s; }
  #pips i.done { filter: none; opacity: 1; transform: scale(1.15); }
  #area { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 0; }
  #choiceSlot { display: flex; justify-content: center; }
  .bigpic { font-size: clamp(76px, min(13vw, 21vh), 180px); line-height: 1.05; filter: drop-shadow(0 8px 0 rgba(0,0,0,.18)); animation: floaty 2.4s ease-in-out infinite; }
  .bigpic.mid { font-size: clamp(60px, min(9vw, 15vh), 130px); }
  .caption { font-size: clamp(34px, 5vh, 54px); letter-spacing: 2px; }
  .caption b { color: #ffd23f; font-weight: normal; }
  .slots { display: flex; gap: 12px; }
  .slot { width: clamp(54px, min(7vw, 11vh), 92px); aspect-ratio: 1; border-radius: 14px; border: 5px dashed rgba(255,255,255,.95); background: rgba(255,255,255,.25);
    display: grid; place-items: center; font-size: clamp(34px, min(5vw, 8vh), 64px); color: #e53935; }
  .slot.next { border-color: #ffd23f; background: rgba(255,235,120,.45); animation: bob .8s ease-in-out infinite; }
  .slot.filled { border-style: solid; background: #fff; animation: popin .35s cubic-bezier(.3,1.6,.5,1); }
  .choices { display: flex; gap: clamp(14px, 3vw, 40px); justify-content: center; align-items: flex-end; flex-wrap: wrap; padding: 16px 8px 8px; }
  .choice { width: clamp(96px, min(15vw, 24vh), 200px); aspect-ratio: 5/4; font-size: clamp(50px, min(9vw, 14vh), 120px); }
  .choices.small { gap: clamp(10px, 2vw, 24px); }
  .choices.small .choice { width: clamp(62px, min(10vw, 16vh), 130px); font-size: clamp(34px, min(6vw, 9.5vh), 80px); }
  .choices.piles .choice { width: clamp(150px, min(27vw, 42vh), 340px); aspect-ratio: 4/3; font-size: clamp(22px, min(3.6vw, 5.6vh), 44px); }
  .pile { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 2px 4px; padding: 10px; line-height: 1.1; }
  @media (orientation: portrait) { .choices.piles .choice { width: 42vw; } }

  /* counting objects */
  .objs { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 16px; justify-content: center; }
  .obj { font-size: clamp(40px, min(6.4vw, 9.5vh), 82px); position: relative; cursor: pointer; line-height: 1.1; filter: drop-shadow(0 5px 0 rgba(0,0,0,.18)); }
  .obj .cnt { position: absolute; top: -6px; right: -10px; background: #fff; color: var(--ink); border-radius: 50%; width: 36px; height: 36px; font-size: 24px; display: none; place-items: center; font-style: normal; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .obj.counted .cnt { display: grid; }
  .obj.hop { animation: hop .4s; }
  @keyframes hop { 40% { transform: translateY(-26px) scale(1.15, .9); } }

  /* brick stacks for adding / taking away */
  .addrow { display: flex; align-items: flex-end; justify-content: center; gap: 44px; transition: gap .7s cubic-bezier(.5,0,.3,1.4); }
  .addrow .plus { font-size: 54px; transition: all .5s; width: 60px; text-align: center; }
  .addrow.merge { gap: 0; }
  .addrow.merge .plus { width: 0; opacity: 0; transform: scale(0); }
  .stack { display: flex; flex-direction: column-reverse; align-items: center; }
  .sb { --c: #e53935; width: clamp(46px, 6vw, 74px); height: clamp(14px, 3vh, 26px); background: var(--c); border-radius: 4px; position: relative; margin-top: 6px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.3), 0 2px 0 rgba(0,0,0,.2); }
  .sb::before, .sb::after { content: ''; position: absolute; top: -6px; width: 26%; height: 7px; background: var(--c); border-radius: 3px 3px 0 0; box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .sb::before { left: 14%; } .sb::after { right: 14%; }
  .sb.away { animation: away 1s ease-in forwards; }
  @keyframes away { 20% { transform: translateY(-12px) rotate(-8deg); } 100% { transform: translate(160px, -320px) rotate(50deg); opacity: 0; } }
  .sb.ghost { animation: none; background: transparent; box-shadow: none; outline: 3px dashed rgba(255,255,255,.8); outline-offset: -3px; }
  .sb.ghost::before, .sb.ghost::after { display: none; }
  .eq { font-size: clamp(30px, 5vh, 50px); letter-spacing: 3px; }

  /* typing rocket */
  #stage[data-st=type] { --kw: clamp(30px, min(5.3vw, 8vh), 66px); --kg: calc(var(--kw) * .14); }
  @media (orientation: portrait) { #stage[data-st=type] { --kw: clamp(26px, 8.6vw, 60px); } }
  .launch { display: flex; align-items: center; justify-content: center; gap: 4vw; min-height: clamp(110px, 22vh, 190px); }
  .balloon { --c: #e53935; width: clamp(80px, min(10vw, 17vh), 128px); aspect-ratio: .86; border-radius: 50% 50% 47% 47%; position: relative; display: grid; place-items: center;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.7) 0 9%, transparent 24%), var(--c); box-shadow: inset -9px -12px 0 rgba(0,0,0,.13);
    font-size: clamp(46px, min(6.5vw, 10vh), 82px); animation: floaty 2s ease-in-out infinite; }
  .balloon::after { content: ''; position: absolute; bottom: -40px; left: 50%; width: 2px; height: 40px; background: rgba(255,255,255,.85); }
  .balloon.popped { animation: popped .25s forwards; }
  @keyframes popped { 60% { transform: scale(1.4); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
  .scene { width: clamp(150px, 21vw, 270px); height: clamp(96px, 18vh, 160px); border-radius: 18px; border: 4px solid #fff; position: relative; overflow: hidden;
    background: linear-gradient(#8fd3ff 0 60%, #6cd36b 60%); box-shadow: 0 6px 14px rgba(0,0,0,.2); }
  .scene span { position: absolute; font-size: clamp(22px, min(3vw, 5vh), 40px); transform: translate(-50%, -50%); line-height: 1; }
  .scene span.new { animation: popin .6s cubic-bezier(.3,1.6,.5,1); }
  .kb { display: flex; flex-direction: column; align-items: center; gap: var(--kg); }
  .kb .row { display: flex; gap: var(--kg); }
  .kb .row:nth-child(2) { transform: translateX(calc(var(--kw) * .3)); }
  .kb .row:nth-child(3) { transform: translateX(calc(var(--kw) * -.2)); }
  .key { --c: #ddd; --d: rgba(0,0,0,.28); width: var(--kw); height: var(--kw); border-radius: calc(var(--kw) * .2); background: var(--c); color: var(--ink); font-size: calc(var(--kw) * .52);
    display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.28), inset 0 -4px 0 rgba(0,0,0,.1), inset 0 3px 0 rgba(255,255,255,.4); cursor: pointer; position: relative; transition: transform .1s; }
  .key.home::after { content: ''; position: absolute; bottom: 14%; left: 36%; right: 36%; height: 4px; border-radius: 2px; background: rgba(0,0,0,.35); }
  .key.target { background: #fff; color: #e53935; z-index: 2; box-shadow: 0 0 0 5px var(--c), 0 0 26px 10px #ffe066, 0 5px 0 rgba(0,0,0,.25); animation: keyb .8s ease-in-out infinite; }
  @keyframes keyb { 50% { transform: translateY(-6px) scale(1.14); } }
  .key.press { transform: translateY(4px) scale(.95); }
  .key.hl { outline-width: 5px; outline-offset: 3px; }
  .hands { display: flex; gap: calc(var(--kw) * 2.4); margin-top: calc(var(--kw) * .2); }
  .hand { position: relative; width: calc(var(--kw) * 2); height: calc(var(--kw) * 1.5); }
  .hand.r { transform: scaleX(-1); }
  .hand .palm { position: absolute; left: calc(var(--kw) * .06); bottom: 0; width: calc(var(--kw) * 1.5); height: calc(var(--kw) * .72); border-radius: calc(var(--kw) * .3) calc(var(--kw) * .3) calc(var(--kw) * .4) calc(var(--kw) * .4); background: #ffd2a6; box-shadow: inset 0 -5px 0 rgba(0,0,0,.08); }
  .hand .f { position: absolute; bottom: calc(var(--kw) * .6); width: calc(var(--kw) * .3); border-radius: calc(var(--kw) * .15); background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); transition: transform .2s; }
  .hand .f.thumb { background: #ffd2a6; transform: rotate(52deg); transform-origin: 50% 100%; }
  .hand .f.on { box-shadow: 0 0 0 3px #fff, 0 0 18px 6px #ffe066; animation: fing .7s ease-in-out infinite; }
  @keyframes fing { 50% { transform: translateY(-8px); } }
  .rocket { font-size: 44px; }

  /* flying things */
  .flyer { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; font-size: 40px; line-height: 1; }
  .flyer.letter { font-size: 56px; color: #e53935; background: #fff; border-radius: 12px; padding: 4px 12px; }

  /* ================= overlays ================= */
  #overlay { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(10,30,70,.55); padding: 80px 16px 16px; }
  #overlay.show { display: flex; }
  #panel { background: linear-gradient(#fff9e6, #ffe9b3); border-radius: 30px; border: 6px solid #fff; box-shadow: 0 12px 0 #c79a00, 0 20px 40px rgba(0,0,0,.35);
    padding: 22px; max-width: 900px; width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; color: var(--ink); animation: popin .45s cubic-bezier(.3,1.6,.5,1); }
  .bookhead { font-size: clamp(28px, 5vh, 44px); display: flex; align-items: center; gap: 12px; }
  .bookgrid { display: grid; grid-template-columns: repeat(6, clamp(40px, min(12vw, 11vh), 116px)); gap: clamp(6px, 1.4vh, 14px); justify-content: center; }
  .stk { aspect-ratio: 1; border-radius: 18px; display: grid; place-items: center; font-size: clamp(24px, min(7vw, 7vh), 62px); background: #fff; box-shadow: 0 5px 0 #e0c27a; cursor: pointer; position: relative; }
  .stk.empty { background: rgba(0,0,0,.08); box-shadow: inset 0 4px 0 rgba(0,0,0,.08); color: rgba(0,0,0,.18); cursor: default; font-size: clamp(22px, 4vh, 40px); }
  .stk.hl { outline-color: #ffb703; }
  .stk.wig { animation: right .6s; }
  .xbtn { position: absolute; right: -16px; top: -16px; width: 60px; height: 60px; border-radius: 50%; background: #e53935; color: #fff; font-size: 30px; display: grid; place-items: center; cursor: pointer; border: 4px solid #fff; box-shadow: 0 5px 0 #8e1b18; }
  .xbtn.hl { outline-color: #ffb703; }
  #resetBtn { position: absolute; left: 14px; bottom: 8px; font: 12px system-ui, sans-serif; background: none; border: 0; color: rgba(0,0,0,.35); cursor: pointer; }
  .cel { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 10px 30px; }
  .cel .stars { font-size: clamp(44px, 9vh, 80px); display: flex; gap: 6px; }
  .cel .stars span { animation: popin .5s cubic-bezier(.3,1.6,.5,1) backwards, bob 1.2s ease-in-out infinite; display: inline-block; }
  .cel .row { display: flex; gap: 40px; }
  .cel .choice { width: clamp(110px, 18vh, 160px); font-size: clamp(50px, 9vh, 76px); }
  #stickerPop { position: fixed; left: 50%; top: 45%; font-size: 150px; transform: translate(-50%, -50%) scale(0); z-index: 75; pointer-events: none; filter: drop-shadow(0 10px 0 rgba(0,0,0,.2)); }
  #stickerPop.show { animation: stick 2.2s ease-in forwards; }
  @keyframes stick { 0% { transform: translate(-50%,-50%) scale(0) rotate(-30deg); } 18% { transform: translate(-50%,-50%) scale(1.3) rotate(8deg); } 28% { transform: translate(-50%,-50%) scale(1) rotate(0); }
    70% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; } 100% { transform: translate(30vw, -45vh) scale(.15); opacity: .3; } }
  #stickerPop::before { content: ''; position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(255,240,150,.9), transparent 70%); z-index: -1; }

// =====================================================================

// =====================================================================
//  Audio: synthesized sounds + a soft music-box tune (no files)
// =====================================================================
const A = (() => {
  let ctx = null, master, sfx, mus, noise, muted = false, duck = false, nextT = 0, step = 0;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return; }

    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    mus = ctx.createGain(); mus.gain.value = CONFIG.musicVolume; mus.connect(master);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  }

  }
  function nz(t, dur, vol, type, f, f2 = 0) {
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(sfx); s.start(t); s.stop(t + dur + 0.05);
  }
  const S = {
    tick: t => tone(700, t, .07, 'sine', .12),
    select: t => { tone(520, t, .1, 'triangle', .25); tone(780, t + .07, .16, 'triangle', .25); },
    correct: t => { [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .08, .28, 'triangle', .26)); tone(2093, t + .32, .4, 'sine', .07); tone(2637, t + .4, .4, 'sine', .05); },
    part: t => { tone(880, t, .12, 'triangle', .22); tone(1320, t + .06, .16, 'triangle', .18); },
    boop: t => tone(320, t, .25, 'sine', .2, 210),
    clack: t => { nz(t, .05, .35, 'bandpass', 2400); tone(170, t, .12, 'sine', .3, 90); },
    pop: t => { nz(t, .12, .5, 'highpass', 1500); tone(900, t, .06, 'square', .06, 300); },
    whoosh: t => nz(t, .5, .28, 'bandpass', 300, 3200),
    bang: t => { nz(t, .5, .4, 'lowpass', 1800, 200); for (let i = 0; i < 6; i++) nz(t + .12 + i * .05 + Math.random() * .03, .03, .15, 'highpass', 4000); },
    hop: (t, i = 1) => tone(380 + i * 55, t, .14, 'square', .07, 620 + i * 55),
    levelup: t => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .07, .2, 'square', .08)),
    sticker: t => { for (let i = 0; i < 10; i++) tone(1200 + i * 160, t + i * .035, .18, 'sine', .08); },
    fanfare: t => [[523, 0, .14], [659, .14, .14], [784, .28, .14], [1047, .42, .35], [784, .8, .14], [1047, .94, .55]].forEach(([f, d, l]) => { tone(f, t + d, l + .1, 'triangle', .25); tone(f / 2, t + d, l + .1, 'sine', .12); }),
  };
  function play(name, arg) { if (!ctx || muted) return; try { S[name](ctx.currentTime + 0.01, arg); } catch (e) {} }
  // gentle pentatonic music box (ducks while the voice talks)
  const MEL = [0, 2, 4, 7, 4, 2, 9, 7, 0, 4, 7, 9, 12, 9, 7, 4], ROOT = 523.25;
  function update() {
    if (!ctx || muted) return;
    mus.gain.setTargetAtTime(duck ? CONFIG.musicVolume * .25 : CONFIG.musicVolume, ctx.currentTime, .15);

      const n = MEL[step % MEL.length];
      if (step % 2 === 0 || Math.random() < .5) tone(ROOT * Math.pow(2, n / 12), nextT, .6, 'sine', .5, 0, mus);
      if (step % 8 === 0) tone(ROOT / 4 * Math.pow(2, [0, 5, 7, 5][(step / 8 | 0) % 4] / 12), nextT, 1.4, 'triangle', .4, 0, mus);

  }

    init, play, update,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.7; if (ctx && !m) nextT = ctx.currentTime + .2; },

})();

// =====================================================================
//  Voice: speechSynthesis wrapper (safe when no voices exist)
// =====================================================================
const V = (() => {
  const ok = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  const PREFS = ['Google US English', 'Samantha', 'Microsoft Aria', 'Microsoft Jenny', 'Karen', 'Tessa', 'Moira', 'Google UK English Female', 'Microsoft Zira', 'Serena', 'Allison', 'Ava'];
  let voice = null, prompt = '', timer = 0;
  function choose() {
    try {
      const vs = window.speechSynthesis.getVoices() || [];
      if (!vs.length) return;
      for (const p of PREFS) { const v = vs.find(v => v.name && v.name.includes(p)); if (v) { voice = v; return; } }
      voice = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) {}
  }
  if (ok) { try { choose(); window.speechSynthesis.addEventListener('voiceschanged', choose); } catch (e) {} }

  function say(text) {
    const est = 450 + text.length * 72 / CONFIG.voiceRate;
    if (!ok || !text) return est;
    try {
      clearTimeout(timer);
      window.speechSynthesis.cancel();
      if (A.muted) return est;
      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = CONFIG.voiceRate; u.pitch = CONFIG.voicePitch; u.volume = 1;
      u.onstart = () => A.setDuck(true);
      u.onend = u.onerror = () => A.setDuck(false);
      // a tiny gap after cancel() avoids a Chrome bug where speech is silently dropped
      timer = setTimeout(() => { try { window.speechSynthesis.speak(u); } catch (e) {} }, 40);
    } catch (e) {}
    return est;
  }
  function stop() { clearTimeout(timer); try { if (ok) window.speechSynthesis.cancel(); } catch (e) {} A.setDuck(false); }
  return { say, stop, setPrompt(t) { prompt = t; }, get prompt() { return prompt; }, again() { if (prompt) say(prompt); } };
})();

// =====================================================================
//  2D effects layer (confetti, stars, fireworks) drawn on #fx
// =====================================================================
const FX = (() => {
  const cv = $('fx'), g = cv.getContext('2d'), P = [];
  const PARTY = ['#ff4d6d', '#ffd23f', '#3ec1ff', '#7ee08b', '#c38bff', '#ff9f43', '#ffffff'];
  let W = 0, H = 0, dirty = false;
  function resize() { const d = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }
  function add(p) { if (P.length < 700) P.push(p); }
  function burst(x, y, o = {}) {
    const n = o.n || 24, cols = o.colors || PARTY;
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(.35, 1) * (o.speed || 7);
      add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up ?? 2), g: o.g ?? .22, life: (o.life || 1) * rand(.6, 1.1), t: 0, size: rand(.6, 1.2) * (o.size || 9),
        c: pick(cols), shape: o.shape || pick(['rect', 'star', 'dot']), rot: rand(0, TAU), vr: rand(-.3, .3) });
    }
  }
  function confetti(n = 120) { for (let i = 0; i < n; i++) add({ x: rand(0, W), y: rand(-H * .4, -10), vx: rand(-1, 1), vy: rand(2, 5), g: .04, life: 4, t: 0, size: rand(7, 13), c: pick(PARTY), shape: pick(['rect', 'rect', 'star']), rot: rand(0, TAU), vr: rand(-.2, .2) }); }
  function firework(x, y, col) { burst(x, y, { n: 46, speed: 9, colors: [col || pick(PARTY), '#fff', '#ffd23f'], g: .1, shape: 'dot', life: 1.3, up: 0, size: 7 }); burst(x, y, { n: 12, speed: 4, g: .05, shape: 'star', up: 0, size: 12 }); }
  function star(x, y, r) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); }
  function update(dt) {
    if (!P.length) { if (dirty) { g.clearRect(0, 0, W, H); dirty = false; } return; }
    g.clearRect(0, 0, W, H); dirty = true;
    const k = dt * 60;
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.t += dt;
      if (p.t > p.life || p.y > H + 40) { P.splice(i, 1); continue; }
      p.vy += p.g * k; p.x += p.vx * k; p.y += p.vy * k; p.vx *= .985; p.rot += p.vr * k;
      g.globalAlpha = clamp(1 - (p.t / p.life - .65) / .35, 0, 1); g.fillStyle = p.c;
      if (p.shape === 'dot') { g.beginPath(); g.arc(p.x, p.y, p.size * .45, 0, TAU); g.fill(); }
      else if (p.shape === 'star') star(p.x, p.y, p.size * .7);
      else { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.size / 2, -p.size * .3, p.size, p.size * .6); g.restore(); }
    }
    g.globalAlpha = 1;
  }
  return { resize, burst, confetti, firework, update };
})();

// fly a DOM thing (star, letter, rocket...) from one screen point to another
function flyEl(html, cls, from, to, dur = 700, onEnd, arc = 120) {
  const e = h('div', 'flyer ' + cls, html); document.body.appendChild(e);
  const [x0, y0] = from, [x1, y1] = to, mx = (x0 + x1) / 2, my = Math.min(y0, y1) - arc;

}

//  Navigation: highlight + move between choices (stick, D-pad, arrows)

const badgeA = h('i', 'gb A abadge', 'A');
const Nav = {
  items: [], i: 0,
  set(items, i = 0) { this.items = items.filter(Boolean); this.i = clamp(i, 0, Math.max(0, this.items.length - 1)); this.mark(); },
  mark() {
    document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
    const el = this.items[this.i];
    if (el) { el.classList.add('hl'); el.appendChild(badgeA); } else badgeA.remove();
  },
  to(el, quiet) { const k = this.items.indexOf(el); if (k < 0) return; if (k !== this.i || !el.classList.contains('hl')) { this.i = k; this.mark(); if (!quiet) { A.play('tick'); el.__hl && el.__hl(); } } },
  move(dx, dy) {
    const cur = this.items[this.i]; if (!cur) return;
    const [cx, cy] = center(cur); let best = null, bs = Infinity, far = null, fs = -Infinity;
    for (const el of this.items) {
      if (el === cur) continue;
      const [x, y] = center(el), vx = x - cx, vy = y - cy, along = vx * dx + vy * dy, perp = Math.abs(vx * dy - vy * dx);
      if (along > 8) { const s = along + perp * 2.2; if (s < bs) { bs = s; best = el; } }
      else if (perp < 40 && -along > fs) { fs = -along; far = el; }   // wrap around the same row/column
    }
    const nx = best || far;
    if (nx) this.to(nx);
  },
  act() { const el = this.items[this.i]; if (el && el.__act) { retrigger(el, 'press'); el.__act(); } },
};

}

  const ci = Math.floor(Math.random() * CONFIG.brickColors.length);
  save.bricks += ci;
  World.flyBrick(x, y, CONFIG.brickColors[ci]);
  setTimeout(() => World.cheer(), 900);
  // adaptive difficulty
  const first = R.qMisses === 0;
  R.streak = first ? R.streak + 1 : 0;
  if (R.qMisses >= CONFIG.hintAfterMisses) R.struggle++; else if (first) R.struggle = 0;
  let msg = (extra ? extra + ' ' : '') + pick(PRAISE);
  if (R.streak >= CONFIG.levelUpStreak && L < R.st.levels.length) { setLvl(L + 1); R.streak = 0; R.struggle = 0; msg += ' Level up!'; setTimeout(showLevelUp, 600); }
  else if (R.struggle >= CONFIG.levelDownStruggles && L > 1) { setLvl(L - 1); R.struggle = 0; R.streak = 0; }
  // sticker every few stars
  const newSticker = save.stars % CONFIG.starsPerSticker === 0 && save.stars / CONFIG.starsPerSticker <= STICKERS.length;
  if (newSticker) { msg += ' Wow! A new sticker!'; setTimeout(() => showSticker(stickerCount() - 1), 1000); }
  persist();
  if (R.onRight) R.onRight();
  R.n++; updatePips();
  const d = V.say(msg);
  later(Math.max(newSticker ? 2700 : 1800, Math.min(d + 200, 4500)), nextQ, tok);
}
function wrongAnswer(el, rightEl, text) {
  R.misses++; R.qMisses++;
  A.play('boop');
  if (el) retrigger(el, 'wob');
  if (R.misses >= CONFIG.hintAfterMisses && rightEl) { rightEl.classList.add('glow'); V.say(pick(HINT)); }
  else V.say(text || (R.st && R.st.missText && R.st.missText()) || pick(ENCOURAGE));
  if (R.st && R.st.onMiss) R.st.onMiss();
}
function nextQ() {
  R.token++; R.onRight = null; R.answer = null; R.answerEl = null; R.extra = '';
  if (overlay) { R.pending = true; return; }
  if (R.n >= CONFIG.roundLength) return roundDone();
  R.misses = 0; R.qMisses = 0; R.busy = false;
  R.st.make(lvl());
  updatePips(); updateStInfo();
}
function updatePips() { $('pips').innerHTML = Array.from({ length: CONFIG.roundLength }, (_, i) => `<i class="${i < R.n ? 'done' : ''}">⭐</i>`).join(''); }
function updateStInfo() {

  const L = lvl(), el = $('stInfo');

  el.querySelectorAll('.lv').forEach(b => b.addEventListener('pointerdown', e => { e.stopPropagation(); if (overlay) return; setLvl(+b.dataset.l); R.streak = 0; R.struggle = 0; A.play('select'); nextQ(); }));
}
function showLevelUp() { const e = $('levelPop'); e.textContent = '⬆️' + R.st.levels[lvl() - 1]; retrigger(e, 'show'); A.play('levelup'); FX.confetti(50); }
function showSticker(i) {

// =====================================================================
//  Station 1: ABC Island (letters, first sounds, build a word)
// =====================================================================
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const ABC = {
  id: 'abc', name: 'A B C Island', icon: '🔤', pic: '🔤<small>🏝️</small>', color: '#ff7043', levels: ['🅰️', '🍎', '🐱'],
  make(L) { this.word = null; if (L === 1) this.match(); else if (L === 2) this.sound(); else this.build(); },
  others(t, n) { return shuffle(LETTERS.filter(x => x !== t)).slice(0, n); },
  match() {
    const t = pickNot(LETTERS, this.last); this.last = t;
    setArea(`<div class="bigpic">👂</div>`);
    const opts = shuffle([t, ...this.others(t, 2)]);
    const els = makeChoices(opts.map(v => ({ value: v, label: v, sub: v.toLowerCase() })));
    R.answer = t; R.answerEl = els[opts.indexOf(t)]; R.extra = `${t}!`;
    ask(`Find the letter ${t}!`);
  },
  sound() {
    const it = pickNot(FIRST_SOUNDS, this.lastS); this.lastS = it; const [t, w, pic] = it;
    setArea(`<div class="bigpic">${pic}</div><div class="caption ol" style="visibility:hidden"><b>${w[0]}</b>${w.slice(1)}</div>`);
    const opts = shuffle([t, ...this.others(t, 2)]);
    const els = makeChoices(opts.map(v => ({ value: v, label: v, sub: v.toLowerCase() })));
    R.answer = t; R.answerEl = els[opts.indexOf(t)]; R.extra = `${cap(w)} starts with ${t}!`;
    R.onRight = () => { const c = document.querySelector('#area .caption'); if (c) { c.style.visibility = 'visible'; retrigger(c, 'pop-in'); } };
    ask(`${cap(w)}! What sound does ${w} start with?`);
  },
  build() {
    const [w, pic] = pickNot(WORDS, this.lastW); this.lastW = WORDS.find(x => x[0] === w); this.word = w; this.pos = 0;
    setArea(`<div class="bigpic mid">${pic}</div><div class="slots">${w.split('').map((_, i) => `<div class="slot ${i ? '' : 'next'}"></div>`).join('')}</div>`);
    const set = [...new Set(w.split(''))]; const extra = shuffle(LETTERS.filter(x => !set.includes(x))).slice(0, 5 - set.length);
    this.els = makeChoices(shuffle([...set, ...extra]).map(v => ({ value: v, label: v })), { cls: 'small', onPick: (v, el) => this.pickLetter(v, el) });
    ask(`${cap(w.toLowerCase())}! Let's spell ${w.toLowerCase()}! Find the first letter.`);
  },
  needEl() { return this.word ? this.els.find(e => e.dataset.v === this.word[this.pos]) : R.answerEl; },
  pickLetter(v, el) {
    if (R.busy) return;
    const w = this.word, need = w[this.pos];
    if (v !== need) return wrongAnswer(el, this.needEl());
    const slots = document.querySelectorAll('#area .slot'), slot = slots[this.pos];
    R.misses = 0; this.pos++;
    document.querySelectorAll('.glow').forEach(e => e.classList.remove('glow'));
    slot.classList.remove('next');
    flyEl(v, 'letter', center(el), center(slot), 420, () => { slot.textContent = v; slot.classList.add('filled'); FX.burst(...center(slot), { n: 12, speed: 4 }); });
    if (this.pos >= w.length) { R.busy = true; setTimeout(() => correctAnswer(slot, `${spell(w)}. ${cap(w.toLowerCase())}!`), 460); }
    else { A.play('part'); retrigger(el, 'right'); slots[this.pos].classList.add('next'); V.say(`${v}! ` + (this.pos === w.length - 1 ? 'Now the last letter!' : 'Next letter!')); V.setPrompt(`Let's spell ${w.toLowerCase()}! Find the next letter.`); }
  },
  onLetter(L) {
    const el = (this.word ? this.els : [...document.querySelectorAll('#choiceSlot .choice')]).find(e => e.dataset.v === L);
    if (el) { Nav.to(el, true); el.__act(); } else if (!R.busy) wrongAnswer(null, this.needEl());
  },
  correctEl() { return this.needEl(); },
};

// =====================================================================
//  Station 2: Number Mountain (count, more/less, add, take away)
// =====================================================================
const NUM = {
  id: 'num', name: 'Number Mountain', icon: '🔢', pic: '🔢<small>⛰️</small>', color: '#42a5f5', levels: ['🐥', '🔟', '🐘', '➕', '➕', '➖'],
  make(L) { if (L <= 2) this.count(L === 1 ? 5 : 10); else if (L === 3) this.compare(); else if (L <= 5) this.add(L === 4 ? 5 : 10); else this.sub(); },
  numChoices(ans, hi) {
    const s = new Set([ans]); const cand = shuffle([ans - 1, ans + 1, ans - 2, ans + 2, ans + 3, ans - 3].filter(v => v >= 1 && v <= hi));
    while (s.size < 3 && cand.length) s.add(cand.shift());
    const vals = [...s].sort((a, b) => a - b);
    const els = makeChoices(vals.map(v => ({ value: v, label: v })));
    R.answer = ans; R.answerEl = els[vals.indexOf(ans)];
  },
  count(max) {
    let n; do n = ri(1, max); while (n === this.lastN && max > 1); this.lastN = n;
    const o = pickNot(OBJECTS, this.lastO); this.lastO = o;
    const a = setArea(`<div class="objs">${Array.from({ length: n }, (_, i) => `<span class="obj pop-in" style="animation-delay:${i * 110}ms">${o[0]}<i class="cnt"></i></span>`).join('')}</div>`);
    this.counted = 0; this.objs = [...a.querySelectorAll('.obj')];
    this.objs.forEach(el => el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); this.tap(el); }));
    this.objs.forEach((_, i) => later(i * 110, () => A.play('hop', i)));
    this.numChoices(n, max);
    R.extra = `${cap(NUMW[n])} ${n === 1 ? o[1] : o[2]}!`;
    ask(`How many ${o[2]}? Tap them to count!`);
  },
  tap(el, quiet) {
    retrigger(el, 'hop');
    if (el.classList.contains('counted')) { A.play('hop', +el.textContent || 1); return; }
    this.counted++; el.classList.add('counted'); el.querySelector('.cnt').textContent = this.counted;
    A.play('hop', this.counted); if (!quiet) V.say(NUMW[this.counted]);
  },
  autoCount() {   // count together out loud (help after a wrong answer, or X button)
    if (!this.objs || mode !== 'station' || R.st !== this) return;
    this.counted = 0; this.objs.forEach(o => { o.classList.remove('counted'); });
    this.objs.forEach((o, i) => later(300 + i * 750, () => { this.tap(o, true); V.say(NUMW[i + 1]); }));
  },
  compare() {
    let a = ri(1, 9), b; do b = ri(1, 9); while (Math.abs(a - b) < (this.cmpEasy ? 2 : 1)); this.cmpEasy = !this.cmpEasy;
    const o = pick(OBJECTS), more = Math.random() < .65;
    setArea(`<div class="bigpic mid">${more ? '🐘' : '🐭'}</div>`);
    const pile = n => `<span class="pile">${o[0].repeat(n)}</span>`;
    const els = makeChoices([{ value: 0, label: pile(a), color: '#ffb74d' }, { value: 1, label: pile(b), color: '#4fc3f7' }], { cls: 'piles' });
    els.forEach(e => e.querySelector('.lab').style.webkitTextStroke = '0');
    const ans = more ? (a > b ? 0 : 1) : (a < b ? 0 : 1); R.answer = ans; R.answerEl = els[ans];
    const hi = Math.max(a, b), lo = Math.min(a, b);
    R.extra = more ? `${cap(NUMW[hi])} is more than ${NUMW[lo]}!` : `${cap(NUMW[lo])} is less than ${NUMW[hi]}!`;
    ask(more ? 'Which group has more?' : 'Which group has less?');
  },
  stack(n, color) { return `<div class="stack">${Array.from({ length: n }, (_, i) => `<div class="sb pop-in" style="--c:${color};animation-delay:${i * 70}ms"></div>`).join('')}</div>`; },
  add(max) {
    const a = ri(1, max - 1), b = ri(1, max - a);
    setArea(`<div class="addrow">${this.stack(a, '#e53935')}<div class="plus">➕</div>${this.stack(b, '#1e88e5')}</div><div class="eq ol">${a} + ${b} = ?</div>`);
    later(1900, () => { document.querySelector('#area .addrow')?.classList.add('merge'); A.play('clack'); });
    this.numChoices(a + b, 10);
    R.extra = `${cap(NUMW[a])} plus ${NUMW[b]} is ${NUMW[a + b]}!`;
    R.onRight = () => { const e = document.querySelector('#area .eq'); if (e) e.textContent = `${a} + ${b} = ${a + b}`; };
    ask(`${cap(NUMW[a])} red ${a === 1 ? 'brick' : 'bricks'} and ${NUMW[b]} blue ${b === 1 ? 'brick' : 'bricks'}. How many bricks altogether?`);
  },
  sub() {
    const n = ri(3, 10), k = ri(1, Math.min(5, n - 1));
    setArea(`<div class="addrow">${this.stack(n, '#43a047')}</div><div class="eq ol">${n} − ${k} = ?</div>`);
    later(2300, () => {
      const bs = [...document.querySelectorAll('#area .sb')].slice(n - k);
      A.play('whoosh');
      bs.forEach((b, i) => { b.style.animationDelay = i * 120 + 'ms'; b.classList.remove('pop-in'); b.classList.add('away'); setTimeout(() => { b.classList.remove('away'); b.classList.add('ghost'); }, 1100 + i * 120); });
    });
    this.numChoices(n - k, 10);
    R.extra = `${cap(NUMW[n])} take away ${NUMW[k]} is ${NUMW[n - k]}!`;
    R.onRight = () => { const e = document.querySelector('#area .eq'); if (e) e.textContent = `${n} − ${k} = ${n - k}`; };
    ask(`${cap(NUMW[n])} bricks. ${cap(NUMW[k])} fly away! How many are left?`);
  },
  onDigit(d) {
    const els = [...document.querySelectorAll('#choiceSlot .choice')];
    let el;
    if (lvl() === 3) el = els[d - 1]; else el = els.find(e => +e.dataset.v === (d === 0 ? 10 : d));
    if (el) { Nav.to(el, true); el.__act(); } else if (!R.busy) wrongAnswer(null, R.answerEl);
  },
  onX() { if (lvl() <= 2) this.autoCount(); },
  onMiss() { if (lvl() <= 2 && R.misses === 1) later(900, () => this.autoCount()); },
  missText() { return lvl() <= 2 && R.misses === 1 ? "Let's count together!" : null; },
  correctEl() { return R.answerEl; },
};

// =====================================================================

const TYPE = {
  id: 'type', name: 'Typing Rocket', icon: '⌨️', pic: '⌨️<small>🚀</small>', color: '#ab47bc', levels: ['FJ', '🏠', '⬆️', '🔤', '🐱'],
  sets: ['FJ', 'ASDFGHJKL', 'ASDFGHJKLQWERTYUIOP', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],
  enter() {
    const kb = h('div', 'kb'); this.keys = {};
    KB_ROWS.forEach(row => {
      const r = h('div', 'row');
      for (const k of row) {
        const el = h('div', 'key' + (k === 'F' || k === 'J' ? ' home' : ''), k); el.dataset.v = k; el.style.setProperty('--c', FCOL[FINGER[k]]);

    });
    const hand = side => {
      const ids = side === 'l' ? ['lp', 'lr', 'lm', 'li'] : ['rp', 'rr', 'rm', 'ri'];

      return `<div class="hand ${side}"><div class="palm"></div>${ids.map((f, k) => `<i class="f" data-f="${f}" style="--c:${FCOL[f]};left:calc(var(--kw)*${(.1 + k * .36).toFixed(2)});height:calc(var(--kw)*${hs[k]})"></i>`).join('')}<i class="f thumb" style="left:calc(var(--kw)*1.5);height:calc(var(--kw)*.55);bottom:calc(var(--kw)*.3)"></i></div>`;

const STATIONS = { abc: ABC, num: NUM, type: TYPE };

// =====================================================================
//  Screens: hub, stations, round party, sticker book
// =====================================================================
function setHudMode() { document.body.classList.toggle('in-station', mode === 'station'); }
function showHub() {
  R.token++; R.st = null; R.busy = false; mode = 'hub'; setHudMode();

function roundDone() {
  R.busy = true; A.play('fanfare'); FX.confetti(160); World.cheer();
  const html = `<div class="cel"><div class="stars">${Array.from({ length: CONFIG.roundLength }, (_, i) => `<span style="animation-delay:${i * 120}ms,${i * 120}ms">⭐</span>`).join('')}</div><div class="row"></div></div>`;
  openOverlay('celebrate', html);
  const row = $('panel').querySelector('.row');

}
function openBook() {
  A.play('select');
  const n = stickerCount();

  const grid = $('panel').querySelector('.bookgrid'), items = [];
  STICKERS.forEach(([em, name], i) => {
    const got = i < n, el = h('div', 'stk' + (got ? '' : ' empty'), got ? em : '?');
    if (got) { bindAct(el, () => { retrigger(el, 'wig'); A.play('sticker'); V.say(cap(name) + '!'); FX.burst(...center(el), { n: 16, speed: 5 }); }); items.push(el); }
    grid.appendChild(el);
  });
  const x = h('div', 'xbtn', '✖<i class="gb B">B</i>'); bindAct(x, () => closeOverlay()); $('panel').appendChild(x); items.push(x);
  $('resetBtn').addEventListener('pointerdown', e => { e.stopPropagation(); if (confirm('Start over? All stars, stickers and bricks will be reset.')) { try { localStorage.removeItem(SAVE_KEY); } catch (er) {} location.reload(); } });
  Nav.set(items, 0);
  V.say(n ? `Your sticker book! You have ${n} ${n === 1 ? 'sticker' : 'stickers'}!` : 'Your sticker book! Get five stars to win a sticker!');
}
function openOverlay(kind, html) {
  if (!overlay) navSaved = { items: Nav.items, i: Nav.i };
  overlay = kind; $('panel').innerHTML = html; $('overlay').classList.add('show');
}
function closeOverlay(silent) {
  overlay = null; $('overlay').classList.remove('show'); $('panel').innerHTML = '';
  if (navSaved && !silent) Nav.set(navSaved.items, navSaved.i);
  navSaved = null;
  if (!silent && mode === 'station' && R.pending) { R.pending = false; nextQ(); }
}
$('overlay').addEventListener('pointerdown', e => { if (e.target === $('overlay') && overlay === 'book') closeOverlay(); });

// =====================================================================
//  Global actions
// =====================================================================
function goHome() { V.stop(); location.href = '../../index.html'; }
function back() {
  if (overlay === 'book') return closeOverlay();
  if (overlay === 'celebrate') return showHub();
  if (mode === 'station') { A.play('select'); showHub(); }
}
function toggleMute() { A.setMuted(!A.muted); $('mute').textContent = A.muted ? '🔇' : '🎵'; if (A.muted) V.stop(); }
function startGame() {
  if (started) return;
  started = true; A.init(); A.play('select');
  $('title').classList.add('hide');
  showHub();
}
$('hubBtn').addEventListener('pointerdown', e => { e.stopPropagation(); back(); });
$('sayBtn').addEventListener('pointerdown', e => { e.stopPropagation(); sayAgain(); });
$('mute').addEventListener('pointerdown', e => { e.stopPropagation(); toggleMute(); });
$('bookBtn').addEventListener('pointerdown', e => { e.stopPropagation(); if (started && overlay !== 'book' && overlay !== 'celebrate') openBook(); });
$('title').addEventListener('pointerdown', e => { e.preventDefault(); startGame(); });
$('home').addEventListener('click', () => V.stop());
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) V.stop(); });
addEventListener('pointerdown', () => A.init(), { capture: true });

// =====================================================================
//  Keyboard
// =====================================================================
const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
addEventListener('keydown', e => {
  if (e.code === 'Escape') { e.preventDefault(); goHome(); return; }      // Escape is only ever "home"
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (['Tab', 'Space', 'Backspace', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.code)) e.preventDefault();
  A.init();
  if (!started) { startGame(); return; }
  if (e.code === 'Tab') { sayAgain(); return; }
  if (DIRS[e.code]) { Nav.move(...DIRS[e.code]); return; }
  if (e.repeat) return;
  if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') { Nav.act(); return; }
  if (e.code === 'Backspace') { back(); return; }
  const letter = /^Key[A-Z]$/.test(e.code) ? e.code.slice(3) : (e.key && /^[a-z]$/i.test(e.key) ? e.key.toUpperCase() : null);
  const digit = /^(Digit|Numpad)[0-9]$/.test(e.code) ? +e.code.slice(-1) : null;
  const letterStation = mode === 'station' && !overlay && (R.st === ABC || R.st === TYPE);
  // M = mute, except where letters are answers (ABC Island, Typing Rocket). There, use the 🎵 button.
  if (letter === 'M' && !letterStation) { toggleMute(); return; }
  if (overlay) return;
  if (mode === 'hub' && letter === 'X') { openBook(); return; }
  if (mode !== 'station') return;
  if (letter && letterStation) R.st.onLetter(letter);
  else if (digit !== null && R.st === NUM) R.st.onDigit(digit);
});

// =====================================================================
//  Gamepad (standard mapping)
// =====================================================================
const pad = { prev: [], dir: null, t: 0 };
function pollPad(dt) {
  let gp = null;
  try { for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) if (p && p.connected) { gp = p; break; } } catch (e) {}
  if (!gp) return;
  const now = []; for (let i = 0; i < 17; i++) now[i] = !!(gp.buttons[i] && gp.buttons[i].pressed);
  const prev = pad.prev; pad.prev = now;
  if (!prev.length) return;                       // first poll: just learn the button state
  const edge = i => now[i] && !prev[i];
  if (edge(9)) return goHome();
  if (!started) { if ([0, 1, 2, 3].some(edge)) { A.init(); startGame(); } return; }
  if (edge(8)) toggleMute();
  if (edge(0)) Nav.act();
  if (edge(1)) back();
  if (edge(3)) sayAgain();
  if (edge(2)) { if (mode === 'hub' && !overlay) openBook(); else if (mode === 'station' && !overlay && R.st.onX) R.st.onX(); }
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  let dx = now[14] ? -1 : now[15] ? 1 : Math.abs(ax) > .5 ? Math.sign(ax) : 0;
  let dy = now[12] ? -1 : now[13] ? 1 : Math.abs(ay) > .5 ? Math.sign(ay) : 0;
  if (dx && dy) { if (Math.abs(ax) >= Math.abs(ay)) dy = 0; else dx = 0; }
  const key = dx || dy ? dx + ',' + dy : null;
  if (key !== pad.dir) { pad.dir = key; pad.t = .38; if (key) Nav.move(dx, dy); }
  else if (key) { pad.t -= dt; if (pad.t <= 0) { pad.t = .2; Nav.move(dx, dy); } }
}

// =====================================================================
//  Main loop
// =====================================================================
function resize() { World.resize(); FX.resize(); }
addEventListener('resize', resize);
resize();
World.restore(save.bricks);
updateBook();
let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  pollPad(dt);
  World.update(dt, time);
  FX.update(dt);
  A.update();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// small debug hook for automated tests
window.__game = {
  state: () => ({ mode, overlay, station: R.st && R.st.id, level: R.st ? lvl() : null, n: R.n, stars: save.stars, stickers: stickerCount(), bricks: World.count(), busy: R.busy, prompt: V.prompt, calls: World.calls }),
  enter: id => enterStation(id), hub: showHub, setLevel: l => { setLvl(l); nextQ(); },
  correctEl: () => R.st && R.st.correctEl(),
  answer() { const el = R.st && R.st.correctEl(); if (!el) return false; if (R.st === TYPE) TYPE.onLetter(el.dataset.v); else el.__act(); return true; },
  wrong() { const el = [...document.querySelectorAll('#choiceSlot .choice, #choiceSlot .key')].find(e => e !== R.st.correctEl() && !e.classList.contains('target')); if (el) el.__act(); return !!el; },
};
</script>
</body>
