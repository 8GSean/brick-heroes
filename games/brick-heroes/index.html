<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brick Heroes</title>
<meta name="description" content="A cheerful 3D brick-city adventure for kids. Smash, build and hunt for gold bricks.">
<meta name="theme-color" content="#8fd3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brick Heroes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #8fd3ff; font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #hud.show { opacity: 1; }

  #home { position: fixed; left: 14px; top: 14px; z-index: 50; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 3px 10px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; font-size: 30px; text-decoration: none; }
  body.touch #home { left: calc(var(--sl) + 12px); top: calc(var(--st) + 10px); }
  #studbox { position: absolute; left: 86px; top: 14px; display: flex; align-items: center; gap: 10px; }
  .stud-ico { width: 46px; height: 46px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 35% 30%, #fff, #d4dae2 45%, #8b95a3 100%);
    box-shadow: 0 4px 0 #5b6573, 0 0 0 3px #fff inset; }
  .stud-ico::after { content: ''; position: absolute; inset: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #b9c2cd); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #studnum { font-size: 46px; color: #fff; -webkit-text-stroke: 2px #1b2a4a; text-shadow: 0 4px 0 #1b2a4a; letter-spacing: 1px; }
  #studnum.pop { animation: pop .18s; }
  @keyframes pop { 50% { transform: scale(1.14); } }

  #meterwrap { position: absolute; left: 86px; top: 72px; display: flex; align-items: center; gap: 8px; }
  #meter { width: 240px; height: 22px; border-radius: 12px; background: rgba(20,30,60,.55); border: 3px solid #fff; overflow: hidden; }
  #meterfill { height: 100%; width: 0; background: linear-gradient(90deg, #ffe066, #ffb703); transition: width .3s; }
  #meterstar { font-size: 30px; filter: grayscale(1); opacity: .55; }
  #meterstar.done { filter: none; opacity: 1; animation: spin 2.5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #goldrow { position: absolute; right: 16px; top: 18px; display: flex; gap: 7px; }
  .gb { width: 34px; height: 22px; border-radius: 4px; background: #5d6778; box-shadow: 0 3px 0 #3b4250; position: relative; opacity: .55; }
  .gb::before, .gb::after { content: ''; position: absolute; top: -6px; width: 9px; height: 6px; border-radius: 3px 3px 0 0; background: inherit; }
  .gb::before { left: 5px; } .gb::after { right: 5px; }
  .gb.got { background: linear-gradient(#ffe38a, #ffb703); box-shadow: 0 3px 0 #b77a00, 0 0 12px #ffd54a; opacity: 1; animation: pop .4s; }

  #mute, #voice, #lang { position: absolute; right: 16px; top: 54px; pointer-events: auto; font-size: 30px; background: rgba(20,30,60,.45); border: 0; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; padding: 0; line-height: 50px; text-align: center; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  #voice { right: 72px; font-size: 26px; } #lang { right: 128px; font-size: 26px; }
  .off { opacity: .5; }
  #tbtns { position: absolute; right: 14px; top: 14px; display: flex; gap: 12px; direction: ltr; }
  #tbtns button { width: 62px; height: 62px; border-radius: 50%; border: 3px solid #fff; background: rgba(20,30,60,.5); font-size: 32px; cursor: pointer; padding: 0; box-shadow: 0 4px 0 rgba(0,0,0,.3); font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  #hesub { display: none; margin-top: min(18px, 2vh); font-family: 'Arial Black', Arial, system-ui, sans-serif; font-weight: 900; font-size: clamp(26px, min(6vw, 9vh), 64px); color: #ffd23f; -webkit-text-stroke: 2px #c8102e; text-shadow: 0 5px 0 #7a0a1c; direction: rtl; }
  html[lang="he"] #hesub { display: block; }
  /* RTL: keep the HUD layout as-is, only text flips */
  #hud, #title .press, #controls, #heroes, #studbox { direction: ltr; }
  .txt { unicode-bidi: plaintext; }
  html[lang="he"] .txt { font-family: 'Arial Black', Arial, system-ui, sans-serif; font-weight: 900; }

  #heroes { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 14px; align-items: flex-end; }
  .hero { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; overflow: hidden; background: #333; box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .2s; position: relative; }
  .hero img { width: 100%; height: 100%; display: block; }
  .hero.cur { transform: scale(1.3) translateY(-6px); border-color: #ffd54a; box-shadow: 0 0 20px #ffd54a, 0 4px 0 rgba(0,0,0,.35); }
  .hero.locked img { filter: grayscale(1) brightness(.35); }
  .hero.locked::after { content: '🔒'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; }

  #controls { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .ctl { display: flex; align-items: center; gap: 8px; background: rgba(20,30,60,.45); padding: 4px 12px 4px 4px; border-radius: 22px; color: #fff; font-size: 22px; }
  .btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.8); }
  .key { min-width: 32px; height: 30px; border-radius: 7px; background: #f2f2f2; color: #222; padding: 0 6px; display: grid; place-items: center; font-size: 14px; box-shadow: 0 3px 0 #999; }

  /* ---- touch devices ---- */
  :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --u: clamp(50px, 12.5vmin, 82px); }
  #touch { position: absolute; inset: 0; display: none; }
  body.touch { touch-action: none; }
  body.touch #touch { display: block; }
  body.touch #reset, body.touch #controls { display: none; }
  #stickzone { position: absolute; left: 0; bottom: 0; width: 42%; top: 28%; pointer-events: auto; touch-action: none; }
  #stick { position: absolute; width: calc(var(--u) * 1.9); height: calc(var(--u) * 1.9); margin: calc(var(--u) * -.95) 0 0 calc(var(--u) * -.95); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08) 40%, rgba(255,255,255,.22)); border: 3px solid rgba(255,255,255,.55); opacity: .45; transition: opacity .25s; pointer-events: none; }
  #stick.on { opacity: 1; transition: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * .85); height: calc(var(--u) * .85); margin: calc(var(--u) * -.425) 0 0 calc(var(--u) * -.425); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #dfe6ee 60%, #aab6c4); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #pad { position: absolute; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 14px); width: calc(var(--u) * 2.7); height: calc(var(--u) * 2.8); }
  .tb { position: absolute; width: var(--u); height: var(--u); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--u) * .46); color: #fff;
    border: 3px solid rgba(255,255,255,.9); box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.15); pointer-events: auto; touch-action: none; opacity: .88; transition: transform .06s, opacity .2s, filter .2s; }
  .tb.down { transform: translateY(3px) scale(.92); box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.15); opacity: 1; }
  .tb.jump { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); font-size: calc(var(--u) * .6); right: 0; bottom: calc(var(--u) * .2); background: #2ecc40; }
  .tb.attack { width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); right: calc(var(--u) * 1.5); bottom: 0; background: #1e90ff; }
  .tb.power { right: calc(var(--u) * 1.35); bottom: calc(var(--u) * 1.35); background: #8e44ad; }
  .tb.build { right: calc(var(--u) * .15); bottom: calc(var(--u) * 1.7); background: #e53935; }
  .tb.build.idle { opacity: .35; filter: saturate(.4); }
  .tb.build.hot { opacity: 1; animation: hot .7s ease-in-out infinite; }
  @keyframes hot { 50% { transform: scale(1.14); box-shadow: 0 0 22px #ffd54a, 0 5px 0 rgba(0,0,0,.35); } }
  #fs { display: none; }
  body.touch #fs.can { display: block; position: absolute; right: calc(var(--sr) + 16px); top: calc(var(--st) + 112px); pointer-events: auto; font-size: 24px; color: #fff; background: rgba(20,30,60,.45); border: 0; border-radius: 50%; width: 50px; height: 50px; }
  body.touch #fs.can.pulse { animation: bob 1s ease-in-out 4; }
  body.touch #heroes { z-index: 2; bottom: calc(var(--sb) + 8px); gap: 10px; }
  body.touch #heroes .hero { pointer-events: auto; width: 52px; height: 52px; border-width: 3px; }
  body.touch #studbox { left: calc(var(--sl) + 82px); top: calc(var(--st) + 10px); }
  body.touch #meterwrap { left: calc(var(--sl) + 82px); top: calc(var(--st) + 66px); }
  body.touch #goldrow { right: calc(var(--sr) + 16px); top: calc(var(--st) + 16px); }
  body.touch #mute { right: calc(var(--sr) + 16px); top: calc(var(--st) + 54px); }
  body.touch #voice { right: calc(var(--sr) + 72px); top: calc(var(--st) + 54px); }
  body.touch #lang { right: calc(var(--sr) + 128px); top: calc(var(--st) + 54px); }
  body.touch #tbtns { right: calc(var(--sr) + 14px); top: calc(var(--st) + 14px); }
  @media (orientation: portrait) {
    body.touch #studnum { font-size: 34px; } body.touch .stud-ico { width: 36px; height: 36px; } body.touch .stud-ico::after { inset: 9px; }
    body.touch #meterwrap { top: calc(var(--st) + 54px); } body.touch #meter { width: 150px; height: 18px; }
    body.touch #goldrow { top: calc(var(--st) + 96px); left: calc(var(--sl) + 18px); right: auto; gap: 5px; }
    body.touch .gb { width: 24px; height: 15px; } body.touch .gb::before, body.touch .gb::after { width: 6px; height: 4px; top: -4px; }
    body.touch #heroes { top: calc(var(--st) + 128px); bottom: auto; left: calc(var(--sl) + 18px); transform: none; }
    body.touch #heroes .hero { width: 42px; height: 42px; }
    body.touch #fs.can { top: calc(var(--st) + 10px); right: calc(var(--sr) + 74px); }
    body.touch #mute { top: calc(var(--st) + 10px); }
    body.touch #voice { top: calc(var(--st) + 66px); right: calc(var(--sr) + 16px); }
    body.touch #lang { top: calc(var(--st) + 66px); right: calc(var(--sr) + 72px); }
    body.touch #bossbar { top: calc(var(--st) + 190px); } body.touch #bossbar .bar { width: 180px; }
    #stickzone { width: 55%; top: 45%; }
  }
  @media (max-height: 500px) { .bigA { width: 72px; height: 72px; font-size: 42px; } .bigIco { font-size: 54px; } #rotate { margin-top: 10px; } }
  #tiphint { display: none; margin-top: 30px; color: #fff; font: 16px system-ui, sans-serif; background: rgba(20,30,60,.55); padding: 8px 14px; border-radius: 14px; text-align: center; max-width: 86vw; }
  #tiphint b { font-size: 26px; vertical-align: middle; }
  #rotate { display: none; margin-top: 26px; font-size: 54px; animation: rot 2.4s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.3)); }
  @keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.touch #rotate { display: block; } }
  #bossbar { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; }
  #bossbar.show { display: flex; }
  #bossbar .ico { font-size: 38px; }
  #bossbar .bar { width: 260px; height: 22px; border-radius: 12px; background: rgba(20,30,60,.6); border: 3px solid #fff; overflow: hidden; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d6d, #c9184a); transition: width .15s; }

  #goldpop { position: fixed; left: 50%; top: 42%; width: 190px; height: 90px; margin: -45px 0 0 -95px; pointer-events: none; opacity: 0; }
  #goldpop .brick { position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(#fff1b0, #ffc21a 50%, #d18f00); box-shadow: 0 8px 0 #9a6800, 0 0 60px #ffd54a; }
  #goldpop .brick::before { content: ''; position: absolute; top: -22px; left: 12px; right: 12px; height: 24px;
    background: radial-gradient(circle at 50% 100%, #ffd54a 16px, transparent 17px) 0 0 / 25% 100% repeat-x; }
  #goldpop.show { animation: goldfly 2s ease-in forwards; }
  @keyframes goldfly {
    0% { opacity: 0; transform: scale(.2) rotate(-20deg); }
    15% { opacity: 1; transform: scale(1.25) rotate(6deg); }
    25% { transform: scale(1) rotate(-3deg); }
    65% { opacity: 1; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(40vw, -40vh) scale(.2); }
  }
  #trophy { position: fixed; left: 50%; top: 30%; transform: translate(-50%,-50%); font-size: 160px; opacity: 0; pointer-events: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); }
  #trophy.show { animation: trophy 5s ease-out forwards; }
  @keyframes trophy { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); } 25% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0) 30%, rgba(0,40,90,.45)); transition: opacity .6s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(40px, min(12vw, 19vh), 150px); margin: 0; color: #ffd23f; -webkit-text-stroke: 5px #c8102e; letter-spacing: 3px; text-align: center; line-height: .92;
    text-shadow: 0 10px 0 #7a0a1c, 0 18px 24px rgba(0,0,0,.45); transform: rotate(-3deg); font-weight: normal; }
  #title .sub { margin-top: min(26px, 3vh); font-size: clamp(20px, min(3.5vw, 6vh), 40px); color: #fff; -webkit-text-stroke: 1.5px #1b2a4a; text-shadow: 0 4px 0 #1b2a4a; }
  #title .press { margin-top: min(44px, 5vh); display: flex; gap: 22px; align-items: center; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) scale(1.05); } }
  .bigA { width: 96px; height: 96px; border-radius: 50%; background: #2ecc40; color: #fff; font-size: 56px; display: grid; place-items: center; box-shadow: 0 7px 0 #1a8a28; border: 5px solid #fff; }
  .bigIco { font-size: 70px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
  #reset { position: absolute; right: 14px; bottom: 12px; font: 14px system-ui, sans-serif; background: rgba(0,0,0,.25); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; opacity: .6; }
  /* ---- play together (co-op) ---- */
  .emo { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  #coop { position: absolute; right: 184px; top: 54px; pointer-events: auto; font-size: 28px; background: rgba(20,30,60,.45); border: 0; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; padding: 0; line-height: 50px; text-align: center; }
  #coop.on { background: rgba(46,204,64,.75); }
  #coopbar { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  #coopbar.show { display: flex; }
  #cooprow { display: flex; align-items: center; gap: 6px; background: rgba(20,30,60,.5); border: 3px solid rgba(255,255,255,.85); border-radius: 30px; padding: 3px 8px; pointer-events: auto; }
  #coopbar button { border: 0; background: none; cursor: pointer; padding: 0; color: #fff; }
  #coopnet { font-size: 24px; position: relative; width: 34px; height: 34px; line-height: 34px; text-align: center; }
  #coopnet.wait { animation: blink 1s steps(2) infinite; }
  #coopnet.bad { filter: grayscale(1); opacity: .7; }
  #coopnet.bad::after { content: '❌'; position: absolute; right: -4px; bottom: -4px; font-size: 14px; line-height: 1; }
  @keyframes blink { 50% { opacity: .3; } }
  #coopcode { font-size: 34px; letter-spacing: 4px; line-height: 44px; }
  #cooplink { font-size: 22px; width: 34px; height: 34px; }
  #coopfaces { display: flex; gap: 4px; }
  #coopfaces img { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; background: #333; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  #coopfaces img.me { width: 36px; height: 36px; }
  #cooptoast { position: fixed; left: 50%; top: 28%; transform: translate(-50%, -50%); z-index: 70; pointer-events: none; opacity: 0; font-size: 84px; display: flex; align-items: center; gap: 14px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.3)); }
  #cooptoast img { width: 96px; height: 96px; border-radius: 50%; border: 6px solid #fff; background: #333; }
  #cooptoast.show { animation: toast 2.6s ease-out forwards; }
  #cooptoast.bye img { filter: grayscale(.7); }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.3); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } 22% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-70%) scale(.9); } }
  body.touch #coop { right: calc(var(--sr) + 184px); top: calc(var(--st) + 54px); }
  @media (orientation: portrait) {
    body.touch #coop { top: calc(var(--st) + 66px); right: calc(var(--sr) + 128px); }
    body.touch #coopbar { top: calc(var(--st) + 122px); left: auto; right: calc(var(--sr) + 10px); transform: none; align-items: flex-end; }
    body.touch #coopcode { font-size: 26px; }
  }
  #tchoice { margin-top: min(44px, 5vh); display: flex; gap: 34px; align-items: center; }
  #tchoice .press { margin-top: 0; border-radius: 60px; padding: 8px; }
  #tcoop { position: relative; width: 104px; height: 104px; border-radius: 50%; border: 5px solid #fff; background: #8e44ad; box-shadow: 0 7px 0 #5b2c6f; font-size: 58px; cursor: pointer; padding: 0; animation: bob 1s ease-in-out infinite .5s; }
  #tcode { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 12px; font-size: 26px; white-space: nowrap; background: rgba(20,30,60,.5); border-radius: 16px; padding: 2px 8px; }
  #tcode:empty { display: none; }
  .navving .nav.focus, #coopui .nav.focus { outline: 6px solid #ffd23f; outline-offset: 5px; box-shadow: 0 0 26px #ffd23f; }
  #coopui { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(10,20,50,.6); }
  #coopui.show { display: flex; }
  #coopui .cpanel { background: rgba(30,50,100,.88); border: 4px solid rgba(255,255,255,.7); border-radius: 30px; padding: min(18px, 2.4vh) min(22px, 3vw); display: flex; flex-direction: column; align-items: center; gap: min(14px, 1.8vh); box-shadow: 0 10px 40px rgba(0,0,0,.35); --c: min(13vh, 20vw, 96px); }
  #cslots { display: flex; gap: 10px; }
  #cslots div { width: calc(var(--c) * .8); height: calc(var(--c) * .8); border-radius: 18px; background: rgba(20,30,60,.55); border: 4px dashed rgba(255,255,255,.7); display: grid; place-items: center; font-size: calc(var(--c) * .5); }
  #cslots div.full { border-style: solid; background: #fff; animation: pop .25s; }
  #cslots.shake { animation: shakeX .35s; }
  @keyframes shakeX { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  #cgrid { display: grid; grid-template-columns: repeat(3, var(--c)); gap: min(12px, 1.5vh); }
  #coopui button { width: var(--c); height: var(--c); border-radius: 22px; border: 4px solid #fff; background: #fff6d6; font-size: calc(var(--c) * .58); cursor: pointer; padding: 0; box-shadow: 0 5px 0 rgba(0,0,0,.3); transition: transform .08s; touch-action: manipulation; }
  #coopui button:active { transform: translateY(3px) scale(.94); }
  #cacts { display: flex; gap: min(12px, 1.5vw); }
  #cacts button { background: #dfe8ff; width: calc(var(--c) * .85); height: calc(var(--c) * .85); font-size: calc(var(--c) * .45); }
  #cacts #cgo { background: #b9f5c0; }
  #cacts #cgo.ready { background: #2ecc40; animation: hot .8s ease-in-out infinite; }
  #cacts button:disabled { opacity: .35; }
  #cacts #csolo[hidden] { display: none; }
</style>
</head>
<body>

// =====================================================================
//  Audio (all synthesized, no files)
// =====================================================================
const A = (() => {
  let ctx = null, master, sfx, music, noiseBuf, nextT = 0, step = 0, muted = false;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    music = ctx.createGain(); music.gain.value = 0.2; music.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ctx.currentTime + 0.1;
    setInterval(sched, 40);
  }
  function tone(f, dur = 0.12, type = 'square', vol = 0.15, slide = 0, delay = 0) {
    if (!ctx || netQuiet) return; const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur = 0.2, vol = 0.2, freq = 1200, delay = 0, type = 'lowpass') {
    if (!ctx || netQuiet) return; const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  // --- tiny happy background loop ---
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [[48, 55, 60, 64, 67], [43, 50, 55, 59, 62], [45, 52, 57, 60, 64], [41, 48, 53, 57, 60]];
  const MEL = [[72, 0, 76, 0, 79, 0, 76, 74], [74, 0, 71, 0, 74, 0, 79, 0], [76, 0, 72, 0, 76, 79, 81, 0], [77, 0, 76, 0, 74, 0, 72, 0]];
  function note(f, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(music); o.start(t); o.stop(t + dur + 0.05);
  }
  function hat(t, vol) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(music); s.start(t); s.stop(t + 0.06);
  }
  function sched() {
    if (!ctx || ctx.state !== 'running') return;
    const SP = 0.14;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.05;
    while (nextT < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 16) % 4, s = step % 16, ch = CH[bar], t = nextT, phrase = Math.floor(step / 64) % 2;
      if (s % 4 === 0) note(mtof(ch[0] - 12), t, 0.4, 'triangle', 0.55);
      if (s % 4 === 2) note(mtof(ch[0]), t, 0.15, 'triangle', 0.3);
      note(mtof(ch[1 + (s % 4)] + 12), t, 0.09, 'square', 0.04);
      if (s % 2 === 0) { const m = MEL[bar][s / 2]; if (m) note(mtof(m + (phrase ? 12 : 0)), t, 0.22, phrase ? 'sine' : 'triangle', 0.2); }
      hat(t, s % 4 === 2 ? 0.1 : 0.04);
      step++; nextT += SP;
    }
  }
  return {
    init, tone, noise,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.6; },
    pause(p) { if (ctx) p ? ctx.suspend() : ctx.resume(); },
    get muted() { return muted; },
  };
})();

// =====================================================================
const NARRATE = { gap: 3.5, hintEvery: 45 };   // seconds between normal lines / between gentle hints

function groundAt(x, z, fromY, r = 0) {

}

    const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;

    else {

    }

let camYaw = 0, camPitch = .5;

  if (isTouch && !activePad) {   // gently swing the camera behind the hero while running, unless the player is steering it
    touch.lookT += dt; const hs = Math.hypot(player.vel.x, player.vel.z);
    if (touch.lookT > 1.2 && hs > 2 && touch.my < .5) {
      let d = (player.yaw + Math.PI) - camYaw; d = Math.atan2(Math.sin(d), Math.cos(d));

  const H = hero(), dist = 14 * (H.scale > 1 ? 1.2 : 1) + (player.flying ? 3 : 0);

    PB(1.4, 1.2, 3.2, '#e63946', 0, .6, 0), PB(1.6, .15, 3.4, '#ffffff', .05, 1.27, 0), PB(.06, .25, 3.2, '#ffffff', .72, .8, 0),

    PC(.2, 2.6, '#ffffff', .65, 2.6, -1.5), PC(.2, 2.6, '#ffffff', .65, 2.6, 1.5),

  for (let i = 0; i < 4; i++) P.push(PB(2.4, .2, .9, i % 2 ? '#ffffff' : '#e63946', -.1, 4.0, -1.35 + i * .9));
  P.push(PC(2.2, .2, '#f4a261', -.1, 4.2, 0), PC(1.9, .22, '#ffd23f', -.1, 4.22, 0));
  for (let i = 0; i < 3; i++) { const a = i / 3 * TAU + .4; P.push(PC(.4, .26, '#c1121f', -.1 + Math.cos(a) * .5, 4.24, Math.sin(a) * .5)); }

    addCol(x - .7, 0, z - 1.7, x + .8, 1.35, z + 1.7); addCol(x - 2.2, 0, z - .9, x - .8, 1.9, z + .9);
    const pizzas = []; let throwT = .5;
    b.update = (b, dt) => {
      const p = player.pos, d = Math.hypot(p.x - x, p.z - z);
      throwT -= dt;
      if (throwT <= 0 && d < 18 && d > 2.5 && pizzas.length < 4 && !player.ride) {
        throwT = CONFIG.pizzaEvery;
        const tx = p.x + player.vel.x * .5 + rand(-1.5, 1.5), tz = p.z + player.vel.z * .5 + rand(-1.5, 1.5);
        const s0 = new V3(x - .1, 4.6, z), T = .9 + d * .03, gy = groundAt(tx, tz, p.y + 2) + .05;
        const m = makePizza(); m.position.copy(s0); scene.add(m);
        pizzas.push({ m, v: new V3((tx - s0.x) / T, (gy - s0.y + 9 * T * T) / T, (tz - s0.z) / T), gy, landed: false, life: 9 });
        SFX.thwip();
      }
      for (let i = pizzas.length - 1; i >= 0; i--) {
        const q = pizzas[i], m = q.m;
        if (!q.landed) {
          q.v.y -= 18 * dt; m.position.addScaledVector(q.v, dt); m.rotation.y += dt * 12;
          if (m.position.y <= q.gy && q.v.y < 0) { m.position.y = q.gy; q.landed = true; SFX.land(); }
        } else { q.life -= dt; if (q.life < 1) m.scale.setScalar(Math.max(.01, q.life)); }
        const dx = m.position.x - p.x, dz = m.position.z - p.z, dy = m.position.y - (p.y + 1);
        if (dx * dx + dz * dz < 3.2 && Math.abs(dy) < 2.2) {
          SFX.yum(); sparkle(m.position, '#ffd23f', 12, 6, .2); burstStuds(m.position.clone(), [3, 1, 0, 0], .5);
          scene.remove(m); pizzas.splice(i, 1); continue;
        }
        if (q.life <= 0) { scene.remove(m); pizzas.splice(i, 1); }
      }
    };
  }, { say: 'bPizza' });
  keepOut.push([x - .7, z, 3.5]);
}

      const p = player.pos;
      if (b.cool <= 0 && !player.ride && !player.building && Math.hypot(p.x - x - k.position.x, p.z - z - k.position.z) < 2 && Math.abs(p.y - k.position.y) < 1.5) enterKart(b);

function enterKart(b) {
  if (player.ride || player.kart) return;
  const k = b.parts.kart;
  player.kart = b; player.pos.set(b.x + k.position.x, k.position.y, b.z + k.position.z); player.yaw = k.rotation.y; player.dance = 0;
  SFX.honk(); say('kartIn', { cool: 60 });
}
function exitKart() {
  const b = player.kart; if (!b) return;
  player.kart = null; b.cool = 1.2;
  player.vel.y = hero().jump; player.onGround = false; player.jumps = 1; SFX.jump();
}
function placeKart(dt, hs) {
  const b = player.kart, k = b.parts.kart, p = player.pos, fig = player.figs[player.hero];
  k.position.set(p.x - b.x, p.y, p.z - b.z); k.rotation.y = player.yaw;
  fig.position.x -= Math.sin(player.yaw) * .3; fig.position.z -= Math.cos(player.yaw) * .3;
  for (const q of b.wheels) q.m.rotation.x += hs * dt * 2.4;
  b.engT = (b.engT || 0) - dt;
  if (b.engT <= 0 && hs > 1) { b.engT = .12; SFX.engine(hs); }
  if (hs > 12 && Math.random() < dt * 10) smoke(new V3(p.x - Math.sin(player.yaw) * 1.8, p.y + .3, p.z - Math.cos(player.yaw) * 1.8), 1, .4, '#cccccc');
}
function kartBump(v) {   // driving fast into things smashes them
  const p = player.pos; if (Math.hypot(v.x, v.z) < 6) return;
  for (const t of targets) {
    if (!t.alive) continue;
    const dx = t.pos.x - p.x, dz = t.pos.z - p.z, d = Math.hypot(dx, dz) || .01;
    if (d < t.radius + 1.4 && Math.abs(t.pos.y - p.y) < 2.5 && (t.kartT || 0) < time) { t.kartT = time + .6; t.hit(t.big ? 1 : 3, { x: dx / d, z: dz / d }); shake(.08); rumble(.3, .3, 80); }
  }
}

  P.push(PB(1.3, 1.3, 1.3, '#343a40', 0, 1.6, -.2));
  let c = at(1.5); P.push(PC(1.4, 3, '#343a40', 0, c[1], c[2], { rx: al }));
  c = at(.7); P.push(PC(1.6, .3, '#ffd23f', 0, c[1], c[2], { rx: al }));

    const mz = at(3), muzzle = new V3(x + Math.sin(yaw) * mz[2], mz[1], z + Math.cos(yaw) * mz[2]), target = new V3(tx, ty + .05, tz);
    const dir = new V3(Math.sin(yaw) * sa, ca, Math.cos(yaw) * sa);

    const ride = { pose: 'cheer', yaw, jumpOff: false, exit: new V3(0, 0, 0), place(p, dt) {
      t += dt;
      if (phase === 0) {
        p.copy(muzzle).addScaledVector(dir, -1.4); p.y -= .6;
        b.group.scale.setScalar(1 + Math.sin(t * 30) * .03 * t);
        if (Math.random() < .5) sparkle(new V3(x - Math.sin(yaw) * .9, 2.3, z - Math.cos(yaw) * .9), '#ffb703', 2, 3, .15);
        if (Math.random() < dt * 8) SFX.click();
        if (t > 1) {
          phase = 1; t = 0; ride.pose = 'fly'; b.group.scale.setScalar(1);
          SFX.boom(); smoke(muzzle, 14, 1); confetti(muzzle, 30); ring(new V3(x, 0, z), 5, '#ffffff', .4); shake(.4); rumble(.8, .6, 300);

      const p = player.pos;
      if (b.cool <= 0 && !player.ride && Math.hypot(p.x - x, p.z - z) < 2.4 && p.y < 2.5 && startRide(ride)) { phase = 0; t = 0; ride.pose = 'cheer'; }
