<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monster Truck Junkyard</title>
<meta name="description" content="Drive a bouncy monster truck through a brick junkyard and smash everything!">
<meta name="theme-color" content="#8fd3ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    background: #8fd3ff; font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --u: clamp(52px, 12.5vmin, 84px); }

  /* ---- home button (same in every Brick Arcade game) ---- */
  #home { position: fixed; left: calc(var(--sl) + 12px); top: calc(var(--st) + 12px); width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,.82); box-shadow: 0 4px 12px rgba(0,0,0,.35); display: grid; place-items: center; font-size: 30px;
    text-decoration: none; z-index: 1000; }
  #home:active { transform: scale(.92); }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #hud.show { opacity: 1; }
  .outline { color: #fff; -webkit-text-stroke: 2px #1b2a4a; text-shadow: 0 4px 0 #1b2a4a; }

  /* smash counter + meter to the next truck */
  #scorebox { position: absolute; left: calc(var(--sl) + 82px); top: calc(var(--st) + 8px); display: flex; align-items: center; gap: 6px; }
  #scoreico { font-size: 40px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
  #scoreico.pop, #scorenum.pop { animation: pop .2s; }
  #scorenum { font-size: 44px; letter-spacing: 1px; }
  @keyframes pop { 50% { transform: scale(1.18); } }
  #meterwrap { position: absolute; left: calc(var(--sl) + 84px); top: calc(var(--st) + 66px); display: flex; align-items: center; gap: 6px; }
  #meter { width: 190px; height: 20px; border-radius: 12px; background: rgba(20,30,60,.55); border: 3px solid #fff; overflow: hidden; }
  #meterfill { height: 100%; width: 0; background: linear-gradient(90deg, #ff9f1c, #ffd23f); transition: width .3s; }
  #nextpic { width: 58px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.7); border: 2px solid #fff; }
  #nextpic img { width: 100%; height: 100%; filter: brightness(0) opacity(.45); }
  #nextpic.none { display: none; }

  /* truck pictures */
  #trucks { position: absolute; left: 50%; top: calc(var(--st) + 8px); transform: translateX(-50%); display: flex; gap: 8px; }
  .tk { width: 70px; height: 50px; border-radius: 12px; background: rgba(255,255,255,.72); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25);
    position: relative; pointer-events: auto; cursor: pointer; transition: transform .2s; }
  .tk img { width: 100%; height: 100%; display: block; }
  .tk.cur { transform: scale(1.2) translateY(5px); border-color: #ffd23f; background: #fff8d6; box-shadow: 0 0 18px #ffd23f, 0 4px 0 rgba(0,0,0,.25); }
  .tk.locked { background: rgba(20,30,60,.45); }
  .tk.locked img { filter: brightness(0) opacity(.4); }
  .tk.locked::after { content: '🔒'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; }
  .tk.new { animation: wiggle .5s 4; }
  @keyframes wiggle { 25% { transform: rotate(-10deg) scale(1.25); } 75% { transform: rotate(10deg) scale(1.25); } }

  /* big targets */
  #targets { position: absolute; right: calc(var(--sr) + 12px); top: calc(var(--st) + 8px); display: grid; grid-template-columns: repeat(4, 44px); gap: 6px; }
  .tg { width: 44px; height: 44px; border-radius: 50%; background: rgba(20,30,60,.5); border: 3px solid rgba(255,255,255,.7); display: grid; place-items: center; font-size: 23px; position: relative; }
  .tg span { filter: grayscale(1) opacity(.55); }
  .tg.done { background: radial-gradient(circle at 35% 30%, #fff6c0, #ffc21a); border-color: #fff; box-shadow: 0 0 12px #ffd23f; }
  .tg.done span { filter: none; }
  .tg.done::after { content: '✔'; position: absolute; right: -6px; bottom: -6px; width: 20px; height: 20px; border-radius: 50%; background: #2ecc40; color: #fff; font-size: 13px; display: grid; place-items: center; border: 2px solid #fff; }
  .tg.flash { animation: pop .35s 3; }
  #mute { position: absolute; right: calc(var(--sr) + 12px); top: calc(var(--st) + 112px); pointer-events: auto; font-size: 26px; background: rgba(20,30,60,.45); border: 0; border-radius: 50%; width: 48px; height: 48px; cursor: pointer; }

  /* controller hints */
  #controls { position: absolute; left: calc(var(--sl) + 12px); bottom: calc(var(--sb) + 12px); display: flex; flex-direction: column; gap: 5px; }
  .ctl { display: flex; align-items: center; gap: 7px; background: rgba(20,30,60,.45); padding: 3px 12px 3px 3px; border-radius: 22px; color: #fff; font-size: 21px; }
  .btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; box-shadow: 0 3px 0 rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.85); }
  .btn.sh { border-radius: 9px; width: 40px; font-size: 12px; }
  .key { min-width: 30px; height: 28px; border-radius: 7px; background: #f2f2f2; color: #222; padding: 0 6px; display: grid; place-items: center; font-size: 13px; box-shadow: 0 3px 0 #999; }

  /* touch controls */
  #touch { position: absolute; inset: 0; display: none; }
  body.touch #touch { display: block; }
  body.touch #controls { display: none; }
  #stickzone { position: absolute; left: 0; bottom: 0; width: 45%; top: 30%; pointer-events: auto; touch-action: none; }
  #stick { position: absolute; width: calc(var(--u) * 1.9); height: calc(var(--u) * 1.9); margin: calc(var(--u) * -.95) 0 0 calc(var(--u) * -.95); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08) 40%, rgba(255,255,255,.25)); border: 3px solid rgba(255,255,255,.6); opacity: .45; pointer-events: none; }
  #stick.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * .85); height: calc(var(--u) * .85); margin: calc(var(--u) * -.425) 0 0 calc(var(--u) * -.425); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #dfe6ee 60%, #aab6c4); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #pad { position: absolute; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 14px); width: calc(var(--u) * 3); height: calc(var(--u) * 3); }
  .tb { position: absolute; width: var(--u); height: var(--u); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--u) * .46); color: #fff;
    border: 3px solid rgba(255,255,255,.92); box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.15); pointer-events: auto; touch-action: none; opacity: .9; transition: transform .06s; }
  .tb.down { transform: translateY(3px) scale(.9); opacity: 1; }
  .tb.a { width: calc(var(--u) * 1.25); height: calc(var(--u) * 1.25); left: calc(var(--u) * .875); bottom: 0; background: #2ecc40; }
  .tb.b { right: 0; top: calc(var(--u) * 1); background: #e53935; }
  .tb.x { left: 0; top: calc(var(--u) * 1); background: #1e90ff; }
  .tb.y { left: calc(var(--u) * 1); top: 0; background: #f4c20d; }

  /* popups */
  #unlockpop { position: fixed; left: 50%; top: 40%; width: 260px; height: 184px; margin: -92px 0 0 -130px; pointer-events: none; opacity: 0;
    border-radius: 28px; background: radial-gradient(circle, #fffbe0, #ffd23f); border: 6px solid #fff; box-shadow: 0 0 60px #ffd23f, 0 10px 0 rgba(0,0,0,.25); }
  #unlockpop img { width: 100%; height: 100%; }
  #unlockpop.show { animation: unlock 3s ease-out forwards; }
  @keyframes unlock { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 12% { opacity: 1; transform: scale(1.2) rotate(6deg); } 20% { transform: scale(1) rotate(-3deg); }
    80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-40vh) scale(.3); } }
  #bigpop { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: 150px; opacity: 0; pointer-events: none; filter: drop-shadow(0 10px 18px rgba(0,0,0,.4)); }
  #bigpop.show { animation: bigpop 2.2s ease-out forwards; }
  @keyframes bigpop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.35) rotate(8deg); }
    25% { transform: translate(-50%,-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(30vw,-45vh) scale(.25); } }
  #trophy { position: fixed; left: 50%; top: 36%; transform: translate(-50%,-50%); font-size: 190px; opacity: 0; pointer-events: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); }
  #trophy.show { animation: trophy 7s ease-out forwards; }
  @keyframes trophy { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); } 10% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); } 18% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-50%) scale(1.1) rotate(-5deg); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1); } }

  /* title screen */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0) 30%, rgba(60,20,0,.45)); transition: opacity .6s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(38px, min(10vw, 16vh), 130px); margin: 0; color: #ffd23f; -webkit-text-stroke: 5px #c8102e; letter-spacing: 3px; text-align: center; line-height: .95;
    text-shadow: 0 10px 0 #7a0a1c, 0 18px 24px rgba(0,0,0,.45); transform: rotate(-3deg); font-weight: normal; }
  #title h1 small { display: block; font-size: .62em; color: #7ee36b; -webkit-text-stroke: 4px #1f6b12; text-shadow: 0 8px 0 #0f3d08, 0 14px 20px rgba(0,0,0,.4); }
  #title .truck { font-size: clamp(50px, 12vh, 110px); animation: drive 1.2s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.3)); }
  @keyframes drive { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-18px) rotate(-8deg); } 60% { transform: translateY(0) rotate(3deg); } }
  #title .press { margin-top: min(36px, 4vh); display: flex; gap: 22px; align-items: center; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) scale(1.05); } }
  .bigA { width: 92px; height: 92px; border-radius: 50%; background: #2ecc40; color: #fff; font-size: 54px; display: grid; place-items: center; box-shadow: 0 7px 0 #1a8a28; border: 5px solid #fff; }
  .bigIco { font-size: 68px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }

  @media (max-width: 900px) {
    #trucks { top: calc(var(--st) + 112px); left: calc(var(--sl) + 12px); transform: none; gap: 6px; }
    .tk { width: 54px; height: 39px; }
    #targets { grid-template-columns: repeat(4, 36px); gap: 4px; }
    .tg { width: 36px; height: 36px; font-size: 19px; }
    #mute { top: calc(var(--st) + 94px); }
  }
  @media (max-height: 520px) { .bigA { width: 70px; height: 70px; font-size: 40px; } .bigIco { font-size: 52px; } #controls { display: none; } }
</style>
</head>

<a id="home" href="../../index.html" title="Home">🏠</a>

<div id="hud">
  <div id="scorebox"><div id="scoreico">💥</div><div id="scorenum" class="outline">0</div></div>
  <div id="meterwrap"><div id="meter"><div id="meterfill"></div></div><div id="nextpic"><img alt=""></div></div>

</div>
<div id="unlockpop"><img alt=""></div>
<div id="bigpop"></div>
<div id="trophy">🏆</div>

</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
//  CONFIG: tweak me!
// =====================================================================
const CONFIG = {
  arena: 88,                 // half size of the walled arena (metres)
  gravity: 30,
  truck: {
    accel: 28,               // how fast it speeds up
    maxSpeed: 22,            // normal top speed
    turboSpeed: 36,          // top speed with X turbo
    turboAccel: 50,
    reverseSpeed: 10,
    turnRate: 3.2,           // how quickly it turns (radians / second)
    grip: 6,                 // higher = less sliding sideways
    jump: 15,                // A jump strength
    airJump: 12,             // second jump in the air (with a flip!)
    bounce: 0.32,            // how bouncy landings are
    radius: 2.3,             // smash radius
  },
  driveMode: 'stick',        // 'stick' = push where you want to go (easiest). RT/LT always switch to gas/reverse steering.
  camera: { dist: 14, pitch: 0.4, follow: 1.4 },
  rebuildDelay: 9,           // seconds before smashed things hop back into place
  rampMax: 4,                // how many B-ramps can exist at once
  targetDone: 0.6,           // fraction of a big target that must be knocked down
  unlocks: [0, 80, 250, 500, 900, 1500],   // smash points needed for each truck
  studMagnet: 10,
  halfpipe: { x: -60, z: -5, len: 34, flat: 6, curve: 8, h: 8 },
  hills: [[0, -70, 4, 9], [70, -62, 5, 10], [-70, 72, 4, 10], [78, 38, 4, 8], [30, 80, 3, 8], [-8, 30, 1.6, 5]],
  puddles: [[-14, -32, 5], [40, -14, 5], [-26, 44, 5], [24, 46, 6], [66, -28, 5]],
  colors: { dirt: '#cf8d4e', dirt2: '#b9773d', grass: '#62bd4a', pipe: '#86b6e6', sky: '#8fd3ff' },
};

// =====================================================================
//  Helpers
// =====================================================================
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const angLerp = (a, b, t) => a + wrapA(b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const srng = mulberry32(4242);
const sr = (a, b) => a + srng() * (b - a);
const spick = arr => arr[Math.floor(srng() * arr.length)];
function shade(hex, amt) { const c = new THREE.Color(hex); const h = {}; c.getHSL(h); c.setHSL(h.h, h.s, clamp(h.l + amt, 0, 1)); return '#' + c.getHexString(); }
const colorCache = {};
const col = hex => colorCache[hex] || (colorCache[hex] = new THREE.Color(hex));
const ARENA = CONFIG.arena;
const BRIGHT = ['#e53935', '#ff9f1c', '#ffd23f', '#2ecc40', '#1e90ff', '#8e44ad', '#ff66c4', '#00bcd4'];

// =====================================================================
//  Save data
// =====================================================================
const SAVE_KEY = 'brick-arcade-monster-trucks';
let save = { score: 0, targets: [false, false, false, false, false, false, false, false], skin: 0, party: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
let saveDirty = false;
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} saveDirty = false; }

// =====================================================================
//  Audio (all synthesized)
// =====================================================================
const A = (() => {
  let ctx = null, master, sfx, noiseBuf, muted = false, eng = null, crowd = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // --- engine: two detuned oscillators, "putt-putt" tremolo, lowpass ---
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), lfo = ctx.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'square'; lfo.type = 'square';
    const am = ctx.createGain(); am.gain.value = 0.6;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.35;
    const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 400; filt.Q.value = 3;
    const g = ctx.createGain(); g.gain.value = 0;
    o1.connect(am); o2.connect(am); lfo.connect(lfoG); lfoG.connect(am.gain); am.connect(filt); filt.connect(g); g.connect(master);
    o1.frequency.value = 45; o2.frequency.value = 22; lfo.frequency.value = 8;
    o1.start(); o2.start(); lfo.start();
    eng = { o1, o2, lfo, filt, g };
    // --- crowd murmur ---
    const cs = ctx.createBufferSource(); cs.buffer = noiseBuf; cs.loop = true;
    const cf = ctx.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 900; cf.Q.value = 0.7;
    const cg = ctx.createGain(); cg.gain.value = 0.012;
    cs.connect(cf); cf.connect(cg); cg.connect(master); cs.start();
    crowd = { cf, cg };
  }
  function tone(f, dur = 0.12, type = 'square', vol = 0.15, slide = 0, delay = 0) {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur = 0.2, vol = 0.2, freq = 1200, delay = 0, type = 'lowpass', q = 1) {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfx); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  function engine(speed, throttle, turbo) {
    if (!eng) return; const t = ctx.currentTime;
    const f = 34 + speed * 2.6 + throttle * 12 + (turbo ? 18 : 0);
    eng.o1.frequency.setTargetAtTime(f, t, 0.06); eng.o2.frequency.setTargetAtTime(f * 0.501, t, 0.06);
    eng.lfo.frequency.setTargetAtTime(7 + speed * 0.6, t, 0.1);
    eng.filt.frequency.setTargetAtTime(260 + speed * 30 + throttle * 200 + (turbo ? 700 : 0), t, 0.08);
    eng.g.gain.setTargetAtTime(0.05 + throttle * 0.04 + Math.min(speed, 30) * 0.0015, t, 0.1);
  }
  function crowdLevel(v) { if (crowd) { crowd.cg.gain.setTargetAtTime(0.012 + v * 0.16, ctx.currentTime, 0.15); crowd.cf.frequency.setTargetAtTime(900 + v * 700, ctx.currentTime, 0.2); } }
  return {
    init, tone, noise, engine, crowdLevel,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.6; },
    pause(p) { if (ctx) p ? ctx.suspend() : ctx.resume(); },
    get muted() { return muted; },
    get ready() { return !!ctx; },
  };
})();
let voiceT = 0;
function say(text) {
  if (A.muted || !window.speechSynthesis || time - voiceT < 1.2) return; voiceT = time;
  try { const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; u.pitch = 1.5; u.volume = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
const semi = (f, n) => f * Math.pow(2, n / 12);
let sndGate = {};
function gate(name, gap) { if (time - (sndGate[name] || -9) < gap) return false; sndGate[name] = time; return true; }
const SFX = {

let score = save.score;

    for (const pc of s.pieces) if (pc.state === 0 && pc.sup && pc.sup.every(b => b.state !== 0)) { knock(pc, rand(-1.5, 1.5), rand(0, 1.5), rand(-1.5, 1.5), 2.5); changed = true; }

  Object.assign(input, { mx, my, cx: clamp(cx, -1, 1), cy: clamp(cy, -1, 1), gas, brake, jump: edge('jump'), turbo: !!btn.turbo, horn: edge('horn'), ramp: edge('ramp'), next: edge('next'), prev: edge('prev'), direct: -1 });
  for (let i = 0; i < 6; i++) if (edge('d' + i)) input.direct = i;
  if (edge('mute')) toggleMute();
  if (edge('home') && started) goHome();
  prevBtn = btn;
}

// =====================================================================
//  Camera (follows on its own; right stick / mouse drag to look around)
// =====================================================================
const cam = { yaw: 0, pitch: CONFIG.camera.pitch, look: new V3(0, 2, 8), manualT: 9, shake: 0 };
function shake(v) { cam.shake = Math.max(cam.shake, v); }
function updateCamera(dt) {
  const C = CONFIG.camera, hs = Math.hypot(truck.vel.x, truck.vel.z);
  const manual = Math.abs(input.cx) > 0.05 || Math.abs(input.cy) > 0.05 || Math.abs(mouseDX) + Math.abs(mouseDY) > 0;
  cam.manualT = manual ? 0 : cam.manualT + dt;
  cam.yaw -= input.cx * 2.6 * dt + mouseDX * 0.006; cam.pitch = clamp(cam.pitch + input.cy * 1.2 * dt + mouseDY * 0.003, 0.12, 1.2); mouseDX = mouseDY = 0;
  if (cam.manualT > 1.5) {
    if (hs > 2 && !truck.held) cam.yaw = angLerp(cam.yaw, truck.yaw - Math.PI, 1 - Math.exp(-dt * C.follow * Math.min(1, hs / 10)));
    cam.pitch = lerp(cam.pitch, C.pitch, 1 - Math.exp(-dt * 0.8));
  }
  const dist = C.dist + Math.min(8, hs * 0.18) + (truck.held ? 6 : 0);
  const tgt = _c.set(truck.pos.x + truck.heading.x * hs * 0.12, truck.pos.y + 2.6, truck.pos.z + truck.heading.z * hs * 0.12);
  cam.look.x = lerp(cam.look.x, tgt.x, 1 - Math.exp(-dt * 10)); cam.look.z = lerp(cam.look.z, tgt.z, 1 - Math.exp(-dt * 10));
  cam.look.y = lerp(cam.look.y, tgt.y, 1 - Math.exp(-dt * (truck.onGround ? 6 : 3)));
  const p = camera.position.set(cam.look.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * dist, cam.look.y + Math.sin(cam.pitch) * dist, cam.look.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * dist);
  const lim = ARENA + 8; p.x = clamp(p.x, -lim, lim); p.z = clamp(p.z, -lim, lim);
  p.y = Math.max(p.y, groundAt(p.x, p.z) + 1.5);
  if (cam.shake > 0) { p.x += rand(-1, 1) * cam.shake; p.y += rand(-1, 1) * cam.shake; cam.shake = Math.max(0, cam.shake - dt * 1.8); }
  camera.lookAt(cam.look);
  sun.position.set(truck.pos.x + 35, truck.pos.y + 70, truck.pos.z + 25); sun.target.position.copy(truck.pos);
}

// ---- guide arrow + floating picture markers over the big targets ----
const guide = new THREE.Group();
const guideCone = new THREE.Mesh(G.cone, new THREE.MeshBasicMaterial({ color: '#ffd23f', toneMapped: false })); guideCone.rotation.x = Math.PI / 2; guideCone.scale.set(0.9, 1.3, 0.9); guide.add(guideCone);
scene.add(guide);
function iconTexture(emoji, done) {
  const c = cv(128, 128), g = c.getContext('2d');
  g.fillStyle = done ? '#ffd23f' : '#ffffff'; g.beginPath(); g.arc(64, 64, 58, 0, TAU); g.fill();
  g.lineWidth = 8; g.strokeStyle = done ? '#2ecc40' : '#e53935'; g.stroke();
  g.font = '72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(done ? '⭐' : emoji, 64, 70);
  return tex(c);
}
function makeMarkers() {
  for (const t of TARGETS) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: iconTexture(t.icon, false), depthTest: true, fog: false }));
    sp.scale.set(5, 5, 1); sp.position.set(t.x, t.s.base + t.s.top + 5, t.z); scene.add(sp); t.marker = sp;
    if (save.targets[TARGETS.indexOf(t)]) setMarkerDone(t);
  }
}
function setMarkerDone(t) { t.marker.material.map = iconTexture(t.icon, true); t.marker.material.needsUpdate = true; t.marker.scale.set(3.5, 3.5, 1); }
function updateMarkers() {
  TARGETS.forEach((t, i) => { t.marker.position.y = t.s.base + t.s.top + 5 + Math.sin(time * 2 + i) * 0.6; });
  let best = null, bd = 1e9;
  TARGETS.forEach((t, i) => { if (save.targets[i]) return; const d = Math.hypot(t.x - truck.pos.x, t.z - truck.pos.z); if (d < bd) { bd = d; best = t; } });
  guide.visible = !!best && bd > 24 && started;
  if (!guide.visible) return;
  const dx = best.x - truck.pos.x, dz = best.z - truck.pos.z, l = Math.hypot(dx, dz);
  guide.position.set(truck.pos.x + dx / l * 3, truck.pos.y + 6.2 + Math.sin(time * 4) * 0.25, truck.pos.z + dz / l * 3);
  guide.lookAt(best.x, guide.position.y, best.z);
  guideCone.material.color.set(Math.sin(time * 6) > 0 ? '#ffd23f' : '#fff3b0');
}

// =====================================================================
//  HUD, progress, unlocks, the big party
// =====================================================================
let shownScore = save.score;
function addScore(n) {
  const before = unlockedCount();
  save.score += n; saveDirty = true;
  const after = unlockedCount();
  if (after > before) unlockTruck(after - 1);
}
function unlockTruck(i) {
  const pop = $('unlockpop'); pop.querySelector('img').src = TRUCK_PICS[i];
  pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show');
  SFX.unlock(); say('New truck!'); cheer(1);
  setTimeout(() => { setSkin(i, true); const el = $('trucks').children[i]; if (el) { el.classList.add('new'); setTimeout(() => el.classList.remove('new'), 2200); } }, 900);
  refreshTruckHUD();
}
function refreshTruckHUD() {
  const u = unlockedCount();
  $('trucks').innerHTML = SKINS.map((s, i) => `<div class="tk ${i === save.skin ? 'cur' : ''} ${i < u ? '' : 'locked'}"><img src="${TRUCK_PICS[i]}" alt=""></div>`).join('');
  const np = $('nextpic');
  if (u < SKINS.length) { np.classList.remove('none'); np.querySelector('img').src = TRUCK_PICS[u]; } else np.classList.add('none');
}
function refreshTargetHUD(flash = -1) {
  $('targets').innerHTML = TARGETS.map((t, i) => `<div class="tg ${save.targets[i] ? 'done' : ''} ${i === flash ? 'flash' : ''}"><span>${t.icon}</span></div>`).join('');
}
function targetDone(i) {
  save.targets[i] = true; saveDirty = true; persist();
  const t = TARGETS[i]; setMarkerDone(t);
  const bp = $('bigpop'); bp.textContent = t.icon; bp.classList.remove('show'); void bp.offsetWidth; bp.classList.add('show');
  SFX.target(); cheer(1.2); say(['Wow!', 'Smashing!', 'Awesome!', 'Kaboom!'][i % 4]);
  for (let k = 0; k < 3; k++) launchFirework(t.x + rand(-6, 6), t.z + rand(-6, 6), k * 0.25);
  addScore(25); spawnStuds(new V3(t.x, t.s.base + 2, t.z), 12);
  setTimeout(() => refreshTargetHUD(i), 900);
  if (save.targets.every(Boolean) && !save.party) { save.party = true; saveDirty = true; setTimeout(bigParty, 2200); }
}
let party = 0;
function bigParty() {
  party = 14; const tr = $('trophy'); tr.classList.remove('show'); void tr.offsetWidth; tr.classList.add('show');
  SFX.unlock(); SFX.cheer(); setTimeout(() => say('Hooray! You smashed everything!'), 600); cheer(1.2);
}
const rockets = [];
function launchFirework(x, z, delay = 0) { rockets.push({ x, z, y: 2, vy: rand(26, 34), t: -delay, fuse: rand(1.0, 1.4), c: spick(BRIGHT) }); }
function updateFireworks(dt) {
  if (party > 0) { party -= dt; if (Math.random() < dt * 3) launchFirework(rand(-60, 60), rand(-60, 60)); if (Math.random() < dt * 0.8) SFX.cheer(); }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.t += dt; if (r.t < 0) continue;
    if (r.t < dt * 1.5) SFX.rocket();
    r.y += r.vy * dt; r.vy -= 8 * dt;
    fx(glowFX, r.x, r.y, r.z, { vy: -2, life: 0.4, s: 0.35, color: '#fff3b0', grav: -4 });
    if (r.t > r.fuse) {
      rockets.splice(i, 1); SFX.bang();
      const c2 = spick(BRIGHT);
      for (let k = 0; k < 70; k++) { const a = rand(0, TAU), b = Math.acos(rand(-1, 1)), sp = rand(14, 20); fx(glowFX, r.x, r.y, r.z, { vx: Math.sin(b) * Math.cos(a) * sp, vy: Math.cos(b) * sp, vz: Math.sin(b) * Math.sin(a) * sp, life: rand(1.2, 1.8), s: rand(0.4, 0.7), color: k % 3 ? r.c : c2, grav: -6, drag: 1.6 }); }
    }
  }
}
function updateHUD(dt) {
  if (shownScore !== save.score) {
    const diff = save.score - shownScore;
    shownScore = diff > 0 ? Math.min(save.score, shownScore + Math.max(1, Math.ceil(diff * Math.min(1, dt * 8)))) : save.score;
    $('scorenum').textContent = shownScore.toLocaleString();
    if (Math.random() < 0.3) { const e = $('scorenum'); e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
  }
  const u = unlockedCount(), U = CONFIG.unlocks;
  const m = u >= U.length ? 1 : (save.score - U[u - 1]) / (U[u] - U[u - 1]);
  $('meterfill').style.width = (clamp(m, 0, 1) * 100).toFixed(1) + '%';
}
function renderControls() {
  if (isTouch && !usingPad) { $('controls').innerHTML = ''; return; }
  const b = (t, c, cls = '') => `<div class="btn ${cls}" style="background:${c}">${t}</div>`, k = t => `<div class="key">${t}</div>`;
  const rows = usingPad
    ? [[b('A', '#2ecc40'), '⬆️'], [b('X', '#1e90ff'), '🔥'], [b('Y', '#f4c20d'), '📯'], [b('B', '#e53935'), '🧱'], [b('LB', '#555', 'sh') + b('RB', '#555', 'sh'), '🛻']]
    : [[k('⬆️⬇️⬅️➡️'), '🛻'], [k('Space'), '⬆️'], [k('Shift'), '🔥'], [k('H'), '📯'], [k('B'), '🧱'], [k('Q') + k('1-6'), '🔄']];
  $('controls').innerHTML = rows.map(r => `<div class="ctl">${r[0]}<span>${r[1]}</span></div>`).join('');
}

// =====================================================================
//  Build the world
// =====================================================================
function buildWorld() {
  // launch ramps aimed at the big targets
  addRamp(0, -24, Math.PI, 10, 7, 3.2, 3, ['#ff9f1c', '#ffd23f']);
  addRamp(30, -30, Math.atan2(20, -20), 10, 7, 3.4, 3, ['#e53935', '#f5f5f5']);
  addRamp(0, 36, 0, 10, 7, 3.2, 3, ['#1e90ff', '#7fd1ff']);
  addRamp(38, 38, Math.atan2(20, 22), 9, 6, 3.0, 3, ['#2ecc40', '#c6f36b']);
  addRamp(-34, 30, Math.atan2(-18, 24), 9, 6, 3.0, 3, ['#8e44ad', '#ff66c4']);
  addRamp(-26, -48, Math.atan2(-14, -10), 9, 6, 2.8, 3, ['#ff9f1c', '#e53935']);
  addRamp(66, -6, Math.PI / 2, 10, 8, 4.2, 3.5, ['#ffd23f', '#e53935']);
  addRamp(-6, -6, -Math.PI / 2, 8, 6, 2.2, 2.5, ['#00bcd4', '#ffffff']);
  buildTerrain();
  buildArena();
  addCrusher(-22, -20); addCrusher(26, -72);
  buildCrane();
  buildStructures();
  makePieceMeshes();
  makeMarkers();
}
let time = 0;
buildWorld();
setSkin(Math.min(save.skin, unlockedCount() - 1));
truck.pos.y = groundAt(truck.pos.x, truck.pos.z);
truck.onGround = true;

// =====================================================================
//  Main loop
// =====================================================================
let started = false, last = performance.now(), persistT = 0;
function anyInput() {
  A.init();
  if (started) return;
  started = true;
  $('title').classList.add('hide'); $('hud').classList.add('show');
  refreshTargetHUD(); refreshTruckHUD(); renderControls();
  $('scorenum').textContent = save.score.toLocaleString();
  SFX.unlock(); cheer(1);
  prevBtn = { jump: true, turbo: true, horn: true, ramp: true, next: true, prev: true, mute: true, home: true };
  truck.yaw = Math.PI; cam.yaw = 0;
}
let fpsN = 0, fpsT0 = 0;
function governFPS(now) {
  if (!fpsT0 || !started) { fpsT0 = now; fpsN = 0; return; } fpsN++;
  if (now - fpsT0 < 3000) return;
  const avg = (now - fpsT0) / fpsN; fpsT0 = now; fpsN = 0;
  if (avg > 24 && pixelCap > 1 && !document.hidden) { pixelCap = Math.max(1, pixelCap - 0.25); renderer.setPixelRatio(Math.min(devicePixelRatio, pixelCap)); fitView(); }
}
function actions() {
  if (input.horn) {
    HORNS[hornI++ % HORNS.length](); truck.stretch = 1; cheer(0.35);
    const h = truck.heading; for (let i = 0; i < 8; i++) fx(glowFX, truck.pos.x + h.x * 3, truck.pos.y + 2.5, truck.pos.z + h.z * 3, { vx: h.x * 10 + rand(-3, 3), vy: rand(1, 4), vz: h.z * 10 + rand(-3, 3), life: 0.5, s: 0.35, color: spick(BRIGHT), grav: 0, drag: 2 });
    for (const pc of pieces) if (pc.state === 0 && pc.p.distanceTo(truck.pos) < 16) { pc.wob = 1; activate(pc); }
  }
  if (input.ramp) buildRamp();
  const u = unlockedCount();
  if (input.next || input.prev) setSkin((save.skin + (input.next ? 1 : -1) + u) % u, true);
  if (input.direct >= 0) { if (input.direct < u) setSkin(input.direct, true); else SFX.clack('brick'); }
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  readInput();
  if (!started) {
    const a = time * 0.07;
    camera.position.set(Math.sin(a) * 70, 34, Math.cos(a) * 70); camera.lookAt(0, 4, 0);
    sun.position.set(35, 70, 25); sun.target.position.set(0, 0, 0);
    truck.yaw += dt * 0.6; updateTruckVisual(dt);
    updateCrane(dt); updateCrushers(dt); updatePieces(dt); updateRamps(dt); updateFX(litFX, dt); updateFX(glowFX, dt); updateMarkers();
    renderer.render(scene, camera); return;
  }
  actions();
  updateTruck(dt);
  updateTruckVisual(dt);
  updateRamps(dt);
  updateCrane(dt);
  updateCrushers(dt);
  updatePieces(dt);
  updateRebuild(dt);
  updateStuds(dt);
  updateFX(litFX, dt); updateFX(glowFX, dt);
  updateFireworks(dt);
  updateCrowd(dt);
  updateCamera(dt); updateMarkers();
  updateHUD(dt); governFPS(now);
  persistT -= dt; if (persistT <= 0 && saveDirty) { persist(); persistT = 2; }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
window.__game = { addScore, setSkin, scene, camera, updateRamps, updatePieces, updateCamera, updateTruck, updateStuds, buildRamp, truck, structs, pieces, save, ramps, crane, input, cam, TARGETS, groundPound, targetDone, bigParty, renderer };
addEventListener('beforeunload', () => { if (saveDirty) persist(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (saveDirty) persist(); A.pause(true); for (const k in keys) keys[k] = false; touch.btn = {}; }
  else { A.pause(false); last = performance.now(); fpsT0 = 0; }
});
</script>
