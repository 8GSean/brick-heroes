<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Space Pup Planets</title>
<meta name="description" content="A puppy astronaut hops between tiny planets to help friendly aliens find the things they lost.">
<meta name="theme-color" content="#1b1145">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    background: #140c38; font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --u: clamp(50px, 12.5vmin, 82px); }

  /* ---- home button (same in every Brick Arcade game) ---- */
  #home { position: fixed; left: calc(var(--sl) + 12px); top: calc(var(--st) + 12px); width: 56px; height: 56px; border-radius: 50%; z-index: 10000;
    background: rgba(255,255,255,.78); box-shadow: 0 4px 12px rgba(0,0,0,.35); display: grid; place-items: center; font-size: 30px; text-decoration: none; }
  #home:active { transform: scale(.92); }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #hud.show { opacity: 1; }
  #bitbox { position: absolute; left: calc(var(--sl) + 84px); top: calc(var(--st) + 14px); display: flex; align-items: center; gap: 8px; }
  #bitbox .ico { font-size: 40px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  #bitnum { font-size: 44px; color: #fff; -webkit-text-stroke: 2px #2a1f4d; text-shadow: 0 4px 0 #2a1f4d; }
  #bitnum.pop { animation: pop .18s; }
  @keyframes pop { 50% { transform: scale(1.18); } }

  #goal { position: absolute; left: 50%; top: calc(var(--st) + 10px); transform: translateX(-50%); background: rgba(30,20,80,.55); border: 3px solid rgba(255,255,255,.8);
    border-radius: 26px; padding: 2px 8px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #goal canvas { display: block; width: 176px; height: 80px; }
  #goal.bump { animation: pop .35s; }

  #stars { position: absolute; right: calc(var(--sr) + 14px); top: calc(var(--st) + 14px); display: flex; gap: 4px; }
  .st { font-size: 30px; filter: grayscale(1) brightness(.55); opacity: .7; transition: filter .3s; }
  .st.got { filter: drop-shadow(0 0 8px #ffd54a); opacity: 1; animation: pop .5s; }
  #mute, #mapbtn { position: absolute; pointer-events: auto; border: 0; cursor: pointer; background: rgba(30,20,80,.5); border-radius: 50%; width: 52px; height: 52px; font-size: 28px; padding: 0; }
  #mute { right: calc(var(--sr) + 14px); top: calc(var(--st) + 62px); }
  #mapbtn { right: calc(var(--sr) + 74px); top: calc(var(--st) + 62px); }
  #mapbtn b { position: absolute; right: -6px; bottom: -6px; }

  #controls { position: absolute; left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 14px); display: flex; flex-direction: column; gap: 6px; }
  .ctl { display: flex; align-items: center; gap: 8px; background: rgba(30,20,80,.5); padding: 4px 12px 4px 4px; border-radius: 22px; color: #fff; font-size: 22px; }
  .btn { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 15px; font-style: normal;
    box-shadow: 0 3px 0 rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.85); font-family: 'Lilita One', 'Arial Black', sans-serif; }
  .btn.a { background: #2ecc40; } .btn.b { background: #e53935; } .btn.x { background: #1e88e5; } .btn.y { background: #f9b800; }
  .key { min-width: 32px; height: 30px; border-radius: 7px; background: #f2f2f2; color: #222; padding: 0 6px; display: grid; place-items: center; font-size: 14px; box-shadow: 0 3px 0 #999; }

  /* ---- touch ---- */
  #touch { position: absolute; inset: 0; display: none; }
  body.touch { touch-action: none; }
  body.touch #touch { display: block; }
  body.touch #controls { display: none; }
  #stickzone { position: absolute; left: 0; bottom: 0; width: 42%; top: 28%; pointer-events: auto; touch-action: none; }
  #stick { position: absolute; width: calc(var(--u) * 1.9); height: calc(var(--u) * 1.9); margin: calc(var(--u) * -.95) 0 0 calc(var(--u) * -.95); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08) 40%, rgba(255,255,255,.22)); border: 3px solid rgba(255,255,255,.55); opacity: .45; transition: opacity .25s; pointer-events: none; }
  #stick.on { opacity: 1; transition: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * .85); height: calc(var(--u) * .85); margin: calc(var(--u) * -.425) 0 0 calc(var(--u) * -.425); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #dfe6ee 60%, #aab6c4); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #pad { position: absolute; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 14px); width: calc(var(--u) * 2.7); height: calc(var(--u) * 2.6); }
  .tb { position: absolute; width: var(--u); height: var(--u); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--u) * .46); color: #fff;
    border: 3px solid rgba(255,255,255,.9); box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.15); pointer-events: auto; touch-action: none; opacity: .9; transition: transform .06s; }
  .tb.down { transform: translateY(3px) scale(.92); }
  .tb.jump { width: calc(var(--u) * 1.35); height: calc(var(--u) * 1.35); font-size: calc(var(--u) * .62); right: 0; bottom: calc(var(--u) * .1); background: #2ecc40; }
  .tb.bark { width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); right: calc(var(--u) * 1.55); bottom: 0; background: #1e88e5; }
  .tb.map { right: calc(var(--u) * 1.3); bottom: calc(var(--u) * 1.45); background: #f9b800; }

  /* ---- space map ---- */
  #map { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
    background: radial-gradient(ellipse at center, rgba(40,20,110,.82), rgba(8,4,30,.94)); transition: opacity .3s; z-index: 50; }
  #map.hide { opacity: 0; pointer-events: none; }
  #maptop { font-size: clamp(34px, 7vh, 60px); filter: drop-shadow(0 4px 0 rgba(0,0,0,.4)); }
  #cards { display: grid; grid-template-columns: repeat(3, auto); gap: clamp(8px, 2.4vmin, 26px); }
  .card { position: relative; width: clamp(90px, min(20vw, 24vh), 180px); aspect-ratio: 1; border-radius: 28px; background: rgba(255,255,255,.1); border: 4px solid rgba(255,255,255,.35);
    cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card canvas { width: 100%; height: 100%; display: block; }
  .card.sel { transform: scale(1.12); border-color: #ffd23f; box-shadow: 0 0 30px #ffd23f; animation: bob 1s ease-in-out infinite; }
  .card .badge { position: absolute; right: -8px; top: -10px; font-size: clamp(26px, 5vmin, 44px); filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
  .card .here { position: absolute; left: -10px; bottom: -10px; font-size: clamp(26px, 5vmin, 44px); filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
  #maphint { display: flex; gap: 20px; color: #fff; font-size: 30px; align-items: center; }
  #maphint .btn { width: 44px; height: 44px; font-size: 22px; }
  #mapclose { position: absolute; right: calc(var(--sr) + 18px); top: calc(var(--st) + 18px); width: 60px; height: 60px; border-radius: 50%; border: 4px solid #fff;
    background: #e53935; color: #fff; font-size: 30px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.4); }

  /* ---- celebrations ---- */
  #starpop { position: fixed; left: 50%; top: 40%; font-size: 170px; transform: translate(-50%,-50%); opacity: 0; pointer-events: none; filter: drop-shadow(0 0 40px #ffd54a); }
  #starpop.show { animation: starfly 2.2s ease-in forwards; }
  @keyframes starfly {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(-40deg); }
    15% { opacity: 1; transform: translate(-50%,-50%) scale(1.3) rotate(10deg); }
    25% { transform: translate(-50%,-50%) scale(1) rotate(0); }
    65% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(35vw, -42vh) scale(.15); }
  }
  #party { position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); text-align: center; opacity: 0; pointer-events: none; }
  #party .big { font-size: 140px; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); }
  #party .row { font-size: 54px; letter-spacing: 4px; }
  #party.show { animation: partyin 6s ease-out forwards; }
  @keyframes partyin { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); } 10% { opacity: 1; transform: translate(-50%,-50%) scale(1.25); } 18% { transform: translate(-50%,-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }

  /* ---- title ---- */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(10,0,40,.6)); transition: opacity .6s; z-index: 20; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(40px, min(11vw, 17vh), 140px); margin: 0; color: #ffe066; -webkit-text-stroke: 5px #7b2cbf; letter-spacing: 3px; text-align: center; line-height: .95;
    text-shadow: 0 10px 0 #3c096c, 0 18px 30px rgba(0,0,0,.5); transform: rotate(-3deg); font-weight: normal; }
  #title h1 span { color: #8ff0ff; -webkit-text-stroke-color: #2541b2; text-shadow: 0 10px 0 #10206e, 0 18px 30px rgba(0,0,0,.5); }
  #title .sub { margin-top: min(22px, 3vh); font-size: clamp(30px, min(6vw, 8vh), 60px); filter: drop-shadow(0 4px 0 rgba(0,0,0,.4)); letter-spacing: 8px; }
  #title .press { margin-top: min(40px, 5vh); display: flex; gap: 22px; align-items: center; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) scale(1.05); } }
  .bigA { width: 96px; height: 96px; border-radius: 50%; background: #2ecc40; color: #fff; font-size: 56px; display: grid; place-items: center; box-shadow: 0 7px 0 #1a8a28; border: 5px solid #fff; }
  .bigIco { font-size: 70px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
  @media (max-height: 500px) { .bigA { width: 72px; height: 72px; font-size: 42px; } .bigIco { font-size: 54px; } }
  #reset { position: absolute; right: 14px; bottom: 12px; font: 14px system-ui, sans-serif; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; opacity: .6; }
  @media (orientation: portrait) {
    #goal { top: calc(var(--st) + 76px); }
    #stars { top: calc(var(--st) + 128px); gap: 2px; } .st { font-size: 24px; }
    #bitnum { font-size: 34px; } #bitbox .ico { font-size: 30px; }
    #stickzone { width: 55%; top: 45%; }
  }
</style>
</head>
<body>
<a id="home" href="../../index.html" title="Home">🏠</a>

<div id="hud">
  <div id="bitbox"><span class="ico">✨</span><span id="bitnum">0</span></div>
  <div id="goal"><canvas id="goalcv" width="352" height="160"></canvas></div>
  <div id="stars"></div>
  <button id="mapbtn" title="Map">🗺️<b class="btn y">Y</b></button>

  <div id="controls"></div>
  <div id="touch">
    <div id="stickzone"><div id="stick"><div id="knob"></div></div></div>
    <div id="pad">
      <div class="tb jump" data-b="jump">⬆️</div>
      <div class="tb bark" data-b="bark">🐶</div>
      <div class="tb map" data-b="map">🗺️</div>
    </div>
  </div>
</div>

<div id="map" class="hide">
  <div id="maptop">🚀 🪐 🪐 🪐</div>
  <div id="cards"></div>
  <div id="maphint"></div>
  <button id="mapclose">✖</button>
</div>
<div id="starpop">⭐</div>
<div id="party"><div class="big">🎉🐶🎉</div><div class="row">⭐⭐⭐⭐⭐⭐</div></div>

<div id="title">
  <h1>SPACE PUP<br><span>PLANETS</span></h1>
  <div class="sub">🐶🚀🪐⭐</div>
  <div class="press"><div class="bigA">A</div><div class="bigIco kbd">⌨️</div><div class="bigIco tap" style="display:none">👆</div></div>

</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
//  CONFIG: tweak me! (speeds, sizes, counts)
// =====================================================================
const CONFIG = {
  walkSpeed: 6.5,        // how fast the pup runs
  accel: 9,              // how quickly the pup speeds up / slows down
  gravity: 16,           // pull toward the planet
  floatGravity: 6,       // gentler pull while A is held on the way up (floaty jumps!)
  jumpSpeed: 9.5,        // jump power
  camDist: 9.5,          // camera distance behind the pup
  camHeight: 5,          // camera height above the pup
  pickupRadius: 2.4,     // how close you need to be to grab things
  magnetRadius: 3.6,     // star-bits fly to you inside this range
  flightTime: 3.2,       // seconds for a rocket trip between planets
  hopTime: 1.4,          // seconds for a jump-pad hop to a moon
  padCharge: 0.9,        // seconds standing on a launch pad before take-off
  orbit: 52,             // how far the planets are from the middle of space
  bitsPerPlanet: 20, bonesPerPlanet: 5, bubblesPerPlanet: 6, crittersPerPlanet: 3, decorPerPlanet: 26,
  boneValue: 5,          // a bone is worth this many star-bits
  shootingStarEvery: 11, // seconds between shooting stars
  partySeconds: 16,      // how long the big space party lasts
};

// The six planets. Change colours, sizes, the lost item or the alien here!
// item: bone | flower | moonrock | icecream | ball | sock
const PLANETS = [
  { r: 9.0, c1: '#86e05a', c2: '#4fbf55', glow: '#9dffb0', ring: null, moon: false, item: 'flower',
    decor: ['tree', 'tree', 'rock', 'mush'], alien: { color: '#ff8fc8', belly: '#ffd1e8', eyes: 1, tip: '#fff36b' }, critter: ['#fff36b', '#ffb36b'] },
  { r: 8.5, c1: '#ff9ad5', c2: '#ffc4ea', glow: '#ff8fd8', ring: ['#fff3a3', '#ff9ad5', '#a0e7ff'], moon: false, item: 'icecream',
    decor: ['lolly', 'lolly', 'mush', 'tree'], alien: { color: '#6fd8ff', belly: '#d4f6ff', eyes: 2, tip: '#ff6fae' }, critter: ['#ffffff', '#b8f2ff'] },
  { r: 9.5, c1: '#d8f3ff', c2: '#a6dcf7', glow: '#a8e8ff', ring: null, moon: true, item: 'sock',
    decor: ['pine', 'pine', 'crystal', 'rock'], alien: { color: '#b48cff', belly: '#e6dcff', eyes: 3, tip: '#7ff7ff' }, critter: ['#ff9ad5', '#ffffff'] },
  { r: 8.5, c1: '#ffb85c', c2: '#ff9447', glow: '#ffbf6b', ring: ['#ffe08a', '#ff9f5a', '#fff'], moon: false, item: 'ball',
    decor: ['cactus', 'cactus', 'rock', 'rock'], alien: { color: '#7be37b', belly: '#dcffd4', eyes: 2, tip: '#ff5f5f' }, critter: ['#ff6b6b', '#fff36b'] },
  { r: 10, c1: '#a98bff', c2: '#7b62f0', glow: '#c3a8ff', ring: null, moon: true, item: 'moonrock',
    decor: ['crystal', 'crystal', 'mush', 'pine'], alien: { color: '#ffb347', belly: '#ffe7c4', eyes: 1, tip: '#a0ffea' }, critter: ['#7ff7ff', '#ff9ad5'] },
  { r: 9.0, c1: '#52dccb', c2: '#2fa8c9', glow: '#7af0ff', ring: ['#c8fff4', '#7ae3ff', '#ffe08a'], moon: false, item: 'bone',
    decor: ['coral', 'coral', 'rock', 'tree'], alien: { color: '#ff7a7a', belly: '#ffe0e0', eyes: 3, tip: '#ffe36b' }, critter: ['#ffe36b', '#ff9ad5'] },
];

// =====================================================================
//  Helpers
// =====================================================================
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const srng = mulberry32(777);
const sr = (a, b) => a + srng() * (b - a);
// point on a unit sphere: theta = angle from the top, phi = angle around
const sph = (theta, phi) => new V3(Math.sin(theta) * Math.cos(phi), Math.cos(theta), Math.sin(theta) * Math.sin(phi));
function randDir(r = Math.random) { const z = r() * 2 - 1, a = r() * TAU, s = Math.sqrt(1 - z * z); return new V3(s * Math.cos(a), z, s * Math.sin(a)); }
function anyTangent(up, out = new V3()) { out.set(1, 0, 0); if (Math.abs(up.x) > .9) out.set(0, 0, 1); return out.addScaledVector(up, -out.dot(up)).normalize(); }
function tangentOf(v, up, out = new V3()) { out.copy(v).addScaledVector(up, -v.dot(up)); return out.lengthSq() < 1e-8 ? anyTangent(up, out) : out.normalize(); }
const _bx = new V3(), _bz = new V3(), _bm = new THREE.Matrix4();
// quaternion whose local +Y is `up` and local +Z faces `fwd`
function basisQuat(up, fwd, out = new THREE.Quaternion()) {
  tangentOf(fwd, up, _bz); _bx.crossVectors(up, _bz);
  _bm.makeBasis(_bx, up, _bz); return out.setFromRotationMatrix(_bm);
}
function shadeHex(hex, sat, light) { const c = new THREE.Color(hex), h = {}; c.getHSL(h); c.setHSL(h.h, clamp(h.s * sat, 0, 1), clamp(h.l * light, 0, 1)); return c; }
function noise3(x, y, z) { return Math.sin(x * 1.7 + Math.sin(z * 1.3)) * Math.sin(y * 1.9 + Math.sin(x * 1.1)) * Math.sin(z * 1.5 + Math.sin(y * 1.7)); }

// =====================================================================
//  Save data
// =====================================================================
const SAVE_KEY = 'brick-arcade-space-pup';
let save = { bits: 0, stars: [false, false, false, false, false, false], at: 0, party: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
if (!Array.isArray(save.stars) || save.stars.length !== 6) save.stars = [false, false, false, false, false, false];
if (!(save.at >= 0 && save.at < 6)) save.at = 0;
let saveDirty = false;
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} saveDirty = false; }
$('reset').addEventListener('click', e => {
  e.stopPropagation();
  if (confirm('Start over?')) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }
});

// =====================================================================
//  Audio (all synthesized, no files)
// =====================================================================
const A = (() => {
  let ctx = null, master, sfx, music, echo, noiseBuf, nextT = 0, step = 0, muted = false;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    music = ctx.createGain(); music.gain.value = 0.22; music.connect(master);
    // spacey echo
    echo = ctx.createDelay(1); echo.delayTime.value = 0.42;
    const fb = ctx.createGain(); fb.gain.value = 0.4; const wet = ctx.createGain(); wet.gain.value = 0.45;
    echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ctx.currentTime + 0.2;
    setInterval(sched, 50);
  }
  function tone(f, dur = 0.12, type = 'square', vol = 0.15, slide = 0, delay = 0, wet = false) {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); if (wet) g.connect(echo); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur = 0.2, vol = 0.2, freq = 1200, delay = 0, type = 'lowpass', freqTo = 0) {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);

  });

  tail.rotation.z = Math.sin(P.wag) * 0.7;
  const vr = P.flight ? 3 : P.vel.dot(P.up);
  for (const [k, e] of ears.entries()) { const s = k ? -1 : 1; e.rotation.z = lerp(e.rotation.z, s * clamp(-vr * 0.12, -0.3, 1.2) + s * Math.sin(time * 3) * 0.05 * (1 + hs * 3), damp(10, dt)); }
  // bark: head tilts up, mouth opens
  P.bark = Math.max(0, P.bark - dt);
  const bk = P.bark > 0 ? Math.sin(P.bark / 0.35 * Math.PI) : 0;
  head.rotation.x = -bk * 0.5 + (P.idle > 3 ? Math.sin(time * 1.5) * 0.08 : 0);
  head.rotation.z = P.idle > 3 ? Math.sin(time * 0.8) * 0.15 : 0;
  mouth.scale.setScalar(0.01 + bk * 1.2);
  // shadow
  const B = bodies[P.body];
  shadow.visible = !P.flight;
  if (!P.flight) {
    const n = P.pos.clone().sub(B.c).normalize(), h = P.pos.distanceTo(B.c) - B.r;
    shadow.position.copy(B.c).addScaledVector(n, B.r + 0.08); shadow.quaternion.copy(basisQuat(n, P.fwd));
    shadow.scale.setScalar(Math.max(0.3, 1 - h * 0.12)); shadow.material.opacity = Math.max(0.2, 1 - h * 0.15);
  }
  // bark rings
  for (const r of barkRings) {
    if (r.t >= 1) { r.m.visible = false; continue; }
    r.t += dt * 2; r.m.position.copy(P.pos).addScaledVector(P.up, 0.9);
    r.m.quaternion.copy(pup.quaternion).multiply(_q.setFromAxisAngle(new V3(1, 0, 0), Math.PI / 2));
    r.m.scale.setScalar(0.5 + r.t * 5); r.m.material.opacity = (1 - r.t) * 0.8;
  }
}
const goalPos = new V3();
function findGoal() {
  const pl = bodies[P.body].planet, it = items[pl];
  let target = null, tBody = -1;
  if (!save.stars[pl]) {
    if (it.state === 'carried') { target = aliens[pl].pos; tBody = pl; }
    else if (it.state === 'home') { target = it.pos; tBody = it.homeBody; }
  } else { const lp = pads.find(p => p.kind === 'launch' && p.body === pl); target = lp.pos; tBody = pl; }
  if (!target) return false;
  if (tBody !== P.body) { const hp = pads.find(p => p.kind === 'hop' && p.body === P.body && p.toBody === tBody) || pads.find(p => p.kind === 'hop' && p.body === P.body); if (!hp) return false; target = hp.pos; }
  goalPos.copy(target); return true;
}
function updateGuide(dt, time) {
  const has = started && !P.flight && !mapUI.open && partyT <= 0 && findGoal();
  const d = has ? goalPos.distanceTo(P.pos) : 0;
  arrow.visible = has && d > 3.2;
  if (arrow.visible) {
    const dirT = tangentOf(goalPos.clone().sub(P.pos), P.up);
    arrow.position.copy(P.pos).addScaledVector(P.up, 0.3).addScaledVector(dirT, 1.7 + Math.sin(time * 6) * 0.15);
    arrow.quaternion.copy(basisQuat(P.up, dirT));
  }
  // UFO buddy: follows, and sometimes zooms off to show you the way
  U.scoutT -= dt;
  let target = P.pos.clone().addScaledVector(P.up, 3.2).addScaledVector(_r.crossVectors(P.fwd, P.up).normalize(), 1.5).addScaledVector(P.fwd, -0.8);
  if (has && U.scoutT < 0 && d > 6) { U.scout = 2.4; U.scoutT = 9; SFX.beep(); }
  if (U.scout > 0) {
    U.scout -= dt;
    if (has) { const gu = goalPos.clone().sub(bodies[P.body].c).normalize(); target = goalPos.clone().addScaledVector(gu, 3.2); }
    ufoBeam.material.opacity = lerp(ufoBeam.material.opacity, 0.35, damp(5, dt));
  } else ufoBeam.material.opacity = lerp(ufoBeam.material.opacity, 0, damp(5, dt));
  U.pos.lerp(target, damp(P.flight ? 6 : U.scout > 0 ? 2.5 : 3, dt));
  const B = bodies[P.body]; const L = U.pos.distanceTo(B.c); if (L < B.r + 2) U.pos.copy(B.c).addScaledVector(U.pos.clone().sub(B.c).normalize(), B.r + 2);
  U.up.lerp(U.pos.clone().sub(B.c).normalize(), damp(4, dt)).normalize();
  ufo.position.copy(U.pos).addScaledVector(U.up, Math.sin(time * 2.2) * 0.25);
  U.flip = Math.max(0, U.flip - dt * 1.5);
  ufo.quaternion.copy(basisQuat(U.up, P.fwd)).multiply(_q.setFromAxisAngle(new V3(1, 0, 0), (1 - U.flip) * U.flip * 4 * TAU * 0.5 * Math.sign(U.flip)));
  ufoLights.rotation.y = time * 3;
}

// =====================================================================
//  Camera: behind and above the pup, "up" = away from the planet
// =====================================================================
function updateCamera(dt, time) {
  if (!started) {
    const B = bodies[P.body], a = time * 0.12;
    const want = B.c.clone().add(new V3(Math.sin(a), 0.55, Math.cos(a)).normalize().multiplyScalar(B.r * 3.4));
    cam.pos.copy(want); cam.up.set(0, 1, 0); cam.look.copy(B.c);
    camera.position.copy(cam.pos); camera.up.copy(cam.up); camera.lookAt(cam.look); return;
  }
  let want, lookAt, upW, k;
  if (P.flight) {
    const t = _t.copy(P.fwd);
    want = P.pos.clone().addScaledVector(t, -10).addScaledVector(P.up, 4.5);
    lookAt = P.pos.clone().addScaledVector(t, 3); upW = P.up; k = 3.5;
    tangentOf(cam.fwd, P.flight.toDir, cam.fwd);
  } else {
    // rotate camera with right stick / Q,E / drag
    cam.fwd.applyAxisAngle(P.up, -(input.cx * 2.4 * dt + mouseDX * 0.006));
    cam.height = clamp(cam.height + input.cy * 4 * dt + mouseDY * 0.02, 2.2, 10);
    tangentOf(cam.fwd, P.up, cam.fwd);
    const dist = CONFIG.camDist + (partyT > 0 ? 4 : 0);
    want = P.pos.clone().addScaledVector(P.up, cam.height).addScaledVector(cam.fwd, -dist);
    lookAt = P.pos.clone().addScaledVector(P.up, 1.3).addScaledVector(cam.fwd, 1.5); upW = P.up; k = 5;
  }
  mouseDX = mouseDY = 0;
  cam.pos.lerp(want, damp(k, dt));
  for (const b of bodies) { const v = cam.pos.clone().sub(b.c), L = v.length(); if (L < b.r + 1.2) cam.pos.copy(b.c).addScaledVector(v.normalize(), b.r + 1.2); }
  cam.up.lerp(upW, damp(4, dt)).normalize();
  cam.look.lerp(lookAt, damp(8, dt));
  camera.position.copy(cam.pos); camera.up.copy(cam.up); camera.lookAt(cam.look);
}

// =====================================================================
//  Map input
// =====================================================================
function updateMapInput() {
  if (input.map) { openMap(!mapUI.open); return; }
  if (!mapUI.open) return;
  if (input.back) { openMap(false); return; }
  let s = mapUI.sel;
  if (input.navX) s = (s + input.navX + 6) % 6;
  if (input.navY) s = (s + input.navY * 3 + 6) % 6;
  if (s !== mapUI.sel) { mapUI.sel = s; SFX.click(); renderMap(); }
  if (input.jump) mapGo();
}

// =====================================================================
//  Main loop
// =====================================================================
let started = false, time = 0, last = performance.now(), persistT = 0;
function anyInput() {
  A.init();
  if (started) return;
  started = true;
  $('title').classList.add('hide'); $('hud').classList.add('show');
  renderControls(); refreshPadSprites();
  SFX.pickup(); SFX.bark();
  prevBtn = { jump: true, bark: true, map: true, back: true, mute: true, home: true };
  cam.fwd.copy(P.fwd);
  cam.pos.copy(camera.position);
}
// restore saved progress (happy planets get their flowers and stars)
save.stars.forEach((done, i) => {
  if (!done) return;
  for (let k = 0; k < 46; k++) Flowers.add(i, randDir(), true, 0);
  aliens[i].star.visible = true;
  redrawBubble(aliens[i].tex.userData.canvas.getContext('2d'), g => drawItem(g, 'heart', 128, 110, 120)); aliens[i].tex.needsUpdate = true;
});
refreshPadSprites();

let fpsN = 0, fpsT0 = 0;
function governFPS(now) {
  if (!fpsT0 || !started) { fpsT0 = now; fpsN = 0; return; } fpsN++;
  if (now - fpsT0 < 3000) return;
  const avg = (now - fpsT0) / fpsN; fpsT0 = now; fpsN = 0;
  if (avg > 24 && pixelCap > 1 && !document.hidden) { pixelCap = Math.max(1, pixelCap - .25); renderer.setPixelRatio(Math.min(devicePixelRatio, pixelCap)); fitView(); }
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  skyMat.uniforms.uTime.value = time;
  readInput();
  if (started) updateMapInput();
  updatePlayer(dt);
  updateItems(dt, time);
  updateAliens(dt, time);
  updateBigStar(dt, time);
  updatePlanets(dt);
  Collect.update(dt, time);
  Bubbles.update(dt, time);
  Critters.update(dt);
  Flowers.update(dt);
  updateShootingStar(dt, time);
  animatePads(time);
  animatePup(dt, time);
  updateGuide(dt, time);
  FX.update(dt);
  updateCamera(dt, time);
  skyGroup.position.copy(camera.position);
  if (started) { updateGoalHUD(); governFPS(now); }
  persistT -= dt; if (persistT <= 0 && saveDirty) { persist(); persistT = 2; }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

window.__game = { P, save, items, aliens, bodies, pads, mapUI, startParty, startFlight, openMap, deliver, cam, renderer,
  teleport(i) { placePupAt(i, PLANETS[i].dirs.land, aliens[i].pos); cam.fwd.copy(P.fwd); },
  grabItem(i) { const it = items[i]; it.state = 'carried'; P.carrying = i; },
  walkTo(pos) { P.pos.copy(pos); },
  shootNow() { shoot.next = 0; },
};
addEventListener('beforeunload', () => { if (saveDirty) persist(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (saveDirty) persist(); A.pause(true); for (const k in keys) keys[k] = false; touch.btn = {}; }
  else { A.pause(false); last = performance.now(); fpsT0 = 0; }
});
addEventListener('pagehide', () => { if (saveDirty) persist(); });
</script>
