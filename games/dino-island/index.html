<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Island Rescue</title>
<meta name="description" content="Ride dinosaurs around a brick tropical island and rescue 12 lost baby dinos.">
<meta name="theme-color" content="#7fd8ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    background: #7fd8ff; font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --u: clamp(50px, 12.5vmin, 82px); }

  /* ---- home button (same in every Brick Arcade game) ---- */
  #home { position: fixed; left: calc(var(--sl) + 12px); top: calc(var(--st) + 12px); width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 1000; display: grid; place-items: center;
    font-size: 30px; text-decoration: none; line-height: 1; }
  #home:active { transform: scale(.92); }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #hud.show { opacity: 1; }

  /* fruit counter (next to the home button) */
  #fruitbox { position: absolute; left: calc(var(--sl) + 82px); top: calc(var(--st) + 14px); display: flex; align-items: center; gap: 6px; }
  #fruitbox .ico { font-size: 40px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
  #fruitnum { font-size: 42px; color: #fff; -webkit-text-stroke: 2px #1b2a4a; text-shadow: 0 4px 0 #1b2a4a; }
  #fruitnum.pop { animation: pop .18s; }
  @keyframes pop { 50% { transform: scale(1.18); } }

  /* baby dino picture counter */
  #babyrow { position: absolute; top: calc(var(--st) + 10px); left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 5px;
    max-width: min(600px, calc(100vw - 330px)); }
  .slot { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.35); border: 3px solid rgba(255,255,255,.7); position: relative; overflow: hidden; }
  .slot img { width: 100%; height: 100%; display: block; }
  .slot.follow { border-color: #fff; background: rgba(255,255,255,.75); animation: wig 1s ease-in-out infinite; }
  .slot.home { border-color: #ffd23f; background: #fff6c2; box-shadow: 0 0 12px #ffd23f; }
  .slot.pop { animation: slotpop .6s; }
  @keyframes wig { 50% { transform: rotate(-10deg) translateY(-3px); } }
  @keyframes slotpop { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }

  #mute { position: absolute; right: calc(var(--sr) + 14px); top: calc(var(--st) + 14px); pointer-events: auto; font-size: 28px; background: rgba(20,30,60,.45); border: 0; border-radius: 50%; width: 52px; height: 52px; cursor: pointer; }

  /* dino picker */
  #dinos { position: absolute; left: 50%; bottom: calc(var(--sb) + 14px); transform: translateX(-50%); display: flex; gap: 14px; align-items: flex-end; }
  .dino { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; overflow: hidden; background: rgba(255,255,255,.6); box-shadow: 0 4px 0 rgba(0,0,0,.3); transition: transform .2s; position: relative; pointer-events: auto; }
  .dino img { width: 100%; height: 100%; display: block; }
  .dino.cur { transform: scale(1.25) translateY(-6px); border-color: #ffd23f; box-shadow: 0 0 20px #ffd23f, 0 4px 0 rgba(0,0,0,.3); }
  .dino.locked { background: rgba(20,30,60,.45); }
  .dino.locked::after { content: '❓'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; }

  #controls { position: absolute; left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 14px); display: flex; flex-direction: column; gap: 6px; }
  .ctl { display: flex; align-items: center; gap: 8px; background: rgba(20,30,60,.45); padding: 4px 12px 4px 4px; border-radius: 22px; color: #fff; font-size: 22px; }
  .btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.8); }
  .key { min-width: 32px; height: 30px; border-radius: 7px; background: #f2f2f2; color: #222; padding: 0 6px; display: grid; place-items: center; font-size: 14px; box-shadow: 0 3px 0 #999; }

  /* touch controls (only on touch devices) */
  #touch { position: absolute; inset: 0; display: none; }
  body.touch #touch { display: block; }
  body.touch #controls { display: none; }
  #stickzone { position: absolute; left: 0; bottom: 0; width: 42%; top: 30%; pointer-events: auto; touch-action: none; }
  #stick { position: absolute; width: calc(var(--u) * 1.9); height: calc(var(--u) * 1.9); margin: calc(var(--u) * -.95) 0 0 calc(var(--u) * -.95); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08) 40%, rgba(255,255,255,.22)); border: 3px solid rgba(255,255,255,.55); opacity: .45; pointer-events: none; }
  #stick.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * .85); height: calc(var(--u) * .85); margin: calc(var(--u) * -.425) 0 0 calc(var(--u) * -.425); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #dfe6ee 60%, #aab6c4); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #pad { position: absolute; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 14px); width: calc(var(--u) * 2.7); height: calc(var(--u) * 2.8); }
  .tb { position: absolute; width: var(--u); height: var(--u); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--u) * .46); color: #fff;
    border: 3px solid rgba(255,255,255,.9); box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.15); pointer-events: auto; touch-action: none; opacity: .9; }
  .tb.down { transform: translateY(3px) scale(.92); }
  .tb.a { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); font-size: calc(var(--u) * .6); right: 0; bottom: calc(var(--u) * .2); background: #2ecc40; }
  .tb.x { width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); right: calc(var(--u) * 1.5); bottom: 0; background: #1e90ff; }
  .tb.b { right: calc(var(--u) * .15); bottom: calc(var(--u) * 1.7); background: #e53935; }
  .tb.y { right: calc(var(--u) * 1.35); bottom: calc(var(--u) * 1.35); background: #f4c20d; }
  body.touch #dinos { bottom: calc(var(--sb) + 8px); gap: 10px; }
  body.touch .dino { width: 54px; height: 54px; border-width: 3px; }
  @media (orientation: portrait) {
    #babyrow { max-width: calc(100vw - 160px); } .slot { width: 32px; height: 32px; border-width: 2px; }
    body.touch #dinos { top: calc(var(--st) + 84px); bottom: auto; left: calc(var(--sl) + 14px); transform: none; flex-direction: column; }
    body.touch .dino { width: 46px; height: 46px; }
    #fruitbox { top: calc(var(--st) + 74px); left: auto; right: calc(var(--sr) + 14px); }
    #stickzone { width: 55%; top: 45%; }
  }

  #party { position: fixed; left: 50%; top: 32%; transform: translate(-50%,-50%); font-size: 130px; opacity: 0; pointer-events: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); white-space: nowrap; }
  #party.show { animation: party 6s ease-out forwards; }
  @keyframes party { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(-20deg); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1.3) rotate(8deg); }
    22% { transform: translate(-50%,-50%) scale(1) rotate(-4deg); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-80%) scale(1); } }

  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0) 30%, rgba(0,60,90,.45)); transition: opacity .6s; z-index: 10; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(40px, min(11vw, 17vh), 140px); margin: 0; color: #9be15d; -webkit-text-stroke: 5px #1b5e20; letter-spacing: 3px; text-align: center; line-height: .92;
    text-shadow: 0 10px 0 #0d3b12, 0 18px 24px rgba(0,0,0,.45); transform: rotate(-3deg); font-weight: normal; }
  #title h1 span { color: #ffb703; -webkit-text-stroke-color: #b5179e; text-shadow: 0 10px 0 #6a0f5b, 0 18px 24px rgba(0,0,0,.45); }
  #title .sub { margin-top: min(26px, 3vh); font-size: clamp(34px, min(6vw, 9vh), 64px); animation: bob 1.4s ease-in-out infinite; filter: drop-shadow(0 5px 0 rgba(0,0,0,.25)); }
  #title .press { margin-top: min(40px, 5vh); display: flex; gap: 22px; align-items: center; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) scale(1.05); } }
  .bigA { width: 96px; height: 96px; border-radius: 50%; background: #2ecc40; color: #fff; font-size: 56px; display: grid; place-items: center; box-shadow: 0 7px 0 #1a8a28; border: 5px solid #fff; }
  .bigIco { font-size: 70px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
  @media (max-height: 500px) { .bigA { width: 70px; height: 70px; font-size: 40px; } .bigIco { font-size: 52px; } }
</style>
</head>
<body>

<a id="home" href="../../index.html" title="Home">🏠</a>

<div id="hud">
  <div id="fruitbox"><div class="ico">🍎</div><div id="fruitnum">0</div></div>
  <div id="babyrow"></div>
  <button id="mute" title="Sound">🔊</button>
  <div id="dinos"></div>
  <div id="controls"></div>
  <div id="touch">
    <div id="stickzone"><div id="stick"><div id="knob"></div></div></div>
    <div id="pad">
      <div class="tb a" data-b="jump">🦘</div>
      <div class="tb x" data-b="act">💥</div>
      <div class="tb b" data-b="voice">📣</div>
      <div class="tb y" data-b="swap">🔄</div>
    </div>
  </div>
</div>
<div id="party">🎉🦖🥚🦕🎉</div>

<div id="title">
  <h1>DINO ISLAND<br><span>RESCUE</span></h1>
  <div class="sub">🥚 🦖 🌋 🦕 🥚</div>
  <div class="press"><div class="bigA">A</div><div class="bigIco kbd">⌨️</div><div class="bigIco kbd">🖱️</div><div class="bigIco tap" style="display:none">👆</div></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
//  CONFIG: tweak me! (speeds, sizes, colours, counts)
// =====================================================================
const CONFIG = {
  gravity: 32,
  grassR: 52, beachR: 62, shallowR: 68, worldR: 100,  // island rings (grass, sand, shallow water, edge of the sea)
  grassY: 1.0, beachY: 0.5, shallowY: -0.3, deepY: -2.2, waterY: 0.25,
  stepUp: 0.9,                 // how tall a step dinos can walk up without jumping
  dinos: {
    rex:     { name: 'T-Rex',   speed: 9,   jump: 11, radius: 1.3, height: 3.6, color: '#4caf50', belly: '#ffe082', camDist: 13 },
    ptero:   { name: 'Ptero',   speed: 10,  jump: 9,  radius: 1.0, height: 2.6, color: '#ff8a3d', belly: '#ffd8a8', camDist: 13,
               flap: 9.5, glideFall: 3, maxFly: 28 },
    brachio: { name: 'Longneck', speed: 7.5, jump: 8, radius: 1.5, height: 4.2, color: '#4fb3e8', belly: '#e1f5fe', camDist: 16 },
  },
  stompRadius: 7,      // T-Rex stomp reach
  neckReach: 7.5,      // Longneck reach to tree nests
  followSpacing: 1.7,  // gap between babies in the parade
  mushroomBounce: 19,
  magnet: 3.2,         // fruit pickup magnet distance
  hintDelay: 14,       // seconds of wandering before paw prints appear
  volcanoPuff: 5,      // seconds between confetti puffs
  birdCount: 14, butterflyCount: 18, flowerCount: 140,
  sky: 0x7fd8ff,
};
const SLUG = 'dino-island';
const SAVE_KEY = 'brick-arcade-' + SLUG;

// The 12 lost babies: species, colour, where the egg is, and what is needed to reach it
//   need: null = just lying around, 'rock' = inside a rock pile (T-Rex stomp),
//         'cliff' = high up (Ptero flies), 'nest' = in a tree nest (Longneck reaches)
const BABIES = [
  { sp: 'rex',    c: '#ff5fa2', x: -22,   z: 54,  need: null },
  { sp: 'trike',  c: '#ffd23f', x: -11.5, z: 33.5, need: null },
  { sp: 'stego',  c: '#7c4dff', x: 29,    z: -2,  need: null },
  { sp: 'bronto', c: '#00bfa5', x: -2.8,  z: -34, need: null },
  { sp: 'ptero',  c: '#ff7043', x: 14,    z: 20,  need: 'rock' },
  { sp: 'trike',  c: '#29b6f6', x: 40,    z: 22,  need: 'rock' },
  { sp: 'rex',    c: '#c0ca33', x: -42,   z: -24, need: 'rock' },
  { sp: 'bronto', c: '#ab47bc', x: 36,    z: -14, need: 'cliff' },
  { sp: 'stego',  c: '#e53935', x: -30,   z: -8,  need: 'cliff' },
  { sp: 'ptero',  c: '#3f51b5', x: 24,    z: -30, need: 'cliff' },
  { sp: 'rex',    c: '#ff9100', x: 30,    z: 32,  need: 'nest' },
  { sp: 'trike',  c: '#8d6e63', x: -28,   z: 8,   need: 'nest' },
];

// =====================================================================
//  Helpers
// =====================================================================
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function angLerp(a, b, t) { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const srng = mulberry32(777);
const sr = (a, b) => a + srng() * (b - a);
function shade(hex, amt) { const c = new THREE.Color(hex); const h = {}; c.getHSL(h); c.setHSL(h.h, h.s, clamp(h.l + amt, 0, 1)); return '#' + c.getHexString(); }
function hue(hex, dh) { const c = new THREE.Color(hex); c.offsetHSL(dh, 0, 0); return '#' + c.getHexString(); }
const colorCache = {};
const col = hex => colorCache[hex] || (colorCache[hex] = new THREE.Color(hex));
const d2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);

// =====================================================================
//  Save data (works without storage too)
// =====================================================================
let save = { fruit: 0, rescued: [], dinos: [0], party: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// =====================================================================
//  Audio: everything synthesized (music, dino voices, effects)
// =====================================================================
const A = (() => {
  let ctx = null, master, sfx, music, noiseBuf, nextT = 0, step = 0, muted = false, party = 0;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    music = ctx.createGain(); music.gain.value = 0.18; music.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ctx.currentTime + 0.1;
    setInterval(sched, 40);
  }
  function tone(f, dur = 0.12, type = 'square', vol = 0.15, slide = 0, delay = 0) {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur = 0.2, vol = 0.2, freq = 1200, delay = 0, type = 'lowpass') {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  // a pitch "path" through a filter with wobble: the building block of every dino voice
  function sweep({ type = 'sawtooth', pts, dur, vol = 0.2, filt, lfo, delay = 0 }) {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(pts[0][1], t);
    for (let i = 1; i < pts.length; i++) o.frequency.linearRampToValueAtTime(pts[i][1], t + pts[i][0]);
    if (lfo) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = lfo[0]; lg.gain.value = lfo[1]; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.1); }
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.03);
    g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (filt) { const f = ctx.createBiquadFilter(); f.type = filt[0]; f.frequency.value = filt[1]; f.Q.value = filt[2] || 1; o.connect(f); f.connect(g); } else o.connect(g);
    g.connect(sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  // --- happy island music loop (marimba + bass + shaker) ---
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [[48, 55, 60, 64, 67], [53, 57, 60, 65, 69], [55, 59, 62, 67, 71], [48, 55, 60, 64, 67]];
  const MEL = [[76, 0, 79, 76, 0, 72, 74, 0], [77, 0, 81, 77, 0, 76, 74, 0], [79, 0, 77, 76, 74, 0, 71, 74], [72, 0, 76, 0, 79, 0, 0, 0]];
  function note(f, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(music); o.start(t); o.stop(t + dur + 0.05);
  }
  function shaker(t, vol) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.connect(f); f.connect(g); g.connect(music); s.start(t); s.stop(t + 0.07);
  }
  function sched() {
    if (!ctx || ctx.state !== 'running') return;
    const SP = party > 0 ? 0.11 : 0.15;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.05;
    while (nextT < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 16) % 4, s = step % 16, ch = CH[bar], t = nextT, phrase = Math.floor(step / 64) % 2;
      if (s === 0 || s === 6 || s === 10) note(mtof(ch[0] - 12), t, 0.35, 'triangle', 0.55);
      if (s % 4 === 2) { note(mtof(ch[1 + (s / 2) % 4] + 12), t, 0.12, 'sine', 0.18); note(mtof(ch[2] + 12), t, 0.12, 'sine', 0.12); }
      if (s % 2 === 0) { const m = MEL[bar][s / 2]; if (m) { note(mtof(m + (phrase ? 12 : 0)), t, 0.25, 'sine', 0.26); note(mtof(m + 24), t, 0.06, 'triangle', 0.05); } }
      shaker(t, s % 2 ? 0.035 : 0.08);
      step++; nextT += SP;
    }
    if (party > 0) party -= 0.04;
  }
  return {
    init, tone, noise, sweep,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.6; },
    party(sec) { party = sec; },
    get muted() { return muted; },
  };
})();

const SFX = {
  fruit(n) { const f = 700 * Math.pow(2, Math.min(n, 24) / 24); A.tone(f, 0.08, 'triangle', 0.12); A.tone(f * 1.5, 0.08, 'sine', 0.06, 0, 0.03); },
  jump() { A.tone(240, 0.16, 'square', 0.06, 480); },

const LUT = new Uint8Array(256); for (let i = 0; i < 256; i++) { const v = i / 255; LUT[i] = Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)); }
function snapshot(obj, size, camPos, look) {
  const S = size * 2, rt = new THREE.WebGLRenderTarget(S, S);

  sc.add(new THREE.HemisphereLight(0xffffff, 0x99aabb, 1.2)); const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(3, 6, 6); sc.add(dl); sc.add(obj);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.copy(camPos); cam.lookAt(look);
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(sc, cam);
  const buf = new Uint8Array(S * S * 4); renderer.readRenderTargetPixels(rt, 0, 0, S, S, buf);
  renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1); rt.dispose();
  const big = cv(S, S), g = big.getContext('2d'), img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const si = ((S - 1 - y) * S + x) * 4, di = (y * S + x) * 4;
    img.data[di] = LUT[buf[si]]; img.data[di + 1] = LUT[buf[si + 1]]; img.data[di + 2] = LUT[buf[si + 2]]; img.data[di + 3] = buf[si + 3]; }
  g.putImageData(img, 0, 0);
  const c = cv(size, size); c.getContext('2d').drawImage(big, 0, 0, size, size); return c;
}

//  Input (keyboard, mouse, gamepad, touch)
// =====================================================================
const keys = {};
let usingPad = false, mouseDX = 0, mouseDY = 0, dragging = false, dragDist = 0, clickAct = false, camManualT = 9;
function goHome() { location.href = '../../index.html'; }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') { goHome(); return; }
  if (e.code === 'KeyM') toggleMute();
  if (usingPad) { usingPad = false; renderControls(); }
  anyInput();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const cvs = renderer.domElement;
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('mousedown', e => { anyInput(); if (e.button === 0) { dragging = true; dragDist = 0; } if (e.button === 2) keys.Mouse2 = true; });
addEventListener('mousemove', e => { if (dragging) { mouseDX += e.movementX; mouseDY += e.movementY; dragDist += Math.abs(e.movementX) + Math.abs(e.movementY); } });
addEventListener('mouseup', e => { if (e.button === 0 && dragging) { if (dragDist < 6 && started) clickAct = true; dragging = false; } if (e.button === 2) keys.Mouse2 = false; });
$('title').addEventListener('click', anyInput);
$('mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
function toggleMute() { A.setMuted(!A.muted); $('mute').textContent = A.muted ? '🔇' : '🔊'; }

const touch = { mx: 0, my: 0, btn: {}, direct: -1 };
if (isTouch) {
  document.body.classList.add('touch');
  document.querySelectorAll('.bigIco.kbd, .bigA').forEach(e => e.style.display = 'none');
  document.querySelector('.bigIco.tap').style.display = '';
  const zone = $('stickzone'), stick = $('stick'), knob = $('knob'); let stickId = null, ox = 0, oy = 0;
  const rest = () => { const r = zone.getBoundingClientRect(), u = stick.offsetWidth; ox = r.left + u * .5 + 30; oy = r.bottom - u * .5 - 30; place(); };
  const place = () => { const r = zone.getBoundingClientRect(); stick.style.left = (ox - r.left) + 'px'; stick.style.top = (oy - r.top) + 'px'; };
  const moveStick = e => {
    const R = stick.offsetWidth / 2; let dx = e.clientX - ox, dy = e.clientY - oy; const l = Math.hypot(dx, dy);
    if (l > R) { ox += dx - dx * R / l; oy += dy - dy * R / l; dx *= R / l; dy *= R / l; place(); }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const nx = dx / R, ny = dy / R, m = Math.hypot(nx, ny), k = m < .12 ? 0 : Math.min(1, (m - .12) / .78) / m; touch.mx = nx * k; touch.my = ny * k;
  };
  const endStick = () => { stickId = null; touch.mx = touch.my = 0; knob.style.transform = ''; stick.classList.remove('on'); rest(); };
  zone.addEventListener('pointerdown', e => { e.preventDefault(); anyInput(); if (stickId !== null) return; stickId = e.pointerId; zone.setPointerCapture(e.pointerId); ox = e.clientX; oy = e.clientY; place(); stick.classList.add('on'); moveStick(e); });
  zone.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
  zone.addEventListener('pointerup', e => { if (e.pointerId === stickId) endStick(); });
  zone.addEventListener('pointercancel', e => { if (e.pointerId === stickId) endStick(); });
  addEventListener('resize', () => setTimeout(rest, 300)); rest();
  document.querySelectorAll('.tb').forEach(el => {
    const k = el.dataset.b, up = () => { touch.btn[k] = false; el.classList.remove('down'); };
    el.addEventListener('pointerdown', e => { e.preventDefault(); anyInput(); touch.btn[k] = true; el.classList.add('down'); el.setPointerCapture(e.pointerId); buzz(8); });
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  });
  let lookId = null, lx = 0, ly = 0;
  cvs.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch' || lookId !== null) return; anyInput(); lookId = e.pointerId; lx = e.clientX; ly = e.clientY; });
  cvs.addEventListener('pointermove', e => { if (e.pointerId !== lookId) return; mouseDX += (e.clientX - lx) * 1.4; mouseDY += (e.clientY - ly) * 1.1; lx = e.clientX; ly = e.clientY; });
  const endLook = e => { if (e.pointerId === lookId) lookId = null; };
  cvs.addEventListener('pointerup', endLook); cvs.addEventListener('pointercancel', endLook);
  document.addEventListener('gesturestart', e => e.preventDefault());
}
$('dinos').addEventListener('pointerdown', e => { const h = e.target.closest('.dino'); if (!h) return; e.preventDefault(); touch.direct = [...$('dinos').children].indexOf(h); });

const input = { mx: 0, my: 0, cx: 0, cy: 0, jump: false, jumpHeld: false, act: false, voice: false, swap: false, swapPrev: false, direct: -1 };
let prevBtn = {};
function readInput() {
  let mx = 0, my = 0, cx = 0, cy = 0; const btn = {};
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyQ) cx -= 1; if (keys.KeyE) cx += 1;
  btn.jump = !!keys.Space; btn.act = !!(keys.KeyJ || keys.KeyX || clickAct); btn.voice = !!(keys.KeyK || keys.KeyB || keys.Mouse2); btn.swap = !!(keys.Tab || keys.KeyY);
  for (let i = 0; i < 3; i++) btn['d' + i] = !!keys['Digit' + (i + 1)];
  clickAct = false;
  mx += touch.mx; my += touch.my;
  for (const k in touch.btn) btn[k] = btn[k] || touch.btn[k];
  if (touch.direct >= 0) { btn['d' + touch.direct] = true; touch.direct = -1; }
  activePad = null;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads) {
    if (!gp || !gp.connected) continue;
    activePad = activePad || gp;
    const dz = v => Math.abs(v) < .18 ? 0 : v, b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = dz(gp.axes[0] || 0), ay = dz(gp.axes[1] || 0), rx = dz(gp.axes[2] || 0), ry = dz(gp.axes[3] || 0);
    const anyBtn = gp.buttons.some(x => x.pressed);
    if (ax || ay || rx || ry || anyBtn) { activePad = gp; if (!usingPad) { usingPad = true; renderControls(); } if (anyBtn) anyInput(); }
    mx += ax + (b(15) ? 1 : 0) - (b(14) ? 1 : 0); my += ay + (b(13) ? 1 : 0) - (b(12) ? 1 : 0); cx += rx; cy += ry;
    btn.jump ||= b(0); btn.voice ||= b(1); btn.act ||= b(2) || b(7) || b(5); btn.swap ||= b(3); btn.swapPrev ||= b(4) || b(6);
    btn.mute ||= b(8); btn.home ||= b(9);
  }
  const len = Math.hypot(mx, my); if (len > 1) { mx /= len; my /= len; }
  const edge = k => !!btn[k] && !prevBtn[k];
  Object.assign(input, { mx, my, cx: clamp(cx, -1, 1), cy: clamp(cy, -1, 1), jump: edge('jump'), jumpHeld: !!btn.jump, act: edge('act'), voice: edge('voice'), swap: edge('swap'), swapPrev: edge('swapPrev'), direct: -1 });
  for (let i = 0; i < 3; i++) if (edge('d' + i)) input.direct = i;
  if (edge('mute')) toggleMute();
  if (edge('home')) goHome();
  prevBtn = btn;
  if (!started) { input.jump = input.act = input.voice = input.swap = input.swapPrev = false; input.direct = -1; }
}

// =====================================================================
//  Camera: follows by itself, right stick / drag / Q,E to look around
// =====================================================================
let camYaw = 0, camPitch = 0.42;
const camLook = new V3(0, 3, 14);
function updateCamera(dt) {
  const manual = Math.abs(input.cx) + Math.abs(input.cy) + Math.abs(mouseDX) + Math.abs(mouseDY) > 0.01;
  camManualT = manual ? 0 : camManualT + dt;
  camYaw -= input.cx * 2.6 * dt + mouseDX * 0.006; camPitch = clamp(camPitch + input.cy * 1.4 * dt + mouseDY * 0.004, 0.12, 1.2); mouseDX = mouseDY = 0;
  const hs = Math.hypot(player.vel.x, player.vel.z);
  if (camManualT > 1 && hs > 2 && input.my < 0.4) {
    let d = (player.yaw + Math.PI) - camYaw; d = Math.atan2(Math.sin(d), Math.cos(d));
    camYaw += d * Math.min(1, dt * 0.9 * Math.min(1, hs / 7) * Math.min(1, Math.abs(input.mx) + 0.35));
  }
  const d = curDino(), C = CONFIG.dinos[d.key], flying = d.key === 'ptero' && !player.onGround;
  const dist = C.camDist + (flying ? 4 : 0) + (partyT > 0 ? 6 : 0);
  const tgt = new V3(player.pos.x, Math.max(player.pos.y, CONFIG.waterY - 0.5) + C.height * 0.55, player.pos.z);
  camLook.lerp(tgt, 1 - Math.exp(-8 * dt));
  const want = new V3(camLook.x + Math.sin(camYaw) * Math.cos(camPitch) * dist, camLook.y + Math.sin(camPitch) * dist, camLook.z + Math.cos(camYaw) * Math.cos(camPitch) * dist);
  want.y = Math.max(want.y, CONFIG.waterY + 1.2, baseGround(want.x, want.z) + 1.2);
  for (const s of solids) if (!s.dead && s.top > want.y - 1 && s.bot < want.y && d2(want.x, want.z, s.x, s.z) < s.r + 1) want.y = s.top + 1.2;
  camera.position.lerp(want, 1 - Math.exp(-12 * dt));
  if (shakeAmt > 0) { camera.position.x += rand(-1, 1) * shakeAmt; camera.position.y += rand(-1, 1) * shakeAmt; shakeAmt = Math.max(0, shakeAmt - dt * 2); }
  camera.lookAt(camLook);
  sun.position.set(player.pos.x + 25, player.pos.y + 55, player.pos.z + 18); sun.target.position.copy(player.pos);
}

// =====================================================================
//  HUD
// =====================================================================
let shownFruit = save.fruit;
function bumpFruitHUD() { const n = $('fruitnum'); n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); }
function refreshBabyHUD(popId = -1, home = false) {
  const row = $('babyrow');
  if (!row.children.length) row.innerHTML = babies.map(() => '<div class="slot"><img></div>').join('');
  babies.forEach((b, i) => {
    const el = row.children[i], st = save.rescued.includes(b.id) ? 'home' : (b.state === 'follow' || b.state === 'deliver') ? 'follow' : '';
    el.className = 'slot ' + st; const src = st ? b.picOn : b.picOff; if (el.firstChild.getAttribute('src') !== src) el.firstChild.src = src;
    if (i === popId) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  });
}
function refreshDinoHUD() {
  $('dinos').innerHTML = dinoPics.map((p, i) => `<div class="dino ${i === player.dino ? 'cur' : ''} ${save.dinos.includes(i) ? '' : 'locked'}"><img src="${save.dinos.includes(i) ? p.on : p.off}"></div>`).join('');
  const icons = { rex: ['🦘', '💥'], ptero: ['🪶', '💨'], brachio: ['🦘', '🥚'] }[curDino().key];
  const a = document.querySelector('.tb.a'), x = document.querySelector('.tb.x'); if (a) a.textContent = icons[0]; if (x) x.textContent = icons[1];
}
function renderControls() {
  if (isTouch && !usingPad) { $('controls').innerHTML = ''; return; }
  const key = curDino().key, ic = { rex: ['🦘', '💥'], ptero: ['🪶', '💨'], brachio: ['🦘', '🥚'] }[key];
  const b = (t, c) => `<div class="btn" style="background:${c}">${t}</div>`, k = t => `<div class="key">${t}</div>`;
  const rows = usingPad
    ? [[b('A', '#2ecc40'), ic[0]], [b('X', '#1e90ff'), ic[1]], [b('B', '#e53935'), '📣'], [b('Y', '#f4c20d'), '🔄']]
    : [[k('Space'), ic[0]], [k('J') + k('🖱️'), ic[1]], [k('K'), '📣'], [k('Tab'), '🔄']];
  $('controls').innerHTML = rows.map(r => `<div class="ctl">${r[0]}<span>${r[1]}</span></div>`).join('');
}
function updateHUD(dt) {
  if (shownFruit !== save.fruit) {
    const diff = save.fruit - shownFruit;
    shownFruit = diff > 0 ? Math.min(save.fruit, shownFruit + Math.max(1, Math.ceil(diff * Math.min(1, dt * 10)))) : save.fruit;
    $('fruitnum').textContent = shownFruit;
  }
}

// =====================================================================
//  Setup
// =====================================================================
buildWorld();
initBirds(); initButterflies();
buildPrompts();
promptSprite = spriteFromCanvas(cv(4, 4), 3.2, 2.1); promptSprite.visible = false; scene.add(promptSprite);
// put eggs where they belong (or babies in the nest if already rescued)
const PILE_FOR = { 4: piles[0], 5: piles[1], 6: piles[2] };
const NESTTREE_FOR = { 10: nestTrees[0], 11: nestTrees[1] };
babies.forEach(b => {
  if (save.rescued.includes(b.id)) {
    b.state = 'nest'; b.eggMesh.visible = false; b.beam.visible = false; b.mesh.visible = true;
    const a = rand(0, TAU), rr = rand(0, NEST.r - 2.5); b.pos.set(NEST.x + Math.cos(a) * rr, NEST.floor, NEST.z + Math.sin(a) * rr); b.tgt.copy(b.pos);
    return;
  }
  if (b.need === 'rock') { const p = PILE_FOR[b.id]; p.egg = b; b.state = 'hidden'; b.eggMesh.visible = false; b.pos.set(p.x, p.y, p.z); }
  else if (b.need === 'nest') b.pos.copy(NESTTREE_FOR[b.id].nest);
  else b.pos.y = groundAt(b.def.x, b.def.z, 50);
  b.eggMesh.position.copy(b.pos);
});
// friends: ridden / home / wild
dinoModels.forEach((d, i) => { if (d.mode === 'wild') { const s = spriteFromCanvas(bubble(g => { emoji(g, '💖', 128, 72, 90); }), 2.6, 1.7); scene.add(s); friendSprites[i] = s; } });
dinoModels[0].mode = 'ridden'; attachRider(dinoModels[0]);
player.dino = 0;
refreshBabyHUD(); refreshDinoHUD(); renderControls();
$('fruitnum').textContent = save.fruit;

// =====================================================================
//  Main loop
// =====================================================================
let started = false, time = 0, last = performance.now(), persistT = 0;
function anyInput() {
  A.init();
  if (started) return;
  started = true; $('title').classList.add('hide'); $('hud').classList.add('show');
  SFX.voice('rex'); curDino().st.roarT = 0.8; prevBtn = { jump: true, act: true, voice: true, swap: true, swapPrev: true };
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  readInput();
  if (started) updatePlayer(dt);
  else { const d = curDino(); d.root.position.copy(player.pos); d.root.rotation.y = player.yaw; animateDino(d, dt, { speed: 0, air: false }); }
  updateOtherDinos(dt);
  friendSprites.forEach((s, i) => { if (!s) return; const d = dinoModels[i]; s.visible = d.mode === 'wild'; if (s.visible) { s.position.copy(d.root.position); s.position.y += CONFIG.dinos[d.key].height + 2.2 + Math.sin(time * 3) * 0.3; } });
  const eggNeed = updateBabies(dt, time);
  updateFruit(dt); updateBirds(dt); updateButterflies(dt, time);
  updatePiles(dt); updateMushrooms(dt); updateVolcano(dt, time); updateWaterfalls(dt); updateParty(dt);
  for (const t of trees) t.cd -= dt;
  const guideNeed = updateGuide(dt, time);
  updatePrompt(dt, guideNeed, eggNeed);
  updateFX(litFX, dt); updateFX(glowFX, dt); updateRings(dt);
  WORLD.foam.material.opacity = 0.4 + Math.sin(time * 1.5) * 0.15; WORLD.foam.scale.setScalar(1 + Math.sin(time * 1.5) * 0.004);
  WORLD.clouds.rotation.y += dt * 0.004;
  if (started) updateCamera(dt);
  else {
    const a = time * 0.08; camera.position.set(Math.sin(a) * 42, 20, Math.cos(a) * 42 + 4); camera.lookAt(0, 3, 0);
    sun.position.set(25, 55, 18); sun.target.position.set(0, 0, 0);
  }
  updateHUD(dt);
  persistT += dt; if (persistT > 3) { persistT = 0; persist(); }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

// small debug hook for automated tests
window.__game = {
  player, babies, piles, save, dinoModels, followers,
  teleport(x, z, y) { player.pos.set(x, y ?? groundAt(x, z, 50), z); player.vel.set(0, 0, 0); player.lastSafe.copy(player.pos); camLook.copy(player.pos); },
  setDino(i) { if (!save.dinos.includes(i)) save.dinos.push(i); dinoModels[i].mode = 'home'; setDino(i); },
  unlock(i) { unlockDino(i); },
  face(yaw) { player.yaw = yaw; camYaw = yaw + Math.PI; },
  guide() { guideT = 99; },
  scene, renderer, camera,
  prof2() {
    const gl = renderer.getContext(), px = new Uint8Array(4), fin = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const tr = () => { const t = performance.now(); renderer.render(scene, camera); fin(); return +(performance.now() - t).toFixed(0); };
    tr(); const base = tr(), out = { base };
    scene.children.forEach((c, i) => { if (!c.visible) return; c.visible = false; const t = tr(); c.visible = true; if (base - t > base * 0.08) out[i + ':' + c.type + ':' + (c.geometry ? c.geometry.type : '') + ':' + (c.count ?? '')] = t; });
    return out;
  },
  prof() {
    const T = {}, tm = (n, f) => { const t = performance.now(); f(); T[n] = +(performance.now() - t).toFixed(1); };
    const gl = renderer.getContext(), px = new Uint8Array(4), fin = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    tm('player', () => updatePlayer(0.016)); tm('others', () => updateOtherDinos(0.016)); tm('babies', () => updateBabies(0.016, time));
    tm('fruit', () => updateFruit(0.016)); tm('birds', () => updateBirds(0.016)); tm('bfly', () => updateButterflies(0.016, time));
    tm('guide', () => updateGuide(0.016, time)); tm('cam', () => updateCamera(0.016)); tm('fx', () => { updateFX(litFX, 0.016); updateFX(glowFX, 0.016); });
    tm('render', () => { renderer.render(scene, camera); fin(); });
    sun.castShadow = false; tm('renderNoShadow', () => { renderer.render(scene, camera); fin(); }); sun.castShadow = true;
    return T;
  },
  info() { return { renderCalls: renderer.info.render.calls, tris: renderer.info.render.triangles, pos: player.pos.toArray().map(v => +v.toFixed(2)), dino: curDino().key, followers: followers.length, rescued: save.rescued.length, fruit: save.fruit, states: babies.map(b => b.state).join(',') }; },
};
