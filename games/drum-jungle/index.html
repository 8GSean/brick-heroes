<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Drum Jungle</title>
<meta name="description" content="A jungle music toy: bonk, bounce and dance to build a song with your animal band.">
<meta name="theme-color" content="#2f7a4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    background: #2f7a4f; font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --u: clamp(50px, 12.5vmin, 82px); }

  /* ---- home button (same in every Brick Arcade game) ---- */
  #home { position: fixed; left: calc(var(--sl) + 12px); top: calc(var(--st) + 12px); width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,.82); box-shadow: 0 4px 12px rgba(0,0,0,.35); display: grid; place-items: center; font-size: 30px;
    text-decoration: none; z-index: 9999; }
  #home:active { transform: scale(.92); }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #hud.show { opacity: 1; }

  /* band members (picture counter) */
  #band { position: absolute; left: 50%; top: calc(var(--st) + 10px); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px 10px;
    background: rgba(20,50,30,.45); border-radius: 40px; align-items: center; }
  .fr { width: 50px; height: 50px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); display: grid; place-items: center; font-size: 30px;
    background: rgba(0,0,0,.25); transition: transform .2s; }
  .fr span { filter: brightness(0); opacity: .45; }
  .fr.got { background: radial-gradient(circle at 40% 35%, #fff8cf, #ffc94a); border-color: #fff; box-shadow: 0 0 14px #ffd54a; }
  .fr.got span { filter: none; opacity: 1; }
  .fr.pop { animation: pop .6s; }
  .fr.near { animation: wig .45s ease-in-out infinite; border-color: #ffe066; }
  @keyframes pop { 30% { transform: scale(1.5) rotate(-10deg); } 60% { transform: scale(.9); } }
  @keyframes wig { 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(12deg) scale(1.1); } }
  #trophy { font-size: 34px; display: none; animation: bob 1.2s ease-in-out infinite; }
  #trophy.show { display: block; }

  /* top right: mute + groove */
  #mute { position: absolute; right: calc(var(--sr) + 14px); top: calc(var(--st) + 12px); pointer-events: auto; font-size: 28px; background: rgba(20,50,30,.5);
    border: 0; border-radius: 50%; width: 52px; height: 52px; cursor: pointer; }
  #groove { position: absolute; right: calc(var(--sr) + 12px); top: calc(var(--st) + 72px); display: flex; gap: 4px; align-items: center;
    background: rgba(20,50,30,.5); border-radius: 30px; padding: 4px 6px; pointer-events: auto; }
  #groove .g { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; opacity: .45; cursor: pointer; transition: transform .15s; }
  #groove .g.on { opacity: 1; background: radial-gradient(circle, #fff6c2, #ffb703); transform: scale(1.12); box-shadow: 0 0 10px #ffd54a; }

  /* instrument chip */
  #inst { position: absolute; left: 50%; bottom: calc(var(--sb) + 12px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    background: rgba(20,50,30,.5); border-radius: 40px; padding: 6px 14px 6px 6px; }
  #instIco { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; border: 4px solid #fff; background: #ffd23f; transition: transform .1s; }
  #instIco.hit { transform: scale(1.2); }
  #keys { display: flex; gap: 3px; align-items: flex-end; }
  #keys i { display: block; width: 14px; height: 34px; border-radius: 0 0 5px 5px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.3); transition: transform .08s, background .08s; }
  #keys i.on { transform: translateY(3px); background: #ffd23f; }
  #keys .kk { color: #fff; font-size: 16px; margin-left: 6px; align-self: center; }
  #tkeys { display: none; gap: 8px; }
  .tk { width: calc(var(--u) * .75); height: calc(var(--u) * .75); border-radius: 50%; border: 3px solid #fff; pointer-events: auto; touch-action: none; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .tk.down { transform: translateY(3px) scale(.92); }

  /* controls hint */
  #controls { position: absolute; left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 14px); display: flex; flex-direction: column; gap: 5px; }
  .ctl { display: flex; align-items: center; gap: 8px; background: rgba(20,50,30,.5); padding: 3px 12px 3px 4px; border-radius: 22px; color: #fff; font-size: 21px; }
  .btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.85); }
  .key { min-width: 30px; height: 28px; border-radius: 7px; background: #f2f2f2; color: #222; padding: 0 6px; display: grid; place-items: center; font-size: 13px; box-shadow: 0 3px 0 #999; }

  /* touch controls */
  #touch { position: absolute; inset: 0; display: none; }
  body.touch #touch { display: block; }
  body.touch #controls, body.touch #keys { display: none; }
  body.touch #tkeys { display: flex; }
  body.touch #inst { pointer-events: auto; bottom: calc(var(--sb) + 10px); }
  body.touch #instIco { width: 50px; height: 50px; font-size: 30px; }
  #stickzone { position: absolute; left: 0; bottom: 0; width: 40%; top: 25%; pointer-events: auto; touch-action: none; }
  #stick { position: absolute; width: calc(var(--u) * 1.9); height: calc(var(--u) * 1.9); margin: calc(var(--u) * -.95) 0 0 calc(var(--u) * -.95); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08) 40%, rgba(255,255,255,.22)); border: 3px solid rgba(255,255,255,.55); opacity: .45; pointer-events: none; }
  #stick.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * .85); height: calc(var(--u) * .85); margin: calc(var(--u) * -.425) 0 0 calc(var(--u) * -.425); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #e7dcc8 60%, #b8a888); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #pad { position: absolute; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 14px); width: calc(var(--u) * 2.7); height: calc(var(--u) * 2.7); }
  .tb { position: absolute; width: var(--u); height: var(--u); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--u) * .46); color: #fff;
    border: 3px solid rgba(255,255,255,.9); box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.15); pointer-events: auto; touch-action: none; opacity: .9; }
  .tb.down { transform: translateY(3px) scale(.92); opacity: 1; }
  .tb.a { width: calc(var(--u) * 1.25); height: calc(var(--u) * 1.25); right: 0; bottom: calc(var(--u) * .2); background: #2ecc40; }
  .tb.x { right: calc(var(--u) * 1.45); bottom: calc(var(--u) * .1); background: #1e90ff; }
  .tb.y { right: calc(var(--u) * 1.4); bottom: calc(var(--u) * 1.35); background: #f4c20d; }
  .tb.b { right: calc(var(--u) * .2); bottom: calc(var(--u) * 1.65); background: #e53935; }
  @media (orientation: portrait) {
    .fr { width: 36px; height: 36px; font-size: 21px; border-width: 2px; } #band { gap: 3px; padding: 4px 6px; top: calc(var(--st) + 76px); }
    #stickzone { width: 55%; top: 45%; }
  }

  /* big celebration pictures */
  #joinpop { position: fixed; left: 50%; top: 40%; font-size: 150px; transform: translate(-50%,-50%); opacity: 0; pointer-events: none; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); }
  #joinpop.show { animation: joinfly 2.2s ease-in forwards; }
  @keyframes joinfly { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(-30deg); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.3) rotate(8deg); }
    30% { transform: translate(-50%,-50%) scale(1); } 70% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-260%) scale(.25); } }
  #party { position: fixed; left: 50%; top: 34%; transform: translate(-50%,-50%); font-size: 120px; opacity: 0; pointer-events: none; white-space: nowrap; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); }
  #party.show { animation: party 6s ease-out forwards; }
  @keyframes party { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1.25); } 22% { transform: translate(-50%,-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-80%) scale(1.1); } }

  /* title */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0) 30%, rgba(10,50,20,.55)); transition: opacity .6s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(44px, min(12vw, 19vh), 150px); margin: 0; color: #ffe14d; -webkit-text-stroke: 5px #1f7a2e; letter-spacing: 3px; text-align: center; line-height: .92;
    text-shadow: 0 10px 0 #0e4a1a, 0 18px 24px rgba(0,0,0,.45); transform: rotate(-3deg); font-weight: normal; }
  #title .sub { margin-top: min(22px, 3vh); font-size: clamp(36px, min(6vw, 9vh), 70px); filter: drop-shadow(0 4px 0 rgba(0,0,0,.3)); animation: sway 1.2s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(6deg) translateY(-6px); } }
  #title .press { margin-top: min(40px, 5vh); display: flex; gap: 22px; align-items: center; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) scale(1.05); } }
  .bigA { width: 96px; height: 96px; border-radius: 50%; background: #2ecc40; color: #fff; font-size: 56px; display: grid; place-items: center; box-shadow: 0 7px 0 #1a8a28; border: 5px solid #fff; }
  .bigIco { font-size: 70px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
  #reset { position: absolute; right: 14px; bottom: 12px; font: 14px system-ui, sans-serif; background: rgba(0,0,0,.25); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; opacity: .6; }
  @media (max-height: 500px) { .bigA { width: 72px; height: 72px; font-size: 42px; } .bigIco { font-size: 54px; } }
</style>

<a id="home" href="../../index.html" title="Home">🏠</a>

<div id="hud">
  <div id="band"></div>

</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';

// =====================================================================
//  CONFIG: tweak me!
// =====================================================================
const CONFIG = {
  BPM: 100,              // speed of the Beat Circle (each stone is half a beat)
  STEPS: 16,             // stones in the Beat Circle
  MAX_NOTES: 28,         // most notes the loop remembers (oldest are dropped)
  MAX_PER_STEP: 3,       // most notes on one stone
  SCALE: [0, 2, 4, 7, 9],// pentatonic scale: every note sounds nice together
  MOVE_SPEED: 7.5,
  JUMP: 11.5,
  DOUBLE_JUMP: 10.5,
  GRAVITY: 30,
  MUSHROOM_BOUNCE: 15,   // how high mushrooms throw you
  FRIEND_RADIUS: 3.6,    // how close you must get to a hidden friend
  CAM_DIST: 11.5,
  CAM_PITCH: 0.42,
  FIREFLIES: 170,
  TREES: 240,
  START_GROOVE: 1,       // 0 = none, 1 = soft shaker, 2 = bongos
};

// =====================================================================
//  Helpers
// =====================================================================
const V3 = THREE.Vector3;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mod = (n, m) => ((n % m) + m) % m;
function angLerp(a, b, t) { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const srng = mulberry32(777);
const sr = (a, b) => a + srng() * (b - a);
// polar position: angle in degrees (0 = east/+x, 90 = north/-z)
const polar = (a, R, cx = 0, cz = 0) => [cx + Math.cos(a * DEG) * R, cz - Math.sin(a * DEG) * R];
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function degMidi(base, deg) { const o = Math.floor(deg / 5), i = mod(deg, 5); return Math.max(30, base + o * 12 + CONFIG.SCALE[i]); }

// =====================================================================
//  Save data
// =====================================================================
const SAVE_KEY = 'brick-arcade-drum-jungle';
let save = { found: [], loop: [], groove: CONFIG.START_GROOVE, concert: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
let saveTimer = 0;
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function persistSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 600); }
$('reset').addEventListener('click', e => {
  e.stopPropagation();
  if (confirm('Start over? Your band and song will be reset.')) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }
});

// =====================================================================
//  Instruments. base = lowest MIDI note, vol = loudness
// =====================================================================
const INST = {
  marimba: { emoji: '🪨', color: '#8fb8e8', base: 60, vol: .9 },
  log:     { emoji: '🪵', color: '#d9893f', base: 48, vol: 1 },
  bell:    { emoji: '🍄', color: '#ff7aa8', base: 72, vol: .5 },
  whistle: { emoji: '🦜', color: '#ff5b4f', base: 72, vol: .5 },
  horn:    { emoji: '🌺', color: '#ff9f43', base: 60, vol: .6 },
  wood:    { emoji: '🥥', color: '#b07a45', base: 72, vol: .8 },
  plip:    { emoji: '🍃', color: '#43d6b5', base: 72, vol: .7 },
  chime:   { emoji: '💎', color: '#a8ecff', base: 84, vol: .45 },
  frog:    { emoji: '🐸', color: '#6fd24a', base: 36, vol: .8 },
  monkey:  { emoji: '🐒', color: '#c08a55', base: 60, vol: .55 },
  kick:    { emoji: '👣', color: '#ffd23f', base: 36, vol: 1 },
  clap:    { emoji: '👏', color: '#ffe0b0', base: 60, vol: .7 },
  // friends' instruments (unlocked when you find them)
  banjo:   { emoji: '🪕', color: '#7ee05a', base: 60, vol: .6 },
  sax:     { emoji: '🎷', color: '#ffb02e', base: 60, vol: .5 },
  trumpet: { emoji: '🎺', color: '#ffd23f', base: 60, vol: .45 },
  tuba:    { emoji: '📯', color: '#b48cff', base: 36, vol: .9 },
  maracas: { emoji: '🐍', color: '#ff7ac8', base: 60, vol: .8 },
  glock:   { emoji: '🎹', color: '#7fd8ff', base: 84, vol: .5 },
  ooh:     { emoji: '🦇', color: '#c39bff', base: 72, vol: .55 },
  steel:   { emoji: '🥁', color: '#ff8a5c', base: 60, vol: .6 },
};
const PIANO_BASE = ['marimba', 'log', 'bell', 'whistle', 'horn', 'wood', 'plip', 'chime', 'frog', 'monkey'];

// =====================================================================
//  Audio: everything synthesized with Web Audio
// =====================================================================
const AU = (() => {
  let ctx = null, master, dry, verbIn, noiseBuf, muted = false, t0 = 0, nextStep = 0;
  const stepDur = 60 / CONFIG.BPM / 2;
  const perf0 = performance.now() / 1000;
  let onStep = () => {};
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = muted ? 0 : .8; master.connect(comp);
    dry = ctx.createGain(); dry.connect(master);
    // soft jungle reverb made from decaying noise
    const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const verb = ctx.createConvolver(); verb.buffer = ir; verbIn = ctx.createGain(); verbIn.gain.value = .9; verbIn.connect(verb); verb.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // keep the beat in phase with the visual stones that were already turning
    const vpos = (performance.now() / 1000 - perf0) / stepDur;
    t0 = ctx.currentTime + .1 - vpos * stepDur;
    nextStep = Math.ceil((ctx.currentTime + .1 - t0) / stepDur);
    setInterval(sched, 25);
  }
  function sched() {
    if (!ctx || ctx.state !== 'running') return;
    let tt = t0 + nextStep * stepDur;
    if (tt < ctx.currentTime - .1) { nextStep = Math.ceil((ctx.currentTime + .05 - t0) / stepDur); tt = t0 + nextStep * stepDur; }
    while (tt < ctx.currentTime + .12) { onStep(nextStep, tt); nextStep++; tt = t0 + nextStep * stepDur; }
  }
  // ---- building blocks ----
  function bus(pan, verbAmt) {
    const g = ctx.createGain(); let n = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); n = p; }
    n.connect(dry); const s = ctx.createGain(); s.gain.value = verbAmt; n.connect(s); s.connect(verbIn);
    return g;
  }
  function E(t, a, peak, d, dest) {   // gain envelope
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(Math.max(.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
    g.connect(dest); return g;
  }
  function O(type, f, t, stop, dest) { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (dest) o.connect(dest); o.start(t); o.stop(stop); return o; }
  function F(type, f, q, dest) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 1; b.connect(dest); return b; }
  function N(t, dur, vol, type, freq, dest, q) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = F(type, freq, q || 1, dest);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(g); g.connect(f); s.start(t, Math.random() * .5); s.stop(t + dur + .05); return f;
  }
  function vib(o, t, rate, depth, dur) { const l = O('sine', rate, t, t + dur, null); const g = ctx.createGain(); g.gain.value = depth; l.connect(g); g.connect(o.frequency); }

  // ---- the instruments ----
  const SY = {
    marimba(t, f, v, d) { O('sine', f, t, t + .9, E(t, .002, v, .75, d)); O('sine', f * 4, t, t + .2, E(t, .001, v * .25, .1, d)); O('sine', f * 9.2, t, t + .06, E(t, .001, v * .1, .03, d)); },
    log(t, f, v, d) {
      const o = O('sine', f * 1.6, t, t + .55, E(t, .003, v, .42, d)); o.frequency.exponentialRampToValueAtTime(f, t + .035);
      O('sine', f * 2.76, t, t + .2, E(t, .002, v * .3, .12, d)); N(t, .06, v * .6, 'lowpass', 500, d);
    },
    frog(t, f, v, d) {

    if (nearZone(x, z, 1.8) || (x > RIVER.x0 - 2 && x < RIVER.x1 + 2 && z > 10)) continue;
    if (trees.some(t => Math.hypot(t.x - x, t.z - z) < 3.2)) continue;

  }
  instanced(G.cylT, lam('#7a5232'), trees.map(t => ({ x: t.x, z: t.z, sx: t.w, sy: t.h, sz: t.w, ry: t.ry })));
  const crowns = [];
  for (const t of trees) {
    crowns.push({ x: t.x, y: t.h, z: t.z, sx: t.c, sy: t.c * .8, ry: t.ry });
    if (srng() < .6) crowns.push({ x: t.x + sr(-1.5, 1.5), y: t.h + sr(-1.6, -.4), z: t.z + sr(-1.5, 1.5), sx: t.c * .7, sy: t.c * .55, ry: t.ry });
  }

  // bushes & ferns around the edge of every area
  const bushes = [], ferns = [], flowers = [], grass = [];
  for (const zn of ZONES) {

    for (let i = 0; i < n; i++) {
      const a = srng() * TAU, R = zn[2] + sr(-.6, 3.5), x = zn[0] + Math.cos(a) * R, z = zn[1] + Math.sin(a) * R;

    }
  }

    const zn = ZONES[[0, 0, 4, 12, 16, 16][Math.floor(srng() * 6)]], a = srng() * TAU, R = Math.sqrt(srng()) * (zn[2] - 1);
    const x = zn[0] + Math.cos(a) * R, z = zn[1] + Math.sin(a) * R;

  }
  // tall grass in the meadow (a friend hides in it!)
  for (let i = 0; i < 90; i++) {

    grass.push({ x, z, sx: sr(.12, .2), sy: sr(1.2, 2.2), ry: srng() * TAU, rx: sr(-.2, .2), rz: sr(-.2, .2) });
  }
  instanced(G.ico1, swayMat('#ffffff', .05), bushes, () => GREENS[Math.floor(srng() * GREENS.length)]);
  instanced(G.cone5, swayMat('#ffffff', .12), ferns.concat(grass), () => GREENS[Math.floor(srng() * GREENS.length)]);
  instanced(G.ico, swayMat('#ffffff', .2), flowers, () => ['#ff6fa5', '#ffd23f', '#ffffff', '#ff8f4a', '#c98bff'][Math.floor(srng() * 5)]);
  // hanging vines in the canopy
  const vines = [];
  for (const t of trees) if (srng() < .35 && Math.hypot(t.x, t.z) < 60) vines.push({ x: t.x + sr(-1, 1), y: t.h - 3.5, z: t.z + sr(-1, 1), sx: .05, sy: 3.5 });

const things = [];
function addThing(o) {
  const t = Object.assign({ deg: 0, oct: 0, y: 0, h: 1, r: .7, active: true, sq: 0, sqv: 0, glow: 0, cool: 0, touch: false, hopY: 0, hopV: 0, mats: [], riffI: 0, dance: 0 }, o);
  t.pos = new V3(t.x, t.y, t.z); t.y0 = t.y; t.y1 = t.y + t.h;
  t.g.position.copy(t.pos); if (!t.g.parent) scene.add(t.g);
  t.g.traverse(m => { if (m.isMesh && m.material.userData && m.material.userData.glow && !t.mats.includes(m.material)) t.mats.push(m.material); });
  // static ground shadows go into the world so they merge into one draw call
  t.g.children.filter(c => c.material === blobMat).forEach(b => { t.g.remove(b); b.position.set(t.x, t.y + .03, t.z); scene.add(b); });
  for (const m of t.mats) { m.userData.base = m.color.clone(); m.userData.em = m.emissive.clone(); }
  if (t.solid || t.platform) t.col = addCol(t.x, t.z, t.r, t.y + t.h, { y0: t.y, solid: !!t.solid, platform: !!t.platform, thing: t });
  t.id = things.length; things.push(t); return t;
}

// =====================================================================
//  Merge small static meshes that share a material (keeps draw calls low on Chromebooks)
// =====================================================================
function mergeInto(list) {
  let n = 0; const parts = [];
  for (const m of list) {
    m.updateMatrix(); let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    g.applyMatrix4(m.matrix); if (m.matrix.determinant() < 0) { const p = g.attributes.position.array; for (let i = 0; i < p.length; i += 9) for (let k = 0; k < 3; k++) { const t = p[i + 3 + k]; p[i + 3 + k] = p[i + 6 + k]; p[i + 6 + k] = t; } }
    parts.push(g); n += g.attributes.position.count;
  }
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3); let o = 0;
  for (const g of parts) { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; g.dispose(); }
  const out = new THREE.BufferGeometry(); out.setAttribute('position', new THREE.BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); out.computeBoundingSphere();
  return out;
}
function compact(node) {
  const byMat = new Map();
  for (const c of node.children) {
    if (c.isMesh && !c.isInstancedMesh && !c.userData.keep && c.geometry.attributes.normal) { if (!byMat.has(c.material)) byMat.set(c.material, []); byMat.get(c.material).push(c); }
    else if (!c.isMesh && c.children.length) compact(c);
  }
  for (const [mat, list] of byMat) {
    if (list.length < 2) continue;
    const m = new THREE.Mesh(mergeInto(list), mat); m.renderOrder = list[0].renderOrder;
    for (const c of list) node.remove(c);
    node.add(m);
  }
}

    if (Math.abs(dx) > t.r + 1 || Math.abs(dz) > t.r + 1) { t.touch = false; continue; }
    const inside = Math.hypot(dx, dz) < t.r + PR + .08 && P.pos.y < t.y1 - .05 && P.pos.y + 1.5 > t.y0 && !(P.support && P.support.thing === t);
    if (inside && !t.touch && t.cool <= 0) strike(t, .8);
    t.touch = inside;
  }
  // actions
  if (input.bonk) bonk();
  if (input.dance) dance();
  if (input.stomp) stomp();
}

// =====================================================================
//  Animation
// =====================================================================
function animateMonkey(dt) {
  const m = MK;
  m.root.position.copy(P.pos); m.root.rotation.y = P.yaw;
  P.sqv += (-260 * P.sq - 13 * P.sqv) * dt; P.sq += P.sqv * dt;
  const sq = clamp(P.sq, -.3, .3);
  m.body.scale.set(1 - sq * .5, 1 + sq, 1 - sq * .5);
  const hs = Math.hypot(P.vel.x, P.vel.z);
  P.walk += hs * dt * 1.7;
  const sw = P.onGround ? Math.sin(P.walk) * Math.min(1, hs / 4) : 0;
  P.beat = Math.max(0, P.beat - dt * 4);
  let armLz = -.2, armRz = .2, armLx = -sw * .9, armRx = sw * .9, legLx = sw * .9, legRx = -sw * .9;
  m.body.position.y = P.onGround ? Math.abs(Math.sin(P.walk)) * .07 * Math.min(1, hs / 4) : 0;
  m.body.rotation.set(0, 0, 0); m.head.rotation.set(0, 0, 0);
  if (!P.onGround) { armLz = -2.3; armRz = 2.3; armLx = armRx = 0; legLx = -.6; legRx = .4; }
  if (P.onGround && hs < 1 && events.length) { m.body.position.y += P.beat * .08; m.head.rotation.x = P.beat * .15; }
  if (P.flipT > 0) { P.flipT -= dt; m.body.rotation.x = (1 - P.flipT / .5) * TAU; }
  if (P.danceT > 0) {
    P.danceT = Math.max(0, P.danceT - dt * 1.1); const t = 1 - P.danceT, w = Math.sin(t * Math.PI);
    switch (P.danceMove) {
      case 0: m.body.rotation.y = t * TAU; armLz = -1.5; armRz = 1.5; break;
      case 1: armLz = -2.6 + Math.sin(t * 30) * .3; armRz = 2.6 - Math.sin(t * 30) * .3; m.body.rotation.z = Math.sin(t * 25) * .2; m.body.position.y += Math.abs(Math.sin(t * 12)) * .3; break;
      case 2: m.body.rotation.x = -t * TAU; m.body.position.y += w * 1.2; armLz = -2.4; armRz = 2.4; legLx = legRx = -1; break;
      case 3: m.head.rotation.x = Math.sin(t * 28) * .3; legLx = Math.max(0, Math.sin(t * 20)) * -1.2; legRx = Math.max(0, -Math.sin(t * 20)) * -1.2; m.body.rotation.z = Math.sin(t * 10) * .25; armLx = armRx = -1.2; armLz = -.6; armRz = .6; break;
    }
  }
  if (P.bonkT > 0) { P.bonkT -= dt; const w = Math.sin((1 - P.bonkT / .3) * Math.PI); armRx = -2.4 * w; armRz = .3; m.body.rotation.x = .25 * w; }
  if (P.stompT > 0) { P.stompT -= dt; const w = Math.sin((1 - P.stompT / .35) * Math.PI); legRx = -1.2 * w; armLz = -1.2 * w; armRz = 1.2 * w; }
  if (P.playT > 0) { P.playT -= dt; armLx = armRx = -1.3; armLz = -.4 + Math.sin(time * 40) * .2; armRz = .4 - Math.sin(time * 40) * .2; }
  const L = 1 - Math.exp(-20 * dt);
  m.armL.rotation.z = lerp(m.armL.rotation.z, armLz, L); m.armR.rotation.z = lerp(m.armR.rotation.z, armRz, L);
  m.armL.rotation.x = lerp(m.armL.rotation.x, armLx, L); m.armR.rotation.x = lerp(m.armR.rotation.x, armRx, L);
  m.legL.rotation.x = lerp(m.legL.rotation.x, legLx, L); m.legR.rotation.x = lerp(m.legR.rotation.x, legRx, L);
  m.tail.rotation.z = Math.sin(time * 3) * .2;
  // shadow on whatever is below
  let gy = inWater(P.pos.x, P.pos.z) ? .05 : .02;
  for (const c of colliders) if (c.top <= P.pos.y + .05 && c.top > gy && Math.hypot(P.pos.x - c.x, P.pos.z - c.z) < c.r) gy = c.top + .02;
  mkShadow.position.set(P.pos.x, gy, P.pos.z); const sh = clamp(1 - (P.pos.y - gy) / 8, .3, 1); mkShadow.scale.set(1.1 * sh, 1, 1.1 * sh);
}
function animateThings(dt) {
  for (const t of things) {
    if (!t.active && !t.friend) continue;
    if (t.friend) { t.sqv += (-300 * t.sq - 14 * t.sqv) * dt; t.sq = clamp(t.sq + t.sqv * dt, -.4, .4); continue; }
    if (Math.abs(t.sq) > .001 || Math.abs(t.sqv) > .01) {
      t.sqv += (-300 * t.sq - 14 * t.sqv) * dt; t.sq += t.sqv * dt;
      const s = clamp(t.sq, -.35, .35);
      t.g.scale.set(1 + s * .5, 1 - s, 1 + s * .5);
    }
    if (t.hops && (t.hopY > 0 || t.hopV > 0)) { t.hopV -= 20 * dt; t.hopY = Math.max(0, t.hopY + t.hopV * dt); if (t.hopY === 0) t.hopV = 0; t.g.position.y = t.pos.y + t.hopY; }
    if (t.glow > 0) {
      t.glow = Math.max(0, t.glow - dt * 2.2);
      for (const m of t.mats) { m.color.copy(m.userData.base).lerp(WHITE_C, t.glow * .35); m.emissive.copy(m.userData.base).multiplyScalar(t.glow * .6).add(m.userData.em); }
    }
  }
}
const WHITE_C = new THREE.Color('#ffffff');

// =====================================================================
//  World "fullness": the jungle brightens as your song grows
// =====================================================================
let fullness = 0;
function updateMood(dt) {
  fullness = lerp(fullness, events.length / CONFIG.MAX_NOTES, 1 - Math.exp(-1.5 * dt));
  const f = fullness;
  hemi.intensity = 1.25 + .55 * f; sun.intensity = 1.8 + .8 * f;
  scene.fog.color.copy(FOG_DIM).lerp(FOG_BRIGHT, f); scene.background.copy(scene.fog.color);
  skyMat.color.setScalar(.82 + .18 * f);
  SWAY.uBright.value = .02 + .12 * f;
  PU.uAmt.value = .55 + .45 * f;
  beatPulse = Math.max(0, beatPulse - dt * 4);
  SWAY.uPulse.value = beatPulse * (.4 + .6 * f + (events.length ? .3 : 0));
  // beat stones
  for (const s of stones) {
    s.glow = Math.max(0, s.glow - dt * 2.5); s.pop = Math.max(0, s.pop - dt * 4);
    if (washT <= 0) s.mat.emissive.copy(s.col).multiplyScalar(.15 + .2 * f + s.glow * .9);
    s.mesh.scale.y = .32 + s.pop * .25;
  }
  if (washT > 0) { washT -= dt; cloud.scale.setScalar(1 + Math.sin(washT * 20) * .08 + washT * .3); cloudM.emissive.set(washT > .1 ? '#223344' : '#556677'); }
  cloud.position.y = 3.6 + Math.sin(time * 1.5) * .2; cloud.rotation.y += dt * .3;
  water.material.map.offset.y -= dt * .25; fallTex.offset.y += dt * 1.6;
}

// =====================================================================
//  Start, restore and main loop
// =====================================================================
function anyInput() {
  if (started) return;
  started = true; AU.init();
  $('title').classList.add('hide'); $('hud').classList.add('show');
  setTimeout(() => AU.voice('marimba', midiHz(72), .5, 0), 50);
  [0, 2, 4, 7].forEach((d, i) => setTimeout(() => AU.voice('marimba', midiHz(degMidi(60, d)), .5, 0), 60 + i * 110));
}
// restore saved band + song
for (const id of save.found) { const f = FRIENDS.find(q => q.id === id); if (f) joinFriend(f, true); }
for (const [inst, deg, step, tid] of save.loop || []) if (INST[inst]) addEvent(inst, deg, step, tid >= 0 ? things[tid] : null);
renderBand(); renderControls(); setInst('log'); setInst('marimba');

let time = 0, last = performance.now(), hintT = 0, titleA = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  SWAY.uTime.value = time; PU.uTime.value = time; PU.uScale.value = renderer.getPixelRatio() * innerHeight / 720;
  readInput();
  if (started) { updatePlayer(dt); updateCamera(dt); }
  else {   // slow orbit behind the title
    titleA += dt * .12; camera.position.set(Math.sin(titleA) * 20, 9, Math.cos(titleA) * 20); camera.lookAt(0, 1.5, 0);
  }
  for (let i = delayed.length - 1; i >= 0; i--) { delayed[i].t -= dt; if (delayed[i].t <= 0) { delayed[i].fn(); delayed.splice(i, 1); } }
  updateBeat(); layoutIcons(dt);
  animateMonkey(dt); animateThings(dt); updateFriends(dt);
  updateParticles(dt); updateNotes(dt); updateFireworks(dt); updateMood(dt);
  if (shockT < 1) { shockT += dt * 2.5; shock.scale.setScalar(1 + shockT * 5); shock.material.opacity = (1 - shockT) * .8; }
  sky.position.copy(camera.position);
  hintT -= dt; if (hintT <= 0) { hintT = .5; updateNearHints(); }
  // skip drawing musical things that are far away (hidden by the jungle haze anyway)
  for (const t of things) t.g.visible = t.pos.distanceToSquared(camera.position) < 66 * 66;
  for (const f of FRIENDS) f.g.visible = f.g.position.distanceToSquared(camera.position) < 70 * 70;
  // ambient birds
  if (started && Math.random() < dt * .15) AU.voice('whistle', midiHz(degMidi(84, Math.floor(rand(0, 5)))), .08, rand(-.7, .7));
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// debug handle for testing
window.__game = {
  P, things, FRIENDS, get events() { return events; }, renderer, strike, joinFriend, washLoop, pianoKey, setGroove,
  tp(x, y, z) { P.pos.set(x, y, z); P.vel.set(0, 0, 0); camLook.set(x, y + 1.4, z); },
  setCam(yaw, pitch) { camYaw = yaw; camPitch = pitch; camManualT = 0; },
  drawCalls: () => renderer.info.render.calls,
  get time() { return time; },
};
</script>
</body>
