<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Arcade</title>
<meta name="description" content="Fun brick games for kids. Pick a game with a controller, keyboard or a tap.">
<meta name="theme-color" content="#8fd3ff">
<link rel="icon" type="image/png" href="games/brick-heroes/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { --sky1: #8fd3ff; --sky2: #d8f1ff; --ink: #1d2a4d; --gold: #ffd23f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(var(--sky1), var(--sky2) 70%, #b7f08a 70%, #7ccf4f);
    background-attachment: fixed; overflow-x: hidden;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
  }

  /* floating bricks in the background */
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
  .fb { position: absolute; width: 60px; height: 30px; border-radius: 5px; opacity: .55; animation: float linear infinite; }
  .fb::before, .fb::after { content: ''; position: absolute; top: -9px; width: 16px; height: 9px; border-radius: 4px 4px 0 0; background: inherit; }
  .fb::before { left: 9px; } .fb::after { right: 9px; }
  @keyframes float { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-20vh) rotate(360deg); } }

  header { text-align: center; margin: 6px 0 18px; }
  h1 { margin: 0; font-size: clamp(44px, 9vw, 96px); font-weight: 400; letter-spacing: 2px; line-height: 1;
       color: var(--gold); -webkit-text-stroke: 3px #c0262d; paint-order: stroke fill; text-shadow: 0 6px 0 #c0262d, 0 10px 20px rgba(0,0,0,.25); }
  .hint { display: inline-flex; gap: 14px; align-items: center; margin-top: 12px; font-size: 22px; background: rgba(255,255,255,.7);
          padding: 6px 16px; border-radius: 30px; }
  .key { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 6px;
         border-radius: 8px; background: #fff; box-shadow: 0 3px 0 #9aa; font-size: 18px; }
  .abtn { width: 34px; height: 34px; border-radius: 50%; background: #3cb043; color: #fff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #1f7a26; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px; max-width: 1280px; margin: 0 auto; }
  .card { position: relative; display: block; text-decoration: none; color: inherit; border-radius: 24px; overflow: hidden;
          background: var(--c1); box-shadow: 0 8px 0 var(--c2), 0 14px 26px rgba(0,0,0,.2);
          transition: transform .18s cubic-bezier(.3,1.6,.5,1), box-shadow .18s; outline: none; }
  .card .pic { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--c1), var(--c2)); display: flex; align-items: center; justify-content: center; }
  .card .pic img { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .big { font-size: 90px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .card .emo { position: absolute; left: 12px; bottom: -26px; font-size: 52px; width: 72px; height: 72px; border-radius: 50%; background: #fff;
               display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,.25); z-index: 2; }
  .card .name { padding: 32px 16px 16px 16px; font-size: 28px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); line-height: 1.05; }
  .card .tag { display: block; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; opacity: .95; margin-top: 6px; text-shadow: none; }
  .card.new::after { content: 'NEW'; position: absolute; top: 12px; right: 12px; background: var(--gold); color: #c0262d; padding: 3px 10px; border-radius: 12px; font-size: 18px; box-shadow: 0 3px 0 #c0262d; }
  .card:hover, .card.focus { transform: translateY(-6px) scale(1.04) rotate(-.6deg); box-shadow: 0 12px 0 var(--c2), 0 0 0 6px #fff, 0 0 0 11px var(--gold), 0 22px 36px rgba(0,0,0,.3); z-index: 3; }
  .card:active { transform: translateY(2px) scale(.98); }

  #sound { position: fixed; right: 14px; top: 14px; width: 52px; height: 52px; border-radius: 50%; border: 0; font-size: 26px;
           background: rgba(255,255,255,.75); box-shadow: 0 3px 10px rgba(0,0,0,.25); cursor: pointer; z-index: 10; }
  footer { text-align: center; margin-top: 34px; font-family: system-ui, sans-serif; font-size: 15px; }
  footer a { color: var(--ink); font-weight: 700; }
  @media (max-width: 560px) { .hint { font-size: 16px; gap: 8px; } .card .name { font-size: 24px; } }
  @media (hover: none) { .hint .kb { display: none; } }
</style>
</head>
<body>
<div id="sky"></div>
<button id="sound" aria-label="Talking on or off">🔊</button>

<header>
  <h1>BRICK ARCADE</h1>
  <div class="hint">
    <span>🕹️ ⬅️➡️</span><span class="abtn">A</span>
    <span class="kb"><span class="key">⏎</span></span>
    <span>👆</span>
    <span>= ▶️</span>
  </div>
</header>

<main id="grid"></main>

<footer>Made with <a href="https://claude.ai/code">Claude Code</a>. Want to build your own? Pick the 🛠️ card!</footer>

<script>
// =====================================================================
//  The games. Want to add a new one? Add a line here!
//  url: where the game lives, pic: a picture for the card (optional),
//  say: what the arcade says out loud when the card is picked.
// =====================================================================
const GAMES = [
  { name: 'Brick Heroes',         emoji: '🦸', url: 'games/brick-heroes/',  pic: 'games/brick-heroes/thumb.jpg',  c1: '#e63946', c2: '#9b1d26', tag: 'Smash, build and find gold bricks in a brick city.' },
  { name: 'Brick Buddies',        emoji: '🧱', url: 'https://8gsean.github.io/brick-buddies/', pic: 'arcade/brick-buddies.jpg', c1: '#ff9f1c', c2: '#c46d00', tag: 'A toy world full of buttons, ducks and honks.' },
  { name: 'Dino Island Rescue',   emoji: '🦖', url: 'games/dino-island/',   pic: 'games/dino-island/thumb.jpg',   c1: '#2a9d8f', c2: '#1b6b61', tag: 'Ride dinos and bring the babies home.', isNew: true },
  { name: 'Space Pup Planets',    emoji: '🐶', url: 'games/space-pup/',     pic: 'games/space-pup/thumb.jpg',     c1: '#6a4cff', c2: '#3b24b8', tag: 'Hop around tiny planets and help the aliens.', isNew: true },
  { name: 'Monster Truck Junkyard', emoji: '🛻', url: 'games/monster-trucks/', pic: 'games/monster-trucks/thumb.jpg', c1: '#f4a100', c2: '#a35f00', tag: 'Crash, bash and smash everything!', isNew: true },
  { name: 'Drum Jungle',          emoji: '🐒', url: 'games/drum-jungle/',   pic: 'games/drum-jungle/thumb.jpg',   c1: '#3fae49', c2: '#22712a', tag: 'Bonk the jungle and make a song.', isNew: true },
  { name: 'Brick Learning Lab',   emoji: '🔤', url: 'games/learning-lab/',  pic: 'games/learning-lab/thumb.jpg',  c1: '#1e88e5', c2: '#0d5aa7', tag: 'Letters, numbers and typing games.', isNew: true, say: 'Learning Lab' },
  { name: 'Build Your Own!',      emoji: '🛠️', url: 'make/',                c1: '#8d5cf6', c2: '#5b2fc4', tag: 'Make your own game with Claude.', big: '🤖', say: 'Build your own game with Claude!' },
];

// ---------- build the cards ----------
const grid = document.getElementById('grid');
const cards = GAMES.map((g, i) => {
  const a = document.createElement('a');
  a.className = 'card' + (g.isNew ? ' new' : '');
  a.href = g.url;
  a.style.setProperty('--c1', g.c1); a.style.setProperty('--c2', g.c2);
  a.innerHTML = `<div class="pic"><span class="big">${g.big || g.emoji}</span><div class="emo">${g.emoji}</div></div>
    <div class="name">${g.name}<span class="tag">${g.tag}</span></div>`;
  if (g.pic) {
    const img = new Image(); img.alt = ''; img.loading = 'lazy';
    img.onerror = () => img.remove(); // no picture yet? the big emoji shows instead
    img.src = g.pic; a.querySelector('.pic').prepend(img);
  }
  a.addEventListener('mouseenter', () => focusCard(i, false));
  a.addEventListener('focus', () => focusCard(i, false));
  a.addEventListener('click', e => { e.preventDefault(); launch(i); });
  grid.appendChild(a);
  return a;
});

// ---------- floating bricks ----------
const COLORS = ['#e63946', '#ffd23f', '#2a9d8f', '#1e88e5', '#ff9f1c', '#8d5cf6', '#3fae49'];
const sky = document.getElementById('sky');
for (let i = 0; i < 14; i++) {
  const b = document.createElement('div'); b.className = 'fb';
  b.style.left = Math.random() * 100 + 'vw'; b.style.background = COLORS[i % COLORS.length];
  b.style.animationDuration = 14 + Math.random() * 16 + 's'; b.style.animationDelay = -Math.random() * 30 + 's';
  b.style.transform = `scale(${.6 + Math.random() * .8})`;
  sky.appendChild(b);
}

// ---------- sounds and talking ----------
let actx = null, talk = true;
try { talk = localStorage.getItem('brick-arcade-talk') !== 'off'; } catch (e) {}
const soundBtn = document.getElementById('sound');
soundBtn.textContent = talk ? '🔊' : '🔇';
soundBtn.onclick = () => { talk = !talk; soundBtn.textContent = talk ? '🔊' : '🔇'; try { localStorage.setItem('brick-arcade-talk', talk ? 'on' : 'off'); } catch (e) {} };
function blip(freq, len = .09, type = 'square') {
  if (!talk) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + len);
    g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len);
  } catch (e) {}
}
function say(text) {
  if (!talk || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .95; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {}
}

// ---------- picking a game ----------
let focused = -1, userActed = false;
function focusCard(i, scroll = true) {
  i = (i + cards.length) % cards.length;
  if (i === focused) return;
  if (focused >= 0) cards[focused].classList.remove('focus');
  focused = i; cards[i].classList.add('focus');
  if (scroll) cards[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  if (userActed) { blip(440 + i * 60); say(GAMES[i].say || GAMES[i].name); }
}
function launch(i) {
  blip(660, .25, 'triangle'); blip(990, .3, 'sine');
  cards[i].style.transform = 'scale(1.12)';
  setTimeout(() => { location.href = GAMES[i].url; }, 260);
}
function columns() { // how many cards per row right now
  const top = cards[0].offsetTop; let n = 0;
  for (const c of cards) { if (c.offsetTop !== top) break; n++; }
  return Math.max(1, n);
}
function move(dx, dy) {
  userActed = true;
  if (focused < 0) return focusCard(0);
  let i = focused + dx + dy * columns();
  if (dy && (i < 0 || i >= cards.length)) return; // don't wrap up/down
  focusCard(i);
}

addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight' || k === 'd') move(1, 0);
  else if (k === 'ArrowLeft' || k === 'a') move(-1, 0);
  else if (k === 'ArrowDown' || k === 's') move(0, 1);
  else if (k === 'ArrowUp' || k === 'w') move(0, -1);
  else if ((k === 'Enter' || k === ' ') && focused >= 0) launch(focused);
  else if (k === 'Enter' || k === ' ') move(0, 0);
  else return;
  e.preventDefault();
});

// gamepad: stick or D-pad to move, A to play
let prev = {}, repeatAt = 0;
function pollPads(t) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let dx = 0, dy = 0, a = false;
  for (const gp of pads) {
    if (!gp) continue;
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    dx += (gp.axes[0] > .5 || b(15) ? 1 : 0) - (gp.axes[0] < -.5 || b(14) ? 1 : 0);
    dy += (gp.axes[1] > .5 || b(13) ? 1 : 0) - (gp.axes[1] < -.5 || b(12) ? 1 : 0);
    a = a || b(0) || b(9);
  }
  const dir = dx || dy ? dx + ',' + dy : '';
  if (dir && (dir !== prev.dir || t > repeatAt)) { move(Math.sign(dx), dx ? 0 : Math.sign(dy)); repeatAt = t + (dir !== prev.dir ? 450 : 220); }
  if (a && !prev.a) { if (focused >= 0) launch(focused); else move(0, 0); }
  prev = { dir, a };
  requestAnimationFrame(pollPads);
}
requestAnimationFrame(pollPads);
addEventListener('gamepadconnected', () => { if (focused < 0) { userActed = true; focusCard(0); } });
addEventListener('pointerdown', () => { userActed = true; }, { once: true });

// clean up the old Brick Heroes offline helper that used to live at the top of the site
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
  if (new URL(r.scope).pathname === new URL('./', location.href).pathname) r.unregister();
})).catch(() => {});
</script>
</body>
</html>
